skill: charge-challenge
version: 0.3.1
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: graph-stage
  part_of:
    - runx/charge
runners:
  challenge:
    default: true
    type: graph
    inputs:
      charge_price_packet:
        type: json
        packet: runx.payment.charge_price.v1
        required: true
        description: Native charge-price packet data.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned challenge seed.
    graph:
      name: charge-challenge
      result_from: [challenge]
      steps:
        - id: challenge
          tool: payment.charge_challenge
          inputs:
            charge_price_packet: $input.charge_price_packet
            idempotency_seed: $input.idempotency_seed
