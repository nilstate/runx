skill: charge
version: "0.3.1"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
input_definitions:
  mcp_tool_call:
    type: json
    packet: runx.payment.tool_call.v1
    required: true
    description: Inbound MCP operation request.
  provider_policy:
    type: json
    packet: runx.payment.charge_policy.v1
    required: true
    description: Provider-owned price and settlement-family policy.
  returned_credential:
    type: json
    packet: runx.payment.credential_reference.v1
    required: true
    description: Settlement family and one opaque credential reference.
  verify_capability_ref:
    type: string
    required: true
    description: Single-use provider verification capability reference.
    schema: { minLength: 1, maxLength: 512 }
  idempotency_seed:
    type: string
    required: true
    description: Stable caller-owned challenge idempotency material.
    schema: { minLength: 1, maxLength: 256 }
runners:
  mock:
    default: true
    type: graph
    inputs:
      mcp_tool_call:
        definition: mcp_tool_call
      provider_policy:
        definition: provider_policy
      returned_credential:
        definition: returned_credential
      verify_capability_ref:
        definition: verify_capability_ref
      idempotency_seed:
        definition: idempotency_seed
    examples:
      - mcp_tool_call: { tool: search.paid, arguments: { query: runx } }
        provider_policy:
          price_minor: 125
          currency: USD
          accepted_settlement_families: [mock]
          counterparty: provider:demo
          realm: test
        returned_credential: { family: mock, credential_ref: credential:mock:paid-search-001 }
        verify_capability_ref: capability:charge-verify:paid-search-001
        idempotency_seed: paid-search-001
    graph:
      name: charge-mock-plan
      result_from: [finalize]
      steps:
        - id: price
          skill: graph/charge-price
          runner: price
          inputs:
            mcp_tool_call: $input.mcp_tool_call
            provider_policy: $input.provider_policy
        - id: challenge
          skill: graph/charge-challenge
          runner: challenge
          inputs:
            idempotency_seed: $input.idempotency_seed
          context:
            charge_price_packet: price.charge_price_packet.data
        - id: verify
          skill: graph/charge-verify
          runner: verify
          inputs:
            returned_credential: $input.returned_credential
            verify_capability_ref: $input.verify_capability_ref
            settlement_family: mock
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            idempotency: challenge.charge_challenge_packet.data.idempotency
        - id: finalize
          tool: payment.charge_plan
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            charge_verification_request: verify.charge_verification_request.data
    runx:
      payment_authority:
        direction: provider_charge
        phase: plan
        settlement_family: mock
        receipt_before_forward_required: true
        runtime_forwarding_enabled: false
  mpp:
    default: false
    type: graph
    inputs:
      mcp_tool_call:
        definition: mcp_tool_call
      provider_policy:
        definition: provider_policy
      returned_credential:
        definition: returned_credential
      verify_capability_ref:
        definition: verify_capability_ref
      idempotency_seed:
        definition: idempotency_seed
    examples:
      - mcp_tool_call: { tool: search.paid, arguments: { query: runx } }
        provider_policy:
          price_minor: 125
          currency: USD
          accepted_settlement_families: [mpp]
          counterparty: provider:demo
          realm: test
        returned_credential: { family: mpp, credential_ref: credential:mpp:paid-search-001 }
        verify_capability_ref: capability:charge-verify:paid-search-001
        idempotency_seed: paid-search-001
    graph:
      name: charge-mpp-plan
      result_from: [finalize]
      steps:
        - id: price
          skill: graph/charge-price
          runner: price
          inputs:
            mcp_tool_call: $input.mcp_tool_call
            provider_policy: $input.provider_policy
        - id: challenge
          skill: graph/charge-challenge
          runner: challenge
          inputs:
            idempotency_seed: $input.idempotency_seed
          context:
            charge_price_packet: price.charge_price_packet.data
        - id: verify
          skill: graph/charge-verify
          runner: verify
          inputs:
            returned_credential: $input.returned_credential
            verify_capability_ref: $input.verify_capability_ref
            settlement_family: mpp
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            idempotency: challenge.charge_challenge_packet.data.idempotency
        - id: finalize
          tool: payment.charge_plan
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            charge_verification_request: verify.charge_verification_request.data
    runx:
      payment_authority:
        direction: provider_charge
        phase: plan
        settlement_family: mpp
        receipt_before_forward_required: true
        runtime_forwarding_enabled: false
  stripe:
    default: false
    type: graph
    inputs:
      mcp_tool_call:
        definition: mcp_tool_call
      provider_policy:
        definition: provider_policy
      returned_credential:
        definition: returned_credential
      verify_capability_ref:
        definition: verify_capability_ref
      idempotency_seed:
