skill: support-firewatch
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

policy:
  allow:
    - provider: local-input
      method: READ
      scope: runx:input:read
  deny:
    - network
    - network_mutation
    - credential_material
    - private_user_data

harness:
  cases:
    - name: breached-negative-thread-escalates
      runner: firewatch
      inputs:
        thread:
          - id: turn-1
            role: customer
            author: Maya
            timestamp: "2026-07-05T09:00:00Z"
            body: "This outage is still broken and nobody has replied. We are going to cancel if this is ignored."
          - id: turn-2
            role: agent
            author: Support
            timestamp: "2026-07-05T09:10:00Z"
            body: "We are looking into it."
          - id: turn-3
            role: customer
            author: Maya
            timestamp: "2026-07-05T10:00:00Z"
            body: "This is unacceptable. I need an update now or I will ask for a refund."
        sla_policy:
          now: "2026-07-05T11:10:00Z"
          first_response_minutes: 30
          next_response_minutes: 45
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: healthy-thread-no-escalation
      runner: firewatch
      inputs:
        thread:
          - id: turn-1
            role: customer
            author: Owen
            timestamp: "2026-07-05T10:00:00Z"
            body: "Thanks for the setup guide. The domain verification looks good now."
          - id: turn-2
            role: agent
            author: Support
            timestamp: "2026-07-05T10:08:00Z"
            body: "Great, glad it worked. Let us know if anything else comes up."
        sla_policy:
          now: "2026-07-05T10:15:00Z"
          first_response_minutes: 30
          next_response_minutes: 45
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

runners:
  firewatch:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      signals: object
      escalation: object
    inputs:
      thread:
        type: json
        required: true
        description: Support thread turns.
      sla_policy:
        type: json
        required: true
        description: SLA policy and clock.
