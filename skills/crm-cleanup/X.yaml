skill: crm-cleanup
version: "0.2.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  requires_adapter: false
  approval: conditional

policy:
  allow:
    - provider: source
      method: READ
      scope: runx:net:allowlist
    - provider: crm-transport
      method: WRITE
      scope: runx:crm:bounded-write
  deny:
    - raw_secrets
    - unallowlisted_fields
    - low_confidence_writes

harness:
  cases:
    - name: sealed_source_read_and_crm_write
      inputs:
        source_url: https://raw.githubusercontent.com/solana-payout-receipts-agent/runx/codex-crm-cleanup/fixtures/crm-cleanup/source-export.json
        source_allowlist: [raw.githubusercontent.com]
        transcript: "Dana said the rollout stalled and they want an executive review before renewing. Next step agreed: send the Q3 usage report by Friday."
        crm_schema:
          allowed_fields: [account_status, next_action]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: account_status
                  to: at_risk
                  confidence: 0.96
                  evidence_quote: "the rollout stalled and they want an executive review before renewing"
                - record_id: acct-globex
                  field: next_action
                  to: "send the Q3 usage report by Friday"
                  confidence: 0.99
                  evidence_quote: "send the Q3 usage report by Friday"
      expect:
        status: sealed
        steps: [fetch-source, parse-source, digest-transcript, reconcile, execute, finalize]
        step_outputs:
          finalize:
            subset:
              crm_cleanup_result:
                data:
                  schema: runx.crm_cleanup.v1
                  decision: updated
                  no_op: false
                  write_result:
                    status: committed
                    executed: true
        receipt: { schema: runx.receipt.v1 }

    - name: sealed_no_op_does_not_write
      inputs:
        source_url: https://raw.githubusercontent.com/solana-payout-receipts-agent/runx/codex-crm-cleanup/fixtures/crm-cleanup/source-export.json
        source_allowlist: [raw.githubusercontent.com]
        transcript: "Short call. No changes discussed."
        crm_schema:
          allowed_fields: [account_status, next_action]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates: []
      expect:
        status: sealed
        steps: [fetch-source, parse-source, digest-transcript, reconcile, execute, finalize]
        step_outputs:
          finalize:
            subset:
              crm_cleanup_result:
                data:
                  decision: no_action
                  no_op: true
                  write_result:
                    status: no_op
                    executed: false
        receipt: { schema: runx.receipt.v1 }

    - name: low_confidence_stops_without_write
      inputs:
        source_url: https://raw.githubusercontent.com/solana-payout-receipts-agent/runx/codex-crm-cleanup/fixtures/crm-cleanup/source-export.json
        source_allowlist: [raw.githubusercontent.com]
        transcript: "Dana might move the account to at risk, but she was not sure."
        crm_schema:
          allowed_fields: [account_status]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: account_status
                  to: at_risk
                  confidence: 0.42
                  evidence_quote: "might move the account to at risk"
      expect:
        status: sealed
        steps: [fetch-source, parse-source, digest-transcript, reconcile, execute, finalize]
        step_outputs:
          finalize:
            subset:
              crm_cleanup_result:
                data:
                  decision: needs_review
                  no_op: false
                  write_result:
                    status: needs_review
                    executed: false
        receipt: { schema: runx.receipt.v1 }

runners:
  crm-cleanup:
    default: true
    type: graph
    inputs:
      source_url:
        type: string
        required: true
        description: Public CRM connector-export URL fetched at run time.
      source_allowlist:
        type: json
        required: true
        description: Exact hosts permitted for the source fetch.
      transcript:
        type: string
        required: true
        description: Call transcript used as the only evidence for field changes.
      crm_schema:
        type: object
        required: true
        description: Explicit update authority.
    graph:
      name: crm-cleanup
      result_from: [finalize]
      steps:
        - id: fetch-source
          label: read the current CRM connector export
          tool: web.fetch
          scopes: [net:allowlist]
          inputs:
            url: $input.source_url
            allowlist: $input.source_allowlist
            extract: text
            max_bytes: 200000

        - id: parse-source
          label: bind the fetched source records and provenance
          context:
            fetch_result: fetch-source.fetch_result.data
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: parseSource
            outputs:
              source_snapshot: object

        - id: digest-transcript
          tool: data.digest
          inputs:
            value: $input.transcript
            encoding: utf8_text

        - id: reconcile
          label: derive only transcript-backed candidate updates
          run:
            type: agent-task
            agent: reviewer
            task: crm-cleanup-reconcile
            outputs:
              update_draft: object
          inputs:
            transcript: $input.transcript
            crm_schema: $input.crm_schema
          context:
            source_records: parse-source.source_snapshot.data.source_records
          allowed_tools: []
          artifacts:
            named_emits:
              update_draft: update_draft

        - id: execute
          label: apply allowlisted updates through the bounded CRM transport
          inputs:
            transcript: $input.transcript
            crm_schema: $input.crm_schema
          context:
            source_records: parse-source.source_snapshot.data.source_records
            update_draft: reconcile.update_draft.data
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: executeUpdates
            outputs:
              write_result: object

        - id: finalize
          label: bind source, confidence, and before-after write evidence
          context:
            source_read: parse-source.source_snapshot.data.source_read
            write_result: execute.write_result.data.write_result
            transcript_digest: digest-transcript.digest_result.data.digest
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: finalizeCrmCleanup
            outputs:
              crm_cleanup_result:
                type: object
                schema:
                  required: [schema, decision, source, updates, write_result, no_op, confidence_gate, evidence]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.crm_cleanup.v1 }
                    decision: { type: string, enum: [updated, no_action, needs_review] }
                    source:
                      type: object
                      required: [final_url, status, content_digest, fetched_at, bytes]
                      additionalProperties: false
                      properties:
                        final_url: { type: string, format: uri }
                        status: { type: number, minimum: 200, maximum: 299 }
                        content_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                        fetched_at: { type: string, minLength: 1 }
                        bytes: { type: number, minimum: 1 }
                    updates: { type: array, maxItems: 200 }
                    write_result:
                      type: object
                      required: [status, transport, executed, reason, before, after, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [committed, no_op, needs_review] }
                        transport: { type: string, minLength: 1 }
                        executed: { type: boolean }
                        reason: { type: string, minLength: 1 }
                        before: { type: array, maxItems: 200 }
                        after: { type: array, maxItems: 200 }
                        findings: { type: array, maxItems: 200 }
                    no_op: { type: boolean }
                    confidence_gate:
                      type: object
                      required: [threshold, refused_count, human_review_required]
                      additionalProperties: false
                      properties:
                        threshold: { type: number, minimum: 0, maximum: 1 }
                        refused_count: { type: number, minimum: 0 }
                        human_review_required: { type: boolean }
                    evidence:
                      type: object
                      required: [source_read, transcript_digest, source_digest, decision_bound_to_write, field_updates_trace_to_quotes]
                      additionalProperties: false
                      properties:
                        source_read: { type: boolean }
                        transcript_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                        source_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                        decision_bound_to_write: { type: boolean }
                        field_updates_trace_to_quotes: { type: boolean }
