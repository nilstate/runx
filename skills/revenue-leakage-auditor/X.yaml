skill: revenue-leakage-auditor
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

runners:
  audit:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      leak_candidates: array
      expected_vs_actual: array
      refund_recommendation: object
      stop_conditions: array
      handoff: object
    artifacts:
      wrap_as: revenue_audit_packet
      packet: runx.revenue.audit.v1
    inputs:
      ledger_lines:
        type: json
        required: true
        description: Bounded ledger excerpt.
      known_subscriptions:
        type: json
        required: true
        description: Bounded subscription baseline.
      baseline_window_days:
        type: json
        required: false
        description: Optional baseline window in days (default 35).
      tolerance_pct:
        type: json
        required: false
        description: Optional tolerance fraction (default 0.15).