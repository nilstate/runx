name: unsealed stop request needs an operator
skill: ../SKILL.md
runner: route
inputs:
  inbound_reply:
    reply_id: reply-fixture-stop-001
    from:
      address: recipient@example.test
    subject: "Re: Update"
    body: Stop.
  original_send_receipt:
    schema: runx.receipt.v1
    status: open
    receipt_id: receipt-fixture-unsealed-001
    principal:
      type: account
      ref: account:fixture
    send_plan:
      action_family: send-as
      channel: email
      audience:
        type: recipient
        ref: recipient@example.test
  suppression_policy:
    data_source_ref: local://reply-router/fixture
    store_id: reply-router-fixture-v1
    resource: reply_suppressions
    unsubscribe_phrases:
      - unsubscribe me
expect:
  status: needs_agent
