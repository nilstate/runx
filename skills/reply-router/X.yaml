skill: reply-router
version: "0.1.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context

harness:
  cases:
    - name: sealed_unsubscribe_suppression
      runner: judge
      inputs:
        data_source_ref: "local://reply-router-harness"
        store_id: "reply-router-unsubscribe-harness"
        resource: "reply.suppression"
        aggregate_id: "recipient:casey@example.test"
        expected_version: 0
        idempotency_key: "reply-router-unsubscribe-casey-v0"
        inbound_reply:
          content: "Please unsubscribe me and stop emailing this address."
          received_from: "casey@example.test"
          received_at: "2026-06-30T11:20:00Z"
        original_send_receipt:
          sealed: true
          receipt_id: "runx:receipt:sha256:sealed-send-casey"
          checksum: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
          principal: "account:growth-team"
          send_plan:
            channel: "email"
            audience_ref: "casey@example.test"
            content_ref: "campaign:june-product-note"
        suppression_policy:
          unsubscribe_signals:
            - "unsubscribe"
            - "stop emailing"
            - "remove me"
            - "opt out"
            - "do not contact"
          confidence_threshold: 0.8
      caller:
        answers:
          agent_task.reply-router.output:
            classification_type: "unsubscribe"
            classification:
              type: "unsubscribe"
              confidence: 0.99
              evidence:
                matched_unsubscribe_signals:
                  - "unsubscribe"
                  - "stop emailing"
            suppression_result:
              aggregate_id: "recipient:casey@example.test"
              idempotency_key: "reply-router-unsubscribe-casey-v0"
              before_version: 0
              after_version: 1
            routing_decision: null
            escalation_lane: null
            append_event_count: 1
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed

    - name: sealed_interested_route
      runner: judge
      inputs:
        data_source_ref: "local://reply-router-harness"
        store_id: "reply-router-interested-harness"
        resource: "reply.suppression"
        aggregate_id: "recipient:mira@example.test"
        expected_version: 0
        idempotency_key: "reply-router-interested-mira-v0"
        inbound_reply:
          content: "This looks interesting. Can you tell me more and book a short demo next week?"
          received_from: "mira@example.test"
          received_at: "2026-06-30T11:25:00Z"
        original_send_receipt:
          sealed: true
          receipt_id: "runx:receipt:sha256:sealed-send-mira"
          checksum: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
          principal: "account:growth-team"
          send_plan:
            channel: "email"
            audience_ref: "mira@example.test"
            content_ref: "campaign:june-product-note"
        suppression_policy:
          unsubscribe_signals:
            - "unsubscribe"
            - "stop emailing"
            - "remove me"
            - "opt out"
            - "do not contact"
          confidence_threshold: 0.8
      caller:
        answers:
          agent_task.reply-router.output:
            classification_type: "interested"
            classification:
              type: "interested"
              confidence: 0.91
            routing_decision:
              schema: "runx.reply.routing.v1"
              send_target:
                run: "send-as"
                dispatch_ref: "send-as:reply-router:interested-follow-up"
                audience:
                  type: "recipient"
                  ref: "mira@example.test"
                human_approval_required: true
              principal: "account:growth-team"
            suppression_result: null
            append_event_count: 0
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed

    - name: stop_ambiguous_or_unsealed
      runner: judge
      inputs:
        data_source_ref: "local://reply-router-harness"
        store_id: "reply-router-stop-harness"
        resource: "reply.suppression"
        aggregate_id: "recipient:unknown@example.test"
        expected_version: 0
        idempotency_key: "reply-router-ambiguous-unknown-v0"
        inbound_reply:
          content: "Maybe later, not sure what this is about."
          received_from: "unknown@example.test"
          received_at: "2026-06-30T11:30:00Z"
        suppression_policy:
          unsubscribe_signals:
            - "unsubscribe"
            - "stop emailing"
            - "remove me"
            - "opt out"
            - "do not contact"
          confidence_threshold: 0.8
      expect:
        status: needs_agent

runners:
  classify:
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      classification_type: string
      classification: object
      suppression_event: object
      suppression_result: object
      routing_decision: object
      escalation_lane: string
      append_event_count: number
    artifacts:
      wrap_as: reply_router_packet
      packet: runx.reply_router.v1
    inputs:
      aggregate_id:
        type: string
        required: true
        description: "Recipient-keyed suppression aggregate id."
      expected_version:
        type: number
        required: true
        description: "Current suppression stream version required for compare-and-set append."
      idempotency_key:
        type: string
        required: true
        description: "Stable key so unsubscribe retries do not duplicate suppression writes."
      inbound_reply:
        type: json
        required: true
        description: "Inbound reply with content, sender, and received timestamp."
      original_send_receipt:
        type: json
        required: true
        description: "Sealed original send receipt packet with send plan, principal, receipt id, and checksum."
      suppression_policy:
        type: json
        required: true
        description: "Policy signals and threshold for unsubscribe classification."

  judge:
    default: true
    type: graph
    runx:
      category: ops
    inputs:
      data_source_ref:
        type: string
        required: true
        description: "Data-store source reference for the reply suppression stream."
      store_id:
        type: string
        required: false
        description: "Optional local fixture store id for hosted harness validation."
      resource:
        type: string
        required: true
        description: "Suppression stream resource name."
      aggregate_id:
        type: string
        required: true
        description: "Recipient-keyed aggregate id."
      expected_version:
        type: number
        required: true
        description: "Current suppression stream version required for CAS append."
      idempotency_key:
        type: string
        required: true
        description: "Stable suppression event retry key."
      inbound_reply:
        type: json
        required: true
        description: "Inbound reply packet."
      original_send_receipt:
        type: json
        required: true
        description: "Sealed original send receipt packet."
      suppression_policy:
        type: json
        required: true
        description: "Suppression classification policy."
    graph:
      name: reply-router
      steps:
        - id: read_recipient
          label: read recipient suppression projection
          tool: data.source
          scopes:
            - runx:data:read
          inputs:
            operation: read_projection
            data_source_ref: "$input.data_source_ref"
            store_id: "$input.store_id"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"

        - id: classify
          label: classify inbound reply and choose reply route
          skill: .
          runner: classify
          inputs:
            aggregate_id: "$input.aggregate_id"
            expected_version: "$input.expected_version"
            idempotency_key: "$input.idempotency_key"
            inbound_reply: "$input.inbound_reply"
            original_send_receipt: "$input.original_send_receipt"
            suppression_policy: "$input.suppression_policy"
          context:
            recipient_projection: read_recipient.data_operation_result.data.projection

        - id: append_suppression
          label: append unsubscribe suppression event
          when:
            field: classify.reply_router_packet.data.classification_type
            equals: unsubscribe
          tool: data.source
          scopes:
            - runx:data:append
          inputs:
            operation: append_event
            data_source_ref: "$input.data_source_ref"
            store_id: "$input.store_id"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"
            expected_version: "$input.expected_version"
            idempotency_key: "$input.idempotency_key"
          context:
            event: classify.reply_router_packet.data.suppression_event

        - id: readback
          label: read suppression projection after decision
          tool: data.source
          scopes:
            - runx:data:read
          inputs:
            operation: read_projection
            data_source_ref: "$input.data_source_ref"
            store_id: "$input.store_id"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"

