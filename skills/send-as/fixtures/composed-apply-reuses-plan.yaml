name: send-as-composed-apply-reuses-plan
kind: skill
target: ..
runner: apply
operator_journeys:
  - mode: composed
    request: Deliver this already approved release-notice plan.
    expected_outcome: Reuse the supplied typed plan without redrafting, derive one digest-bound provider request, and pause at the consequential approval boundary.
    prior_evidence:
      - The exact runx.send_as.plan.v1 packet supplied to apply.
    must_not_repeat:
      - Do not invoke the planning agent.
      - Do not ask the caller to author provider operations, result fields, payload plumbing, or an idempotency key.
inputs:
  send_plan:
    decision: ready
    action_family: send-as
    principal: { type: account, ref: account:release-bot }
    provider: { name: provider-send-demo, account_ref: acct_release, runtime_path: provider.send }
    send_class: status
    channel: email
    audience: { type: channel, ref: release-subscribers, requires_reconfirmation: false }
    content:
      draft_ref: message:release-notice
      digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      subject_or_title: Release notice
    gates: { preflight_required: true, human_approval_required: true, approval_ref: send-as.live-send.approval }
    blockers: []
    provider_actions: [message.send]
    evidence_refs: [provider_context:provider-send-demo]
    success_checkpoint:
      milestone: send_ready_for_approval
      description: The exact digest-bound release notice awaits live-send approval.
  connector:
    provider: provider-send-demo
    target: account:acct_release/channel:release-subscribers
caller:
  provider_responses:
    principal_id: release-bot-fixture
    grants:
      - grant_id: send-as-composed-fixture
        provider: provider-send-demo
        scopes: [message.send]
    operations:
      - grant_id: send-as-composed-fixture
        operation: message.send
        target: account:acct_release/channel:release-subscribers
        access: mutate
        result:
          message_id: msg_release_001
          principal_ref: account:release-bot
          audience_ref: release-subscribers
          content_digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          status: sent
          sent_at: "2026-08-11T00:00:00Z"
          idempotency_key: $request.idempotency_key
  approvals:
    "provider-effect:sha256:5630f5fbff6f7f8b56c30efbf435bebc91ef4d0dd64f1c6384409ff258b27e05": true
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
metadata:
  public_skill: send-as
  source_case: composed-apply-reuses-plan
  source: operator-journey
