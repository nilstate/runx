skill: csat-detractor-recovery
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

runners:
  recover:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      severity: string
      classification: string
      recommended_path: string
      rationale: string
      owner_role: string
      stop_conditions: array
      handoff: object
    artifacts:
      wrap_as: csat_recovery_packet
      packet: runx.csat.recovery.v1
    inputs:
      feedback:
        type: json
        required: true
        description: Bounded detractor feedback text.
      csat_score:
        type: json
        required: true
        description: Integer CSAT score 0..10.
      account_tier:
        type: json
        required: false
        description: Optional account tier hint.
      lifetime_value_usd:
        type: json
        required: false
        description: Optional account lifetime value USD.
      prior_complaints:
        type: json
        required: false
        description: Optional count of prior complaints.