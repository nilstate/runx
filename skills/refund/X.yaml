skill: refund
version: "0.6.0"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, runtime_path: hosted, execution: execute, completion: provider_readback, requires_adapter: true, approval: required }
runners:
  refund:
    default: true
    type: graph
    inputs:
      original_receipt_ref: { type: string, required: true, description: Opaque sealed charge receipt reference. }
      refund_request: { type: json, required: true, description: Bounded refund amount and reason. }
      parent_payment_authority: { type: json, required: true, description: Full parent refund authority term. }
      settlement_family: { type: string, required: true, description: Settlement family recorded by the charge receipt. }
      idempotency_key: { type: string, required: true, description: Stable refund idempotency key. }
    graph:
      name: refund-hosted
      result_from: [readback]
      steps:
        - id: refund
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes: [payment.refund]
          policy: { provider_permission: { verb: write } }
          inputs:
            operation: payment.refund
            target: $input.original_receipt_ref
            expected_provider: $input.settlement_family
            idempotency_key: $input.idempotency_key
            result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status]
            input: { original_receipt_ref: $input.original_receipt_ref, refund_request: $input.refund_request, parent_payment_authority: $input.parent_payment_authority }
        - id: readback
          tool: provider.read
          scopes: [payment.refund.read]
          policy: { provider_permission: { verb: read } }
          inputs: { operation: payment.refund.read, target: $input.original_receipt_ref, expected_provider: $input.settlement_family, result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status] }
          context: { input: refund.provider_operation.data.result, expected_result: refund.provider_operation.data.result }
