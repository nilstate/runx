name: refund-default-refunds-and-verifies
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [dispute-respond, spend]
    request: Refund 100 USD minor units from this verified MPP charge.
    expected_outcome: Verify the original payment receipt, refund once after approval, and return provider readback.
  - mode: composed
    request: Continue from this sealed charge receipt and execute the bounded refund.
    expected_outcome: Reuse the original receipt proof and refund authority without reconstructing the payment.
    prior_evidence:
      - The signed original charge receipt supplied in the fixture receipt store.
    must_not_repeat:
      - Do not charge the payer again.
      - Do not issue a second refund after readback evidence exists.
setup:
  receipts:
    - fixtures/receipt-store-mpp/sha256-692e080fc88eb68e5b4f218e1d9217b16bd09e73789344bf78456de917900aa4.json
env:
  RUNX_RECEIPT_VERIFY_KID: runx-refund-mpp-fixture-key
  RUNX_RECEIPT_VERIFY_ED25519_PUBLIC_KEY_BASE64: IBLLkMpg6OXY2vZuInLSIz4EhtVX6MZhQe2JIBd9frc=
inputs:
  original_receipt_ref: sha256:692e080fc88eb68e5b4f218e1d9217b16bd09e73789344bf78456de917900aa4
  refund_request:
    amount_minor: 100
    reason: operator_refund
    requested_counterparty: payer:demo
  settlement_family: mpp
  parent_payment_authority:
    term_id: refund-mpp-default
    principal_ref: { type: principal, uri: runx:principal:operator }
    resource_ref: { type: target, uri: payer:demo }
    resource_family: effect
    verbs: [reverse]
    bounds:
      effect_limits:
        - family: payment
          unit: USD
          max_per_call_units: 125
          max_per_run_units: 125
          channels: [mpp]
          realm: test
          peer: payer:demo
          operation: refund
          authorization_form: single_use_capability
          idempotency_required: true
          recovery_required: true
          receipt_before_success: true
          single_use_capability: true
    conditions: []
    approvals: []
    capabilities: [effect_single_use_capability]
    issued_by_ref: { type: grant, uri: runx:grant:payment }
caller:
  approvals:
    "provider-effect:sha256:b6236d87f5109fbc38329a95ba2df80127ab3e7ebbc2fc1251845f6daf488cda": true
  provider_responses:
    principal_id: refund-fixture
    grants:
      - grant_id: refund-fixture
        provider: mpp
        scopes: [payment.refund, payment.refund.read]
    operations:
      - grant_id: refund-fixture
        operation: payment.refund
        target: charge
        access: mutate
        result:
          refund_ref: refund_demo_001
          original_receipt_ref: sha256:692e080fc88eb68e5b4f218e1d9217b16bd09e73789344bf78456de917900aa4
          amount_minor: 100
          currency: USD
          status: refunded
      - grant_id: refund-fixture
        operation: payment.refund.read
        target: charge
        access: read
        result:
          refund_ref: refund_demo_001
          original_receipt_ref: sha256:692e080fc88eb68e5b4f218e1d9217b16bd09e73789344bf78456de917900aa4
          amount_minor: 100
          currency: USD
          status: refunded
expect:
  status: sealed
  steps: [select-mpp, mpp-plan, mpp-refund, mpp-readback, select-stripe]
  receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
metadata: { public_skill: refund, source_case: direct-default-success, source: skills-fixture }
