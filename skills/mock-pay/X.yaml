skill: mock-pay
version: "0.2.1"
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: harness-fixture
  part_of:
    - runx/spend
harness:
  cases:
    - name: mock-pay-mock-path
      runner: mock
      inputs:
        payment_signal:
          signal_type: effect_required
          challenge_id: ch_mock_001
          amount_minor: 125
          currency: USD
          rail: mock
          counterparty: merchant:demo
          operation: search.paid
        parent_payment_authority:
          term_id: authority-term:payment:quote-demo-001
          principal_ref:
            type: host
            uri: principal:operator:test
          resource_ref:
            type: surface
            uri: merchant:demo
          resource_family: effect
          verbs:
            - prepare
            - commit
          bounds:
            effect_limits:
              - family: payment
                unit: USD
                max_per_call_units: 125
                max_per_run_units: 125
                channels:
                  - mock
                realm: test
                peer: merchant:demo
                operation: search.paid
                idempotency_required: true
                recovery_required: true
                receipt_before_success: true
                single_use_capability: true
                authorization_form: single_use_capability
          conditions: []
          approvals: []
          capabilities:
            - effect_single_use_capability
          issued_by_ref:
            type: host
            uri: authority:payment:test
        rail_profile_ref: rail-profile:mock:test
        realm: test
        idempotency_seed: demo-search-001
      caller:
        answers:
          agent_task.pay-fulfill-rail-mock.output:
            rail_result:
              status: fulfilled
              rail: mock
              amount_minor: 125
              currency: USD
            rail_proof:
              proof_ref: receipt-proof:mock:demo-search-001
              idempotency_key: payment:demo-search-001
            credential_envelope:
              form: paid_tool_credential
              credential_ref: credential:mock:demo-search-001
            redactions:
              - rail_session_material
            recovery_hint:
              status: sealed
        approvals:
          spend.mock.approval: true
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: graph_closed
runners:
  mock:
    default: true
    type: graph
    inputs:
      payment_signal:
        type: json
        packet: runx.payment.signal.v1
        required: true
        description: Payment-required signal or challenge.
      parent_payment_authority:
        type: json
        packet: runx.authority_term.v1
        required: true
        description: Full typed parent payment AuthorityTerm; a reference alone is refused.
      rail_profile_ref:
        type: string
        required: true
        description: Configured rail profile reference.
      payment_admission:
        type: object
        required: false
        description: Hosted payment admission token and settlement identity.
        schema:
          additionalProperties: true
      realm:
        type: string
        required: false
        description: Authority realm.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned idempotency material.
    graph:
      name: mock-pay
      result_from: [spend]
      steps:
        - id: spend
          skill: ../spend
          runner: mock
          inputs:
            payment_signal: $input.payment_signal
            parent_payment_authority: $input.parent_payment_authority
            rail_profile_ref: $input.rail_profile_ref
            payment_admission: $input.payment_admission
            realm: $input.realm
            idempotency_seed: $input.idempotency_seed
