skill: stripe-charge
version: "0.3.1"
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: runtime-path
  part_of:
    - runx/charge
harness:
  cases:
    - name: stripe-charge-stripe-path
      runner: stripe
      inputs:
        mcp_tool_call:
          tool: search.paid
          arguments:
            query: runx
        provider_policy:
          price_minor: 125
          currency: USD
          accepted_settlement_families:
            - stripe
          counterparty: provider:demo
          realm: test
        returned_credential:
          family: stripe
          credential_ref: credential:stripe:paid-search-001
        verify_capability_ref: capability:charge-verify:paid-search-001
        idempotency_seed: paid-search-001
      expect:
        status: sealed
        steps:
          - charge
        step_outputs:
          charge:
            subset:
              charge_plan:
                data:
                  decision: ready_for_provider_verification
                  provider_status: not_called
                  receipt_status: not_sealed
                  forwarding_status: not_forwarded
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
runners:
  stripe:
    default: true
    type: graph
    inputs:
      mcp_tool_call:
        type: json
        packet: runx.payment.tool_call.v1
        required: true
        description: Inbound MCP operation request.
      provider_policy:
        type: json
        packet: runx.payment.charge_policy.v1
        required: true
        description: Provider-owned price and settlement-family policy.
      returned_credential:
        type: json
        packet: runx.payment.credential_reference.v1
        required: true
        description: Opaque stripe credential family and reference.
      verify_capability_ref:
        type: string
        required: true
        description: Single-use verifier capability reference.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned challenge seed.
    graph:
      name: stripe-charge
      result_from: [charge]
      steps:
        - id: charge
          skill: ../charge
          runner: stripe
          inputs:
            mcp_tool_call: $input.mcp_tool_call
            provider_policy: $input.provider_policy
            returned_credential: $input.returned_credential
            verify_capability_ref: $input.verify_capability_ref
            idempotency_seed: $input.idempotency_seed
    runx:
      payment_authority:
        direction: provider_charge
        phase: plan
        resource_family: effect
        settlement_family: stripe
        receipt_before_forward_required: true
        runtime_forwarding_enabled: false
