skill: quote-guard
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: in_policy_deal_yields_quote
      runner: judge
      inputs:
        deal_ask:
          account_id: acct_acme_001
          counterparty:
            name: Acme Operations LLC
            contact: buyer@example.invalid
          product: runx-ops-seat
          quantity: 25
          term_months: 12
          currency: USD
          list_price_usd: 30000
          requested_net_usd: 25800
          requested_discount_percent: 14
          requested_margin_percent: 68
          quote_valid_days: 14
        account_policy:
          currency: USD
          authorized_products:
            - runx-ops-seat
          minimum_margin_percent: 55
          default_quote_valid_days: 14
          approval_bands:
            - name: standard-ae
              max_discount_percent: 15
              max_total_contract_value_usd: 50000
              requires_approval: false
            - name: finance-approval
              max_discount_percent: 25
              max_total_contract_value_usd: 150000
              requires_approval: true
        quote_history:
          - quote_id: q_2026_041
            account_id: acct_acme_001
            product: runx-ops-seat
            total_contract_value_usd: 24000
            discount_percent: 10
            status: accepted
            created_at: "2026-04-10T12:00:00Z"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed
    - name: out_of_band_ask_escalates
      runner: judge
      inputs:
        deal_ask:
          account_id: acct_beta_002
          counterparty:
            name: Beta Finance Inc
            contact: finance@example.invalid
          product: runx-ops-seat
          quantity: 90
          term_months: 12
          currency: USD
          list_price_usd: 108000
          requested_net_usd: 64800
          requested_discount_percent: 40
          requested_margin_percent: 60
          quote_valid_days: 30
        account_policy:
          currency: USD
          authorized_products:
            - runx-ops-seat
          minimum_margin_percent: 55
          default_quote_valid_days: 14
          approval_bands:
            - name: standard-ae
              max_discount_percent: 15
              max_total_contract_value_usd: 50000
              requires_approval: false
            - name: finance-approval
              max_discount_percent: 25
              max_total_contract_value_usd: 150000
              requires_approval: true
        quote_history:
          - quote_id: q_2026_099
            account_id: acct_beta_002
            product: runx-ops-seat
            total_contract_value_usd: 85000
            discount_percent: 18
            status: expired
            created_at: "2026-05-20T09:00:00Z"
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed
          reason_code: process_failed

runx:
  mutating: false
  category: pricing
  scopes:
    - pricing.policy.read
    - quote.history.read
    - send_as.proposal.emit
    - settlement.ceiling.emit
  policy:
    data_classification: bounded_commercial_quote_context
    verifier_notes:
      - The skill emits only gated handoff artifacts.
      - The skill does not send quotes, mint authority, settle money, or write policy.
      - Prior quote evidence must come from supplied quote_history records.
  artifacts:
    emits:
      - runx.quote_guard.result.v1
      - runx.quote_guard.send_proposal.v1
      - runx.quote_guard.settlement_ceiling.v1
    wrap_as: quote_guard_packet

runners:
  judge:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    scopes:
      - pricing.policy.read
      - quote.history.read
      - send_as.proposal.emit
      - settlement.ceiling.emit
    policy:
      reads:
        - caller supplied deal_ask
        - caller supplied account_policy
        - caller supplied quote_history
      writes: []
      planned_writes: []
      disallows:
        - sending quotes
        - posting messages
        - minting authority
        - settling money
        - modifying account policy
        - invented quote history
    artifacts:
      wrap_as: quote_guard_packet
      packet: runx.quote_guard.result.v1
    inputs:
      deal_ask:
        type: json
        required: true
        description: Account, counterparty, requested pricing, product, quantity, and term.
      account_policy:
        type: json
        required: true
        description: Currency, authorized products, approval bands, and margin guardrails.
      quote_history:
        type: json
        required: true
        description: Prior quote records supplied by the caller.
    outputs:
      decision: object
      quote_draft: object
      send_proposal: object
      settlement_ceiling: object
      escalation: object
      observations: array
