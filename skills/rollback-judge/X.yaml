skill: rollback-judge
version: "0.2.0"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: canonical

harness:
  cases:
    - name: critical-signal-rollback
      runner: judge
      inputs:
        deploy_signal:
          severity: critical
          kind: error_rate_spike
          evidence:
            source_type: github_actions_run
            source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29393017505
            workflow_name: Rollback Judge Deployment Monitor
        current_version:
          service: rollback-judge-demo
          marker_path: public/deploy-target.json
          source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29393017505
        monitor_run_ref: https://github.com/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29393017505
        prior_version:
          service: rollback-judge-demo
          marker_path: public/deploy-target.json
          source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29392993457
        forward_fix_evidence:
          test_runs: []
          review_signoff: null
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: signal-contradictory-block
      runner: agent_review
      inputs:
        deploy_signal:
          severity: critical
          kind: error_rate_spike
          evidence:
            source_type: github_actions_run
            source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29392993457
            workflow_name: Rollback Judge Deployment Monitor
            observed_conclusion: success
            contradiction: critical label conflicts with a successful monitor run
        current_version:
          service: rollback-judge-demo
          marker_path: public/deploy-target.json
          source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29392993457
        monitor_run_ref: https://github.com/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29392993457
        prior_version:
          service: rollback-judge-demo
          marker_path: public/deploy-target.json
          source_url: https://api.github.com/repos/RYDE-PLAY/frantic-102-rollback-judge/actions/runs/29392993457
        forward_fix_evidence:
          test_runs: []
          review_signoff: null
      expect:
        status: needs_agent

runners:
  judge:
    default: true
    type: graph
    act:
      form: review
      purpose: Read a public deployment monitor run and record a bounded rollback or escalation decision.
      legitimacy: The operator supplied public monitoring references; release owns any downstream consequence.
      reason_step: decide
      reason_from: act_reason
      target_from: monitor_run_ref
      effect_step: decide
      effect_from: act_target_ref
      effect_type: tracking_item
    inputs:
      deploy_signal:
        type: object
        required: true
        description: "Deploy signal with severity, kind, and evidence.source_url pointing to a public GitHub Actions monitor run."
      current_version:
        type: object
        required: true
        description: "Current deployment subject with service and repository-relative marker_path."
      monitor_run_ref:
        type: string
        required: true
        description: "Public HTML URL for the monitored run; the judge verifies it against the API response before sealing."
      prior_version:
        type: object
        required: false
        description: "Rollback candidate whose source_url points to a completed, successful monitor run."
      forward_fix_evidence:
        type: object
        required: false
        description: "Roll-forward evidence with test_runs and review_signoff."
    graph:
      name: rollback-judge
      steps:
        - id: decide
          label: read monitor and judge deploy signal
          run:
            type: cli-tool
            command: node
            args:
              - run.mjs
            outputs:
              act_decision: string
              act_reason: string
              act_target_ref: string
              decision: object
              escalation: object
              release_publish_approval: object
              review_record: object
              source_read: object
          inputs:
            deploy_signal: "$input.deploy_signal"
            current_version: "$input.current_version"
            monitor_run_ref: "$input.monitor_run_ref"
            prior_version: "$input.prior_version"
            forward_fix_evidence: "$input.forward_fix_evidence"
          artifacts:
            wrap_as: rollback_decision_packet
            packet: runx.rollback_judge.decision.v1

  agent_review:
    type: agent-task
    act:
      form: review
      purpose: Stop on contradictory or thin deploy evidence before any release approval is emitted.
      legitimacy: The operator supplied public monitoring references; release owns any downstream consequence.
      reason_from: act_reason
      target_from: monitor_run_ref
    agent: reviewer
    task: rollback-judge
    outputs:
      act_decision: string
      act_reason: string
      act_target_ref: string
      decision: object
      escalation: object
      release_publish_approval: object
      review_record: object
      source_read: object
    artifacts:
      wrap_as: rollback_decision_packet
      packet: runx.rollback_judge.decision.v1
    runx:
      category: ops
    instructions: >
      Review deploy_signal, current_version, prior_version, and
      forward_fix_evidence without deploying, publishing, minting authority, or
      creating a universal proposal envelope. Treat evidence.source_url as a
      reference that must be read and verified before approving. If the
      supplied signal is contradictory, thin, nonfailing, lacks a readable
      source, lacks a proven healthy prior version, or lacks tested forward-fix
      evidence, stop and name the missing or conflicting evidence. Do not emit
      a decision or release.publish.approval answer when blocked. A valid
      rollback answer must cite the failing monitor run, derive the current and
      prior versions from source reads, set reason error_rate_critical, and seed
      release.publish.approval with approved true. The release skill, not this
      judge, owns any downstream effect.
    inputs:
      deploy_signal:
        type: object
        required: true
        description: "Deploy signal with severity, kind, and public source evidence."
      current_version:
        type: object
        required: true
        description: "Current deployment subject and monitor reference."
      monitor_run_ref:
        type: string
        required: true
        description: "Public HTML URL for the monitored run."
      prior_version:
        type: object
        required: false
        description: "Candidate prior deployment and monitor reference."
      forward_fix_evidence:
        type: object
        required: false
        description: "Roll-forward evidence with test_runs and review_signoff."
