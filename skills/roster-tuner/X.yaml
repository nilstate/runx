skill: roster-tuner
version: "0.1.1"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: canonical

emits:
  - name: roster_tuning_decision
    packet: runx.roster.tuning.v1

harness:
  cases:
    - name: roster-tuner-sealed-underperformer
      runner: tune
      inputs:
        case_id: case-rt-sealed-1
        data_source_ref: local://runx-roster-tuner/harness-sealed
        store_id: roster-tuner-sealed-v1
        resource: agency_cases
        aggregate_id: case-rt-sealed-1
        expected_version: 12
        idempotency_key: case-rt-sealed-1:roster-tune:v1
        roster:
          - { member: writer-alpha, skill: draft-content, turn_count: 12 }
          - { member: reviewer-beta, skill: review-skill, turn_count: 8 }
          - { member: researcher-gamma, skill: deep-research, turn_count: 10 }
        events:
          - version: 1
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 2
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 3
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 4
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 5
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 6
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 7
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 8
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 9
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: refuse, completion_time: 360 } }
          - version: 10
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: complete, completion_time: 360 } }
          - version: 11
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: complete, completion_time: 360 } }
          - version: 12
            event: { schema_version: "1", type: turn, payload: { member: writer-alpha, decision: complete, completion_time: 360 } }
        performance_norms:
          refusal_threshold: 0.6
          completion_time_threshold: 120
          min_roster_size: 2
        agency_event_schema_version: "1"
      caller:
        answers:
          agent_task.grade-member.output:
            grade_answer:
              graded_member: writer-alpha
              refusal_count: 9
              refusal_rate: 0.75
              avg_completion_time: 360
              completion_ratio: 3.0
              verdict: underperformer
              reason: "writer-alpha refusal rate 0.75 exceeds threshold 0.6 and completion time 360s is 3x the 120s norm"
      expect:
        status: sealed
    - name: roster-tuner-stop-needs-agent
      runner: tune
      inputs:
        case_id: case-rt-stop-1
        data_source_ref: local://runx-roster-tuner/harness-stop
        store_id: roster-tuner-stop-v1
        resource: agency_cases
        aggregate_id: case-rt-stop-1
        expected_version: 0
        idempotency_key: case-rt-stop-1:roster-tune:v1
        roster:
          - { member: writer-alpha, skill: draft-content, turn_count: 5 }
          - { member: reviewer-beta, skill: review-skill, turn_count: 3 }
        performance_norms:
          refusal_threshold: 0.6
          completion_time_threshold: 120
          min_roster_size: 2
        agency_event_schema_version: "1"
      expect:
        status: needs_agent

policy:
  allow:
    - provider: data-source
      method: READ
      scope: runx:data:read
    - provider: data-source
      method: APPEND
      scope: runx:data:append
  deny:
    - raw_sql_from_model
    - unrestricted_export
    - secret_material
    - pii_without_projection
    - roster_mutation_execution

runners:
  tune:
    default: true
    type: graph
    inputs:
      case_id:
        type: string
        required: true
        description: The agency case identifier to tune.
      data_source_ref:
        type: string
        required: true
        description: Logical data source holding the sealed case event stream.
      store_id:
        type: string
        required: false
        description: Opt into the bundled data.local fixture store; omit for durable local SQLite.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family for the case events.
      aggregate_id:
        type: string
        required: true
        description: The case aggregate id; same as case_id for partition keying.
      expected_version:
        type: number
        required: true
        description: Current stream version required before appending the judgment.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for the tuning judgment append.
      roster:
        type: json
        required: true
        description: "Current roster as [{member, skill, turn_count}]."
      performance_norms:
        type: json
        required: true
        description: "{refusal_threshold, completion_time_threshold, min_roster_size}."
      events:
        type: json
        required: false
        description: Optional sealed case event stream for harness fixtures.
      agency_event_schema_version:
        type: string
        required: true
        description: Declared schema version for case events; mismatched events are refused.
    graph:
      name: roster-tuner
      steps:
        - id: fold
          label: fold roster metrics
          run:
            type: cli-tool
            command: node
            args:
              - -e
              - |
                const fs = require("node:fs");
                const raw = process.env.RUNX_INPUTS_PATH ? fs.readFileSync(process.env.RUNX_INPUTS_PATH, "utf8") : process.env.RUNX_INPUTS_JSON || "{}";
                const inputs = JSON.parse(raw);
                const events = Array.isArray(inputs.events) ? inputs.events : [];
                const roster = Array.isArray(inputs.roster) ? inputs.roster : [];
                const declaredVersion = String(inputs.agency_event_schema_version ?? "1");
                const caseId = inputs.case_id ?? null;
                const members = {};
                for (const member of roster) {
                  members[member.member] = { member: member.member, skill: member.skill, turn_count: member.turn_count ?? 0, refusal_count: 0, completion_times: [] };
                }
                for (const entry of events) {
                  const event = entry.event ?? entry ?? {};
                  if (event.schema_version && String(event.schema_version) !== declaredVersion) {
                    console.log(JSON.stringify({ stop: true, reason: "schema_version_mismatch", declared_version: declaredVersion, case_id: caseId }));
                    process.exit(0);
                  }
                  const payload = event.payload ?? {};
                  if (event.type === "turn" || event.type === "dispatch") {
                    const name = payload.member ?? payload.dispatch?.member ?? null;
                    if (name && members[name]) {
                      if (payload.decision === "refuse" || payload.refused === true) members[name].refusal_count += 1;
                      if (typeof payload.completion_time === "number") members[name].completion_times.push(payload.completion_time);
                    }
                  }
                }
                const folded = Object.values(members).map((member) => {
                  const avg = member.completion_times.length ? member.completion_times.reduce((a, b) => a + b, 0) / member.completion_times.length : 0;
                  const rate = member.turn_count ? member.refusal_count / member.turn_count : 0;
                  return { member: member.member, skill: member.skill, turn_count: member.turn_count, refusal_count: member.refusal_count, refusal_rate: Math.round(rate * 100) / 100, avg_completion_time: Math.round(avg * 100) / 100 };
                });
                console.log(JSON.stringify({ roster_metrics: { schema: "runx.roster.metrics.v1", case_id: caseId, members: folded, events_folded: events.length, declared_schema_version: declaredVersion } }));
          artifacts:
            named_emits:
              roster_metrics: roster_metrics
            packets:
              roster_metrics: runx.roster.metrics.v1
        - id: grade
          label: grade folded member
          inputs:
            performance_norms: $input.performance_norms
          context:
            folded_metrics: fold.roster_metrics.data
          run:
            type: agent-task
            agent: reviewer
            task: grade-member
            outputs:
              grade_answer: object
          instructions: >
            Grade the folded member metrics against performance_norms. Return
            grade_answer with graded_member, refusal_count, refusal_rate,
            avg_completion_time, completion_ratio, verdict, and reason. Use
            verdict underperformer only when refusal_rate and avg_completion_time
            both exceed the supplied thresholds.
          artifacts:
            named_emits:
              grade_answer: grade_answer
        - id: decide
          label: decide roster tuning
          inputs:
            case_id: $input.case_id
            resource: $input.resource
            aggregate_id: $input.aggregate_id
            expected_version: $input.expected_version
            idempotency_key: $input.idempotency_key
            roster: $input.roster
            performance_norms: $input.performance_norms
            events: $input.events
          context:
            folded_metrics: fold.roster_metrics.data
            grade_answer: grade.grade_answer.data
          run:
            type: cli-tool
            command: node
            args:
              - -e
              - |
                const fs = require("node:fs");
                const raw = process.env.RUNX_INPUTS_PATH ? fs.readFileSync(process.env.RUNX_INPUTS_PATH, "utf8") : process.env.RUNX_INPUTS_JSON || "{}";
                const inputs = JSON.parse(raw);
                const foldedMetrics = inputs.folded_metrics ?? {};
                const gradeAnswer = inputs.grade_answer ?? null;
                const events = Array.isArray(inputs.events) ? inputs.events : [];
                const roster = Array.isArray(inputs.roster) ? inputs.roster : [];
                const norms = inputs.performance_norms ?? {};
                const minRosterSize = norms.min_roster_size ?? 2;
                const refusalThreshold = norms.refusal_threshold ?? 0.6;
                const completionTimeThreshold = norms.completion_time_threshold ?? 120;
                const caseId = inputs.case_id ?? null;
                const resource = inputs.resource ?? "agency_cases";
                const aggregateId = inputs.aggregate_id ?? caseId;
                const idempotencyKey = inputs.idempotency_key ?? "";
                const sourceMembers = Array.isArray(foldedMetrics.members) ? foldedMetrics.members : [];
                let gradedMembers = sourceMembers.map((member) => {
                  const completionRatio = completionTimeThreshold > 0 ? member.avg_completion_time / completionTimeThreshold : 0;
                  const under = member.refusal_rate > refusalThreshold && member.avg_completion_time > completionTimeThreshold;
                  return {
                    member: member.member,
                    skill: member.skill,
                    refusal_count: member.refusal_count,
                    refusal_rate: member.refusal_rate,
                    avg_completion_time: member.avg_completion_time,
                    completion_ratio: Math.round(completionRatio * 100) / 100,
                    verdict: under ? "underperformer" : "acceptable",
                    reason: under
                      ? `${member.member} refusal rate ${member.refusal_rate} exceeds threshold ${refusalThreshold} and completion time ${member.avg_completion_time}s is ${Math.round(completionRatio * 10) / 10}x the ${completionTimeThreshold}s norm`
                      : `${member.member} metrics within norms`,
                  };
                });
                if (gradeAnswer?.graded_member) {
                  let index = gradedMembers.findIndex((member) => member.member === gradeAnswer.graded_member);
                  if (index < 0) {
                    const rosterMember = roster.find((member) => member.member === gradeAnswer.graded_member) ?? {};
                    gradedMembers.push({ member: gradeAnswer.graded_member, skill: rosterMember.skill ?? "unknown", refusal_count: 0, refusal_rate: 0, avg_completion_time: 0, completion_ratio: 0, verdict: "acceptable", reason: `${gradeAnswer.graded_member} metrics within norms` });
                    index = gradedMembers.length - 1;
                  }
                  gradedMembers[index] = { ...gradedMembers[index], refusal_count: gradeAnswer.refusal_count ?? gradedMembers[index].refusal_count, refusal_rate: gradeAnswer.refusal_rate ?? gradedMembers[index].refusal_rate, avg_completion_time: gradeAnswer.avg_completion_time ?? gradedMembers[index].avg_completion_time, completion_ratio: gradeAnswer.completion_ratio ?? gradedMembers[index].completion_ratio, verdict: gradeAnswer.verdict ?? gradedMembers[index].verdict, reason: gradeAnswer.reason ?? gradedMembers[index].reason };
                }
                let version = 0;
                for (const entry of events) if (typeof entry.version === "number") version = entry.version;
                const underperformers = gradedMembers.filter((member) => member.verdict === "underperformer").sort((a, b) => (b.refusal_rate + b.completion_ratio) - (a.refusal_rate + a.completion_ratio));
                let decision = { underperformer: false, member_to_remove: null, replacement_candidate: null, reason: "No members exceed the refusal and completion time thresholds." };
                const guardRails = { min_roster_size: minRosterSize, remaining_after_removal: roster.length, sole_skill_block: false };
                if (underperformers.length) {
                  const worst = underperformers[0];
                  const remaining = roster.length - 1;
                  guardRails.remaining_after_removal = remaining;
                  const skillHolders = roster.filter((member) => member.skill === worst.skill);
                  if (remaining < minRosterSize) {
                    guardRails.triggered = "min_roster_guard";
                    decision = { underperformer: true, member_to_remove: null, replacement_candidate: null, reason: `${worst.member} underperforms (${worst.reason}) but removal would reduce roster below min_roster_size ${minRosterSize}.` };
                  } else if (skillHolders.length === 1 && skillHolders[0].member === worst.member) {
                    guardRails.sole_skill_block = true;
                    guardRails.triggered = "sole_skill_guard";
                    decision = { underperformer: true, member_to_remove: null, replacement_candidate: null, reason: `${worst.member} underperforms (${worst.reason}) but is the sole holder of skill ${worst.skill}.` };
                  } else {
                    const replacement = roster.find((member) => member.skill === worst.skill && member.member !== worst.member)?.member ?? `replacement-needed:${worst.skill}`;
                    decision = { underperformer: true, member_to_remove: worst.member, replacement_candidate: replacement, reason: worst.reason };
                  }
                }
                const judgmentEvent = { type: "roster_tuned", payload: { decision, graded_members: gradedMembers } };
                console.log(JSON.stringify({ roster_decision: { schema: "runx.roster.tuning.v1", case_id: caseId, decision, projection: { aggregate_id: aggregateId, events_folded: events.length, version_before: version }, appended_judgment: { aggregate_id: aggregateId, version_after: version + 1, idempotency_key: idempotencyKey, event_ref: `${resource}:${aggregateId}:${version + 1}` }, judgment_event: judgmentEvent, folded_metrics: gradedMembers, guard_rails: guardRails } }));
          artifacts:
            named_emits:
              roster_decision: roster_decision
            packets:
              roster_decision: runx.roster.tuning.v1
