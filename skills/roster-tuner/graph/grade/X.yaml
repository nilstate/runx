skill: roster-tuner-grade
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: internal
  role: graph-stage
  part_of:
    - runx/roster-tuner

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    artifacts:
      named_emits:
        grade_result: runx.roster.grade.v1
      agent_tasks:
        - id: grade-member
          description: "Grade a folded member's metrics against the operator norms and produce an evidence-based verdict."
          inputs:
            member:
              type: string
              required: true
            folded_metrics:
              type: json
              required: true
            norms:
              type: json
              required: true
    inputs:
      folded_metrics:
        type: json
        required: false
        description: Folded per-member metrics from the fold step.
      performance_norms:
        type: json
        required: true
        description: "{refusal_threshold, completion_time_threshold, min_roster_size}."
