skill: seo-gap-miner
version: "0.2.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: grounded-content-gaps-sealed
      inputs:
        site_ref: https://example.dev/
        site_inventory:
          pages:
            - url: https://example.dev/docs/governance
              topic: agent governance
              coverage: Explains policy boundaries and approvals, but lacks an actionable checklist.
            - url: https://example.dev/blog/receipts
              topic: receipt verification
              coverage: Brief receipt overview without an installable verification walkthrough.
        demand_fixtures:
          terms:
            - term: ai agent governance checklist
              demand_signal: Search Console export reports 340 impressions and 19 clicks over 28 days.
              source: fixture:gsc-2026-06.csv#row-12
            - term: verify ai agent receipts
              demand_signal: Search Console export reports 210 impressions and 4 clicks over 28 days.
              source: fixture:gsc-2026-06.csv#row-31
            - term: best crypto casino
              demand_signal: Search Console export reports 900 impressions over 28 days.
              source: fixture:gsc-2026-06.csv#row-44
        content_policy:
          excluded_topics:
            - crypto casino
          priority_themes:
            - agent governance
            - receipt verification
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

    - name: thin-demand-needs-more-evidence
      inputs:
        site_ref: https://example.dev/
        site_inventory:
          pages:
            - url: https://example.dev/docs/receipts
              topic: receipt verification
              coverage: Full verification walkthrough.
        demand_fixtures:
          terms:
            - term: agent audit templates
              demand_signal: ""
              source: ""
        content_policy:
          excluded_topics: []
          priority_themes:
            - agent governance
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

    - name: missing-input-needs-agent
      inputs: {}
      expect:
        status: needs_agent

runners:
  mine:
    default: true
    type: graph
    act:
      form: review
      purpose: Review supplied search demand against a supplied site inventory and content policy.
      legitimacy: The operator supplied public evidence for a bounded, read-only content-gap review.
      target_from: site_ref
      reason_step: analyze
      reason_from: review_reason
    inputs:
      site_ref:
        type: string
        required: true
        description: "Public URL identifying the reviewed site or bounded site section."
      site_inventory:
        type: json
        required: true
        description: "pages[] with public url, topic, and observed coverage. This is supplied evidence; the skill fetches no URLs."
      demand_fixtures:
        type: json
        required: true
        description: "terms[] with term, demand_signal, and public source. Missing signals are never inferred."
      content_policy:
        type: json
        required: true
        description: "excluded_topics and priority_themes used to drop prohibited gaps and grade supported ones."
    graph:
      name: seo-gap-miner
      steps:
        - id: analyze
          run:
            type: cli-tool
            command: /usr/bin/env
            args:
              - node
              - run.mjs
            outputs:
              decision: string
              gap_findings: array
              covered_terms: array
              dropped_by_policy: array
              stop_reason: string
              review_reason: string
              evidence_summary: object
          inputs:
            site_ref: "{{site_ref}}"
            site_inventory: "{{site_inventory}}"
            demand_fixtures: "{{demand_fixtures}}"
            content_policy: "{{content_policy}}"
          artifacts:
            wrap_as: seo_gap_review_packet
            packet: runx.seo_gap.review.v1
