skill: settle-invoice
version: "0.3.1"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
runners:
  settle-invoice:
    default: true
    type: graph
    inputs:
      invoice_ref:
        type: string
        required: true
        description: Stable opaque invoice reference.
      amount_minor:
        type: number
        required: true
        description: Positive invoice amount in minor currency units.
      currency:
        type: string
        required: true
        description: Uppercase ISO 4217 currency code.
      payee:
        type: object
        required: true
        description: Payee name, party_ref, and exactly one opaque settlement_ref or sha256 settlement_digest.
        schema:
          required: [name, party_ref]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 256 }
            party_ref: { type: string, minLength: 1, maxLength: 512 }
            settlement_ref: { type: string, minLength: 1, maxLength: 512 }
            settlement_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          oneOf:
            - required: [settlement_ref]
              not: { required: [settlement_digest] }
            - required: [settlement_digest]
              not: { required: [settlement_ref] }
      rail:
        type: string
        required: true
        description: "Executable canonical spend rail: mock, mpp, or stripe-spt."
      rail_profile_ref:
        type: string
        required: true
        description: Configured profile reference for the selected rail.
      parent_payment_authority:
        type: json
        packet: runx.authority_term.v1
        required: true
        description: Full typed parent payment AuthorityTerm; a reference alone is refused.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned settlement seed.
      realm:
        type: string
        required: false
        description: Expected payment realm.
      payment_admission:
        type: object
        required: false
        description: Bounded hosted admission and settlement identity.
        schema:
          additionalProperties: true
    graph:
      name: settle-invoice
      result_from: [prepare]
      steps:
        - id: prepare
          tool: payment.invoice_plan
          inputs:
            invoice_ref: $input.invoice_ref
            amount_minor: $input.amount_minor
            currency: $input.currency
            payee: $input.payee
            rail: $input.rail
            rail_profile_ref: $input.rail_profile_ref
            parent_payment_authority: $input.parent_payment_authority
            idempotency_seed: $input.idempotency_seed
            realm: $input.realm
            payment_admission: $input.payment_admission
