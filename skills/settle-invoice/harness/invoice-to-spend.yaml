name: settle-invoice-to-spend
steps:
  - id: prepare
    tool: payment.invoice_plan
    inputs:
      invoice_ref: INV-2026-FORWARD
      amount_minor: 125
      currency: USD
      payee:
        name: Acme Hosting
        party_ref: merchant:acme-hosting
        settlement_ref: payee-account:acme-hosting:stripe-test
      rail: stripe-spt
      rail_profile_ref: rail-profile:stripe-spt:test
      parent_payment_authority:
        term_id: authority:ap:2026:forward
        principal_ref:
          type: principal
          uri: principal:operator:test
        resource_ref:
          type: surface
          uri: merchant:acme-hosting
        resource_family: effect
        verbs:
          - prepare
          - commit
        bounds:
          effect_limits:
            - family: payment
              unit: USD
              max_per_call_units: 125
              max_per_run_units: 125
              channels:
                - stripe-spt
              realm: test
              peer: merchant:acme-hosting
              operation: invoice.settle
              authorization_form: single_use_capability
              idempotency_required: true
              recovery_required: true
              receipt_before_success: true
              single_use_capability: true
        conditions: []
        approvals: []
        capabilities:
          - effect_single_use_capability
        issued_by_ref:
          type: host
          uri: authority:payment:test
      idempotency_seed: invoice-forward-001
      realm: test
      payment_admission:
        payment_admission_id: sha256:invoice-forward-admission-001
        money_movement_id: sha256:invoice-forward-movement-001
        kernel_token_digest: sha256:invoice-forward-admission-001
        token_digest: sha256:invoice-forward-admission-001
        token:
          rail: stripe-spt
          amount_minor: 125
          currency: USD
          counterparty: merchant:acme-hosting
  - id: spend
    skill: ../../spend
    runner: stripe-spt
    context:
      payment_signal: prepare.settlement_plan.data.downstream.inputs.payment_signal
      parent_payment_authority: prepare.settlement_plan.data.downstream.inputs.parent_payment_authority
      rail_profile_ref: prepare.settlement_plan.data.downstream.inputs.rail_profile_ref
      idempotency_seed: prepare.settlement_plan.data.downstream.inputs.idempotency_seed
      realm: prepare.settlement_plan.data.downstream.inputs.realm
      payment_admission: prepare.settlement_plan.data.downstream.inputs.payment_admission
