skill: spam-risk-reviewer
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: low-risk-verified-sender
      runner: default
      inputs:
        campaign_draft:
          from: "newsletter@example.com"
          subject: "June product notes for active customers"
          content_digest: "Monthly release notes, documentation links, and support office hours for opted-in customers."
        list_metadata:
          size: 12500
          bounce_rate: 0.003
          complaint_rate: 0.0002
          freshness: 21
        sender_auth_posture:
          spf_pass: true
          dkim_pass: true
          dmarc_pass: true
          warm_up_days: 45
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: high-risk-incomplete-auth-poor-list
      runner: default
      inputs:
        campaign_draft:
          from: "promo@example.com"
          subject: "URGENT free trial extension"
          content_digest: "Promotional reactivation campaign with aggressive urgency wording."
        list_metadata:
          size: 88000
          bounce_rate: 0.071
          complaint_rate: 0.0024
          freshness: 132
        sender_auth_posture:
          spf_pass: true
          dkim_pass: false
          dmarc_pass: true
          warm_up_days: 6
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

policy:
  allow:
    - provider: campaign-draft
      method: READ
      scope: runx:campaign:read
    - provider: list-metadata
      method: READ
      scope: runx:list-hygiene:read
    - provider: sender-auth-posture
      method: READ
      scope: runx:sender-auth:read
  deny:
    - public_send
    - outbound_send
    - operational_proposal
    - mint
    - domain_state_write
    - invented_authentication_signals
    - invented_list_health_metrics

emits:
  - name: send_risk_verdict
    packet: send_risk_verdict
    dispatch_by_name: send-as

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    timeout_seconds: 30
    inputs:
      campaign_draft:
        type: json
        required: true
      list_metadata:
        type: json
        required: true
      sender_auth_posture:
        type: json
        required: true
