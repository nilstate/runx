skill: data-store
version: "0.3.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  runtime_path: data-adapter
  execution: execute
  completion: runtime_receipt
  requires_adapter: true
  approval: conditional

policy:
  allow:
    - provider: data-source
      method: READ
      scope: runx:data:read
    - provider: data-source
      method: APPEND
      scope: runx:data:append
  deny:
    - raw_sql_from_model
    - unrestricted_export
    - secret_material
    - pii_without_projection

emits:
  - name: data_operation_result
    packet: runx.data.operation_result.v1

runners:
  append_event:
    default: true
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Stable logical ref bound by the project or hosted operator to a provider adapter.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      expected_version:
        type: number
        required: true
        description: Current stream version required before append.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this data effect.
      event:
        type: json
        required: true
        description: Domain event or transition packet to append.
      observed_at:
        type: string
        required: false
        description: Caller-observed ISO-8601 commit ordering time; defaults to the runtime observation time when omitted.
    graph:
      name: data-store-append-event
      result_from: [append]
      steps:
        - id: append
          tool: data.append_event
          scopes:
            - runx:data:append
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"
            expected_version: "$input.expected_version"
            idempotency_key: "$input.idempotency_key"
            event: "$input.event"
            observed_at: "$input.observed_at"

  read_events:
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Stable logical ref bound by the project or hosted operator to a provider adapter.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      limit:
        type: number
        required: false
        default: 50
        description: Maximum events to return.
      after_version:
        type: number
        required: false
        description: When present, return the next ascending page strictly after this stream version; omission retains the latest-tail read.
    graph:
      name: data-store-read-events
      result_from: [read]
      steps:
        - id: read
          tool: data.read_events
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"
            limit: "$input.limit"
            after_version: "$input.after_version"

  read_projection:
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Stable logical ref bound by the project or hosted operator to a provider adapter.
      resource:
        type: string
        required: true
        description: Declared event resource or projection family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
    graph:
      name: data-store-read-projection
      result_from: [read]
      steps:
        - id: read
          tool: data.read_projection
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"

  list_stream_heads:
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Stable logical ref bound by the project or hosted operator to a provider adapter.
      resource:
        type: string
        required: true
        description: Declared event resource whose latest stream events are listed.
      event_types:
        type: json
        required: false
        description: Optional array of at most 20 exact latest event types.
      limit:
        type: number
        required: false
        default: 50
        description: Maximum stream heads to return, capped at 100.
      cursor:
        type: string
        required: false
        description: Opaque cursor returned by the previous page.
    graph:
      name: data-store-list-stream-heads
      result_from: [read]
      steps:
        - id: read
          tool: data.list_stream_heads
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            event_types: "$input.event_types"
            limit: "$input.limit"
            cursor: "$input.cursor"

  append_and_readback:
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Stable logical ref bound by the project or hosted operator to a provider adapter.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      expected_version:
        type: number
        required: true
        description: Current stream version required before append.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this data effect.
      event:
        type: json
        required: true
        description: Domain event or transition packet to append.
      observed_at:
        type: string
        required: false
        description: Caller-observed ISO-8601 commit ordering time.
    graph:
      name: data-store-append-and-readback
      result_from: [append, readback]
      steps:
        - id: append
          tool: data.append_event
          scopes:
            - runx:data:append
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"
            expected_version: "$input.expected_version"
            idempotency_key: "$input.idempotency_key"
            event: "$input.event"
            observed_at: "$input.observed_at"
        - id: readback
          tool: data.read_projection
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: "$input.data_source_ref"
            resource: "$input.resource"
            aggregate_id: "$input.aggregate_id"
