skill: dependency-advisory-graph
version: "0.2.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    inputs:
      lockfile:
        type: json
        required: false
        description: npm package-lock JSON object for the target project.
      lockfile_path:
        type: string
        required: false
        description: Path inside the skill package to a real target package-lock.json.
      lockfile_url:
        type: string
        required: false
        description: Public URL to a target package-lock.json, fetched at run time.
      osv_response:
        type: json
        required: false
        description: Optional OSV querybatch response for offline harness fixtures.
      osv_response_path:
        type: string
        required: false
        description: Optional path inside the skill package to an OSV querybatch fixture.
      ecosystem:
        type: string
        required: false
        description: Dependency ecosystem label. Defaults to npm.
      project_name:
        type: string
        required: false
        description: Name of the target project being scanned.
      project_url:
        type: string
        required: false
        description: Public URL of the target project being scanned.
      output_dir:
        type: string
        required: false
        description: Directory inside the skill directory for evidence.json, verification.json, and report.md.
    outputs:
      dependency_advisory_graph: object
      evidence_json: object
      verification_json: object
      report_md: string
