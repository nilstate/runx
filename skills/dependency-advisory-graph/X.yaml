skill: dependency-advisory-graph
version: "0.2.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: sealed-advisory-minimist-008
      runner: default
      inputs:
        ecosystem: npm
        project_name: fixture/minimist-direct
        project_url: https://example.com/fixtures/minimist-direct
        lockfile:
          name: fixture-vulnerable-app
          version: 1.0.0
          lockfileVersion: 3
          requires: true
          packages:
            "":
              name: fixture-vulnerable-app
              version: 1.0.0
              dependencies:
                minimist: 0.0.8
                left-pad: 1.3.0
            node_modules/minimist:
              version: 0.0.8
              resolved: https://registry.npmjs.org/minimist/-/minimist-0.0.8.tgz
              integrity: sha512-fixture
            node_modules/left-pad:
              version: 1.3.0
              resolved: https://registry.npmjs.org/left-pad/-/left-pad-1.3.0.tgz
              integrity: sha512-fixture
        osv_response:
          retrieved_at: "2026-06-24T00:00:00.000Z"
          source:
            name: OSV querybatch fixture
            url: https://api.osv.dev/v1/querybatch
            retrieved_at: "2026-06-24T00:00:00.000Z"
          results:
            - vulns:
                - id: GHSA-vh95-rmgr-6w4m
                  aliases:
                    - CVE-2020-7598
                  summary: minimist prototype pollution
                  modified: "2026-06-24T00:00:00.000Z"
                  database_specific:
                    severity: CRITICAL
                  affected:
                    - package:
                        ecosystem: npm
                        name: minimist
                      ranges:
                        - type: SEMVER
                          events:
                            - introduced: "0"
                            - fixed: 0.2.1
                      versions:
                        - 0.0.8
                  references:
                    - type: ADVISORY
                      url: https://osv.dev/vulnerability/GHSA-vh95-rmgr-6w4m
            - vulns: []
        output_dir: artifacts/sealed-advisory-minimist-008
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
    - name: invalid-manifest-fails
      runner: default
      inputs:
        ecosystem: npm
        lockfile: {}
        osv_response:
          results: []
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed
          reason_code: process_failed

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    inputs:
      lockfile:
        type: json
        required: false
        description: npm package-lock JSON object for the target project.
      lockfile_path:
        type: string
        required: false
        description: Path inside the skill package to a real target package-lock.json.
      lockfile_url:
        type: string
        required: false
        description: Public URL to a target package-lock.json, fetched at run time.
      osv_response:
        type: json
        required: false
        description: Optional OSV querybatch response for offline harness fixtures.
      osv_response_path:
        type: string
        required: false
        description: Optional path inside the skill package to an OSV querybatch fixture.
      ecosystem:
        type: string
        required: false
        description: Dependency ecosystem label. Defaults to npm.
      project_name:
        type: string
        required: false
        description: Name of the target project being scanned.
      project_url:
        type: string
        required: false
        description: Public URL of the target project being scanned.
      output_dir:
        type: string
        required: false
        description: Directory inside the skill directory for evidence.json, verification.json, and report.md.
    outputs:
      dependency_advisory_graph: object
      evidence_json: object
      verification_json: object
      report_md: string
