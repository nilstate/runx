skill: dep-upgrade-plan
version: "0.2.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

runx:
  mutating: false
  idempotency:
    key: lockfile_sha256
  scopes:
    - dependencies.read
    - dependency_plan.write
  policy:
    data_classification: public_dependency_metadata
    network:
      allowed:
        - https://raw.githubusercontent.com/
        - https://api.osv.dev/v1/query
      forbidden:
        - private repositories
        - package installation
        - source code execution
    verifier_notes:
      - The skill fetches a real public npm package-lock.json and queries OSV.dev advisories at run time.
      - The skill never edits package manifests or installs dependencies.
      - The dogfood receipt must come from a post-publish registry skill run.
  artifacts:
    emits:
      - dependency_upgrade_plan
      - evidence_json
      - report_md
    wrap_as: dependency_upgrade_plan_packet

harness:
  cases:
    - name: nodegoat-live-osv-ranked-plan
      runner: default
      inputs:
        target_name: OWASP NodeGoat
        target_repo: https://github.com/OWASP/NodeGoat
        target_ref: c5cb68a7084e4ae7dcc60e6a98768720a81841e8
        lockfile_json: |
          {"name":"owasp-nodejs-goat","version":"1.3.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"owasp-nodejs-goat","version":"1.3.0","dependencies":{"bcrypt-nodejs":"0.0.3","body-parser":"^1.15.1","consolidate":"^0.14.1","csurf":"^1.8.3","dont-sniff-mimetype":"^1.0.0","express":"^4.13.4","express-session":"^1.13.0","forever":"^2.0.0","helmet":"^2.0.0","marked":"0.3.5","mongodb":"^2.1.18","needle":"2.2.4","node-esapi":"0.0.1","serve-favicon":"^2.3.0","swig":"^1.4.2","underscore":"^1.8.3"}},"node_modules/bcrypt-nodejs":{"version":"0.0.3"},"node_modules/body-parser":{"version":"1.18.3"},"node_modules/consolidate":{"version":"0.14.5"},"node_modules/csurf":{"version":"1.9.0"},"node_modules/dont-sniff-mimetype":{"version":"1.0.0"},"node_modules/express":{"version":"4.16.4"},"node_modules/express-session":{"version":"1.15.6"},"node_modules/forever":{"version":"2.0.0"},"node_modules/helmet":{"version":"2.3.0"},"node_modules/marked":{"version":"0.3.5"},"node_modules/mongodb":{"version":"2.2.36"},"node_modules/needle":{"version":"2.2.4"},"node_modules/node-esapi":{"version":"0.0.1"},"node_modules/serve-favicon":{"version":"2.5.0"},"node_modules/swig":{"version":"1.4.2"},"node_modules/underscore":{"version":"1.9.1"}}}
        advisory_mode: supplied
        advisories_json: |
          {"advisories":[{"package":"underscore","current":"1.9.1","fixed":"1.13.8","severity":"critical","advisory":"GHSA-cf4h-3jhx-xvhq","source":"https://osv.dev/vulnerability/GHSA-cf4h-3jhx-xvhq","breaking":"OSV fixed version stays within major 1; review release notes before shipping."},{"package":"body-parser","current":"1.18.3","fixed":"1.20.3","severity":"high","advisory":"GHSA-qwcr-r2fm-qrc7","source":"https://osv.dev/vulnerability/GHSA-qwcr-r2fm-qrc7","breaking":"OSV fixed version stays within major 1; review release notes before shipping."},{"package":"marked","current":"0.3.5","fixed":"4.0.10","severity":"high","advisory":"GHSA-5v2h-r2cx-5xgj","source":"https://osv.dev/vulnerability/GHSA-5v2h-r2cx-5xgj","breaking":"OSV fixed version crosses major versions (0.3.5 -> 4.0.10); review package changelog and runtime compatibility."},{"package":"mongodb","current":"2.2.36","fixed":"3.1.13","severity":"high","advisory":"GHSA-mh5c-679w-hh4r","source":"https://osv.dev/vulnerability/GHSA-mh5c-679w-hh4r","breaking":"OSV fixed version crosses major versions (2.2.36 -> 3.1.13); review package changelog and runtime compatibility."},{"package":"express","current":"4.16.4","fixed":"4.20.0","severity":"medium","advisory":"GHSA-qw6h-vgh9-j6wx","source":"https://osv.dev/vulnerability/GHSA-qw6h-vgh9-j6wx","breaking":"OSV fixed version stays within major 4; review release notes before shipping."}]}
        scan_scope: direct
        include_dev: false
        output_dir: artifacts/nodegoat-live
      expect:
        status: sealed
    - name: nodegoat-all-upgrades-blocked-refusal
      runner: default
      inputs:
        target_name: OWASP NodeGoat
        target_repo: https://github.com/OWASP/NodeGoat
        target_ref: c5cb68a7084e4ae7dcc60e6a98768720a81841e8
        lockfile_json: |
          {"name":"owasp-nodejs-goat","version":"1.3.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"owasp-nodejs-goat","version":"1.3.0","dependencies":{"bcrypt-nodejs":"0.0.3","body-parser":"^1.15.1","consolidate":"^0.14.1","csurf":"^1.8.3","dont-sniff-mimetype":"^1.0.0","express":"^4.13.4","express-session":"^1.13.0","forever":"^2.0.0","helmet":"^2.0.0","marked":"0.3.5","mongodb":"^2.1.18","needle":"2.2.4","node-esapi":"0.0.1","serve-favicon":"^2.3.0","swig":"^1.4.2","underscore":"^1.8.3"}},"node_modules/bcrypt-nodejs":{"version":"0.0.3"},"node_modules/body-parser":{"version":"1.18.3"},"node_modules/consolidate":{"version":"0.14.5"},"node_modules/csurf":{"version":"1.9.0"},"node_modules/dont-sniff-mimetype":{"version":"1.0.0"},"node_modules/express":{"version":"4.16.4"},"node_modules/express-session":{"version":"1.15.6"},"node_modules/forever":{"version":"2.0.0"},"node_modules/helmet":{"version":"2.3.0"},"node_modules/marked":{"version":"0.3.5"},"node_modules/mongodb":{"version":"2.2.36"},"node_modules/needle":{"version":"2.2.4"},"node_modules/node-esapi":{"version":"0.0.1"},"node_modules/serve-favicon":{"version":"2.5.0"},"node_modules/swig":{"version":"1.4.2"},"node_modules/underscore":{"version":"1.9.1"}}}
        advisory_mode: supplied
        advisories_json: |
          {"advisories":[{"package":"underscore","current":"1.9.1","fixed":"1.13.8","severity":"critical","advisory":"GHSA-cf4h-3jhx-xvhq","source":"https://osv.dev/vulnerability/GHSA-cf4h-3jhx-xvhq","breaking":"OSV fixed version stays within major 1; review release notes before shipping."},{"package":"body-parser","current":"1.18.3","fixed":"1.20.3","severity":"high","advisory":"GHSA-qwcr-r2fm-qrc7","source":"https://osv.dev/vulnerability/GHSA-qwcr-r2fm-qrc7","breaking":"OSV fixed version stays within major 1; review release notes before shipping."},{"package":"marked","current":"0.3.5","fixed":"4.0.10","severity":"high","advisory":"GHSA-5v2h-r2cx-5xgj","source":"https://osv.dev/vulnerability/GHSA-5v2h-r2cx-5xgj","breaking":"OSV fixed version crosses major versions (0.3.5 -> 4.0.10); review package changelog and runtime compatibility."},{"package":"mongodb","current":"2.2.36","fixed":"3.1.13","severity":"high","advisory":"GHSA-mh5c-679w-hh4r","source":"https://osv.dev/vulnerability/GHSA-mh5c-679w-hh4r","breaking":"OSV fixed version crosses major versions (2.2.36 -> 3.1.13); review package changelog and runtime compatibility."},{"package":"express","current":"4.16.4","fixed":"4.20.0","severity":"medium","advisory":"GHSA-qw6h-vgh9-j6wx","source":"https://osv.dev/vulnerability/GHSA-qw6h-vgh9-j6wx","breaking":"OSV fixed version stays within major 4; review release notes before shipping."}]}
        scan_scope: direct
        include_dev: false
        constraints_json: |
          {"constraints":{"body-parser":{"blocked":["1.20.3"],"notes":"Release train is frozen for HTTP request parsing changes."},"express":{"blocked":["4.20.0"],"notes":"Express upgrade requires a separate middleware compatibility review."},"marked":{"blocked":["4.0.10"],"notes":"Markdown renderer replacement is blocked for this release."},"mongodb":{"blocked":["3.1.13"],"notes":"Driver major upgrade requires database integration testing."},"underscore":{"blocked":["1.13.8"],"notes":"Template helper compatibility is blocked pending manual review."}}}
        output_dir: artifacts/nodegoat-blocked
      expect:
        status: failure

runners:
  default:
    default: true
    type: cli-tool
    command: /usr/bin/env
    args:
      - node
      - run.mjs
    scopes:
      - dependencies.read
      - dependency_plan.write
    policy:
      reads:
        - public npm package lockfiles
        - public advisory facts
        - public release constraints
      calls:
        - public raw lockfile fetch
        - live OSV.dev advisory query for exact locked npm versions
      writes:
        - dependency upgrade evidence
        - reviewer report
      disallows:
        - installing target packages
        - executing target project code
        - mutating package manifests
        - using private repository contents
    inputs:
      target_name:
        type: string
        required: true
        description: Human-readable project name.
      target_repo:
        type: string
        required: true
        description: Public source repository URL.
      target_ref:
        type: string
        required: false
        description: Immutable commit, tag, or release reference.
      lockfile_path:
        type: string
        required: false
        description: Local package-lock.json path inside the skill directory.
      lockfile_json:
        type: string
        required: false
        description: package-lock.json contents as a JSON string.
      lockfile_url:
        type: string
        required: false
        description: Public HTTPS package-lock.json URL.
      advisories_path:
        type: string
        required: false
        description: Optional supplemental local advisory facts path inside the skill directory.
      advisories_url:
        type: string
        required: false
        description: Optional supplemental public HTTPS URL for advisory facts JSON.
      advisories_json:
        type: string
        required: false
        description: Optional supplemental advisory facts as a JSON string.
      advisory_mode:
        type: string
        required: false
        default: live_osv
        description: live_osv queries OSV.dev; supplied uses only provided advisories for deterministic hosted harness replay.
      constraints_path:
        type: string
        required: false
        description: Local JSON constraints path inside the skill directory.
      constraints_url:
        type: string
        required: false
        description: Public HTTPS URL for constraints JSON.
      constraints_json:
        type: string
        required: false
        description: Constraints as a JSON string.
      output_dir:
        type: string
        required: false
        description: Directory inside the skill directory where artifacts should be written.
    outputs:
      dependency_upgrade_plan: object
      evidence_json: object
      report_md: string
