name: github-sync-persists-cursor-through-native-data-operation
kind: skill
target: ..
runner: plan_and_append_cursor
env:
  RUNX_DATA_SOURCES: '{"data_sources":{"tenant://github-sync/sqlite-cursors":{"adapter":"data.sqlite","database_path":".runx/data/github-sync-cursors.sqlite","resources":{"github_sync_events":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
inputs:
  data_source_ref: tenant://github-sync/sqlite-cursors
  resource: github_sync_events
  aggregate_id: runxhq/runx:triage-open
  expected_version: 0
  idempotency_key: runxhq/runx:triage-open:pull:v2
  repo: runxhq/runx
  direction: pull
  resources:
    kind: issues
    filters: { state: open, labels: [triage], limit: 25 }
  scope: read
expect:
  status: sealed
  steps: [read-cursor, plan, append-cursor-event, readback]
  step_outputs:
    plan:
      subset:
        sync_plan:
          data:
            decision: ready
            provider_status: not_called
    append-cursor-event:
      subset:
        data_operation_result:
          data:
            operation: append_event
            provider_evidence:
              adapter: data.sqlite
    readback:
      subset:
        data_operation_result:
          data:
            operation: read_projection
            provider_evidence:
              adapter: data.sqlite
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: github-sync, source_case: cursor-operation-proof, source: skills-fixture }
