name: github-sync-plans-push-for-later-approval
kind: skill
target: ..
runner: github-sync
inputs:
  repo: runxhq/runx
  direction: push
  resources:
    kind: issues
    filters: { limit: 1 }
    mutations:
      - ref: issues/241
        op: update
        payload: { labels: [triage] }
  scope: write
expect:
  status: sealed
  output:
    subset:
      sync_plan:
        decision: ready_for_approval
        scope_used: repo.write
        mutation:
          ref: issues/241
          op: update
          payload: { labels: [triage] }
        provider_status: not_called
        gates: { approval_required: true, approval_ref: "" }
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: github-sync, source_case: bounded-push-plan, source: skills-fixture }
