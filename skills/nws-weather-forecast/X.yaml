skill: nws-weather-forecast
version: "0.1.2"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/weather-forecast
  provider: national-weather-service
  runtime_path: http
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none
runners:
  forecast:
    default: true
    type: graph
    runx:
      category: data
    inputs:
      office:
        type: string
        required: true
        description: NWS forecast office id, for example LWX.
      grid_x:
        type: string
        required: true
        description: NWS grid X coordinate.
      grid_y:
        type: string
        required: true
        description: NWS grid Y coordinate.
    graph:
      name: nws-weather-forecast
      result_from: [forecast]
      steps:
        - id: forecast
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: forecast
                method: GET
                url: https://api.weather.gov/gridpoints/{office}/{grid_x},{grid_y}/forecast
                path:
                  office: $input.office
                  grid_x: $input.grid_x
                  grid_y: $input.grid_y
                headers:
                  user-agent: "runx-weather-catalog/0.1 (https://github.com/runxhq/runx)"
                  accept: "application/geo+json, application/json"
            allowed_hosts: [api.weather.gov]
            stop_on_error: true
  locate:
    type: graph
    inputs:
      lat:
        type: string
        required: true
        description: Latitude with no more than four decimal places.
      lon:
        type: string
        required: true
        description: Longitude with no more than four decimal places.
    graph:
      name: nws-weather-locate
      result_from: [points]
      steps:
        - id: points
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: points
                method: GET
                url: https://api.weather.gov/points/{lat},{lon}
                path:
                  lat: $input.lat
                  lon: $input.lon
                headers:
                  user-agent: "runx-weather-catalog/0.1 (https://github.com/runxhq/runx)"
                  accept: "application/geo+json, application/json"
            allowed_hosts: [api.weather.gov]
            stop_on_error: true
