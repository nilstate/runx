name: idempotent-route-replay-keeps-one-event
kind: graph
target: ../harness/route-replay.yaml
env:
  RUNX_DATA_SOURCES: '{"data_sources":{"tenant://business-ops/replay-routes":{"adapter":"data.sqlite","database_path":".runx/data/business-ops-route-replay.sqlite","resources":{"ops_routes":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
    reason_code: graph_closed
    child_receipt_count: 4
  steps:
    - classify
    - persist-route
    - replay-route
    - readback
  step_outputs:
    replay-route:
      subset:
        data_operation_result:
          data:
            schema: runx.data.operation_result.v1
            status: idempotent_replay
            before_version: 1
            after_version: 1
            provider_evidence:
              adapter: data.sqlite
              provider: sqlite-event-store
              storage_class: sqlite
    readback:
      subset:
        data_operation_result:
          data:
            status: read
            projection:
              aggregate_id: launch-readiness-replay
              event_count: 1
              version: 1
metadata:
  public_skill: business-ops
  source_case: idempotent-route-replay-keeps-one-event
  source: skills-fixture
  runner_kind: graph
  graph_shape: idempotent_route_replay
