skill: deliverability-judge
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

runx:
  mutating: false
  idempotency:
    key: evidence_sha256
  scopes:
    - deliverability.read
  policy:
    data_classification: sealed_provider_evidence
    network:
      allowed: []
      forbidden:
        - private endpoints
        - live throttle rails
        - payment rails
    verifier_notes:
      - Read-only verdict; mints no authority and holds no state.
      - Every signal evaluation is grounded in sealed evidence with source and timestamp.
      - Contradictory signals escalate to a human reviewer; no recommendation is emitted.
      - The recommendation is not an Effect and cannot trigger a send-as run.
  artifacts:
    emits:
      - deliverability_verdict
      - evidence_json
      - report_md
    wrap_as: deliverability_judge_packet

runners:
  default:
    default: true
    type: cli-tool
    command: /usr/bin/env
    args:
      - node
      - run.mjs
    scopes:
      - deliverability.read
    policy:
      reads:
        - sealed provider evidence
      calls: []
      writes:
        - evidence.json
        - report.md
      disallows:
        - live throttle execution
        - payment or money rail access
        - state persistence
        - authority minting
    inputs:
      evidence:
        type: object
        required: true
        description: >
          Sealed provider evidence with four signal objects, each containing
          source (string) and timestamp (ISO 8601 string):
          postmaster_report, bounce_metrics, complaint_metrics, placement_probe.
      policy:
        type: object
        required: true
        description: >
          Operator policy thresholds: min_reputation_score (number),
          max_bounce_pct (number 0-100), max_complaint_pct (number 0-100).
      output_dir:
        type: string
        required: false
        description: Directory inside the skill directory where artifacts should be written.
    outputs:
      deliverability_verdict: object
      evidence_json: object
      report_md: string

harness:
  cases:
    - name: sealed_healthy_signals_continue
      description: >
        Healthy reputation, low bounce, low complaint, and a passing placement
        probe fuse into verdict.healthy with recommendation.action continue.
      inputs:
        evidence:
          postmaster_report:
            source: "postmaster.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            reputation_score: 95
            domain: "example.com"
          bounce_metrics:
            source: "bounce-monitor.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            bounce_pct: 1.2
          complaint_metrics:
            source: "feedback-loop.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            complaint_pct: 0.05
          placement_probe:
            source: "placement-test.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            inbox_pct: 97.5
        policy:
          min_reputation_score: 80
          max_bounce_pct: 5
          max_complaint_pct: 0.3
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
    - name: contradictory_signals_escalate
      description: >
        Two signals contradict: reputation is high but bounce rate exceeds the
        policy threshold. No recommendation is emitted; the refusal still seals.
      inputs:
        evidence:
          postmaster_report:
            source: "postmaster.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            reputation_score: 92
            domain: "example.com"
          bounce_metrics:
            source: "bounce-monitor.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            bounce_pct: 8.5
          complaint_metrics:
            source: "feedback-loop.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            complaint_pct: 0.05
          placement_probe:
            source: "placement-test.example.com"
            timestamp: "2026-06-25T12:00:00Z"
            inbox_pct: 95.0
        policy:
          min_reputation_score: 80
          max_bounce_pct: 5
          max_complaint_pct: 0.3
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
