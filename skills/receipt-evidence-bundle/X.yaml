skill: receipt-evidence-bundle
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: valid-parent-child-bundle
      inputs:
        receipt_refs:
          - runx:receipt:demo-parent
          - runx:receipt:demo-child
        verification_results:
          - receipt_ref: runx:receipt:demo-parent
            verdict: valid
            receipt:
              schema: runx.receipt.v1
              id: runx:receipt:demo-parent
              state: sealed
              disposition: closed
              reason_code: process_closed
              authority:
                kid: runx-demo-key
                grant_digest: sha256:demo-grant
                scopes: [repo.read]
              bearer_token: Bearer fixture-secret-value
          - receipt_ref: runx:receipt:demo-child
            verdict: valid
            receipt:
              schema: runx.receipt.v1
              id: runx:receipt:demo-child
              parent_receipt_id: runx:receipt:demo-parent
              state: sealed
              disposition: closed
              reason_code: process_closed
              authority:
                kid: runx-demo-key
                scopes: [receipt.verify]
        artifact_links:
          source_url: https://github.com/zdfgu113/runx/tree/codex/receipt-evidence-bundle/skills/receipt-evidence-bundle
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed

    - name: malformed-reference-is-refused
      inputs:
        receipt_refs: [not-a-runx-receipt]
        verification_results: []
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed
          reason_code: process_failed

    - name: unverifiable-receipt-is-refused
      inputs:
        receipt_refs: [runx:receipt:unverified]
        verification_results:
          - receipt_ref: runx:receipt:unverified
            verdict: invalid
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed
          reason_code: process_failed

runners:
  bundle:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      summary: string
      verdict: string
      receipt_count: number
      verified_facts: array
      inferred_facts: array
      missing_evidence: array
      reviewer_actions: array
      redactions: array
      artifact_links: json
    artifacts:
      wrap_as: receipt_evidence_bundle
      packet: runx.receipt_evidence_bundle.v1
    inputs:
      receipt_refs:
        type: json
        required: true
        description: One receipt reference or a JSON array of receipt references.
      verification_results:
        type: json
        required: true
        description: Valid runx verify results keyed by or carrying each receipt reference.
      artifact_links:
        type: json
        required: false
        description: Optional public evidence links keyed by purpose or supplied as an array.
      redaction_terms:
        type: json
        required: false
        description: Optional literal sensitive values to remove from the output.
