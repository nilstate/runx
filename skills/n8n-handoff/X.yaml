skill: n8n-handoff
version: "0.2.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
input_definitions:
  event_id:
    type: string
    required: true
    description: Stable event id used by n8n for deduplication and by Runx for mutation idempotency.
    schema: { pattern: '^[A-Za-z0-9._:-]{3,200}$' }
  handoff_audience:
    type: string
    required: false
    default: n8n:workflow:runx-governed-effect
    description: Exact n8n workflow audience expected by the receiver.
    schema: { pattern: '^n8n:workflow:[^\s{}]+$' }
  execution_context:
    type: json
    packet: runx.orchestrator.execution_context.v1
    required: true
    description: Caller, principal, workflow, or upstream-run context for the handoff.
  payload:
    type: json
    required: true
    description: Non-empty business payload delivered intact inside the canonical envelope.
  source:
    type: string
    required: false
    default: runx
    description: Human-readable source label.
    schema: { minLength: 1, maxLength: 256 }
  receiver:
    type: json
    required: false
    description: Optional receiver metadata; a supplied url must be public HTTPS.
  webhook_host:
    type: string
    required: true
    description: Public n8n host, without scheme or path.
    schema: { pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]{1,5})?$' }
  workflow_slug:
    type: string
    required: false
    default: runx-governed-effect
    description: Single safe n8n webhook path segment.
    schema: { pattern: '^[A-Za-z0-9_-]+$', maxLength: 128 }
harness:
  cases:
    - name: n8n-handoff-preflight-ready
      operator_journeys:
        - mode: standalone
          request: Hand this governed Runx payload to the configured n8n workflow.
          expected_outcome: Validate context, bind scoped auth and idempotency, and return the exact provider-neutral webhook handoff contract.
        - mode: composed
          request: Continue this completed Runx operation into the selected n8n workflow.
          expected_outcome: Reuse the supplied run context and payload without rebuilding upstream results or duplicating webhook delivery.
          prior_evidence:
            - The validated Runx execution context, payload, workflow target, and idempotency key supplied in the fixture.
          must_not_repeat:
            - Do not rerun the upstream Runx operation.
            - Do not deliver the webhook again after stable receipt evidence exists.
      runner: preflight
      inputs:
        event_id: evt_n8n_demo_001
        handoff_audience: n8n:workflow:runx-governed-effect
        execution_context:
          caller: runx-cli
          workflow_ref: self-hosted-n8n-demo
          environment: local-dogfood
        payload:
          hello: workflow
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
        steps:
          - build-handoff-context
        step_outputs:
          build-handoff-context:
            subset:
              handoff_context:
                data:
                  platform: n8n
                  event_id: evt_n8n_demo_001
                  status: ready
                  idempotency:
                    key: evt_n8n_demo_001
                    receiver_should_dedupe: true
                  receiver_validation:
                    require_scope: orchestrator.n8n.workflow.invoke
                    require_audience: n8n:workflow:runx-governed-effect
                  receipt_expectations:
                    outbound_effect_must_be_receipted: true
                    receiver_response_must_be_captured: true
runners:
  preflight:
    default: false
    type: graph
    runx:
      category: ops
    inputs:
      event_id:
        definition: event_id
      handoff_audience:
        definition: handoff_audience
      execution_context:
        definition: execution_context
      payload:
        definition: payload
      source:
        definition: source
      receiver:
        definition: receiver
    examples:
      - event_id: evt_n8n_demo_001
        handoff_audience: n8n:workflow:runx-governed-effect
        execution_context: { caller: runx-cli, workflow_ref: self-hosted-n8n-demo }
        payload: { hello: workflow }
    graph:
      name: n8n-handoff-preflight
      result_from: [build-handoff-context]
      steps:
        - id: build-handoff-context
          tool: control.prepare_handoff
          inputs:
            platform: n8n
            event_id: $input.event_id
            handoff_scope: orchestrator.n8n.workflow.invoke
            handoff_audience: $input.handoff_audience
            execution_context: $input.execution_context
            payload: $input.payload
            source: $input.source
            receiver: $input.receiver
  send:
    default: true
    type: graph
    inputs:
      webhook_host:
        definition: webhook_host
      workflow_slug:
        definition: workflow_slug
      event_id:
        definition: event_id
      handoff_audience:
        definition: handoff_audience
      execution_context:
        definition: execution_context
      payload:
        definition: payload
      source:
        definition: source
      receiver:
        definition: receiver
    examples:
      - webhook_host: n8n.example.com
        workflow_slug: runx-governed-effect
        event_id: evt_n8n_demo_001
        handoff_audience: n8n:workflow:runx-governed-effect
        execution_context: { caller: runx-cli, workflow_ref: self-hosted-n8n-demo }
        payload: { hello: workflow }
    graph:
      name: n8n-handoff-send
      result_from: [readback]
      steps:
        - id: build-handoff-context
          tool: control.prepare_handoff
          inputs:
            platform: n8n
            event_id: $input.event_id
            handoff_scope: orchestrator.n8n.workflow.invoke
            handoff_audience: $input.handoff_audience
            execution_context: $input.execution_context
            payload: $input.payload
            source: $input.source
            receiver: $input.receiver
        - id: invoke
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.event_id
          scopes: [orchestrator.n8n.workflow.invoke]
          policy:
            provider_permission: { verb: write }
          inputs:
            expected_provider: n8n
            operation: workflow.invoke
            target: $input.webhook_host
            idempotency_key: $input.event_id
            result_fields: [event_id, invocation_ref, status, idempotency_key]
            expected_result: { event_id: $input.event_id, status: accepted }
            input:
              workflow_slug: $input.workflow_slug
          context:
            handoff_context: build-handoff-context.handoff_context.data

        - id: readback
          tool: provider.read
          scopes: [orchestrator.n8n.workflow.read]
          policy:
            provider_permission: { verb: read }
          inputs:
            expected_provider: n8n
            operation: workflow.invocation.read
            target: $input.webhook_host
            result_fields: [event_id, invocation_ref, status, idempotency_key]
            expected_result:
              event_id: $input.event_id
              invocation_ref: $input.invoke_result.invocation_ref
              status: accepted
              idempotency_key: $input.invoke_result.idempotency_key
          context:
            invoke_result: invoke.provider_operation.data.result
