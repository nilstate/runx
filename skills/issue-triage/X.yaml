skill: issue-triage
version: "0.3.1"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: none

input_definitions:
  repository:
    type: string
    required: true
    description: GitHub repository as owner/name.
    schema:
      pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
      examples: [runxhq/runx]
  issue_number:
    type: string
    required: true
    description: Positive GitHub issue number.
    schema:
      pattern: '^[1-9][0-9]*$'
      examples: ['241']
  issue_snapshot:
    type: object
    required: true
    description: One bounded GitHub issue snapshot from a declared provider or supplied source.
    schema:
      required: [repository, number, title, state, body]
      additionalProperties: false
      properties:
        repository: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        number: { type: string, pattern: '^[1-9][0-9]*$' }
        title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
        state: { type: string, enum: [open, closed] }
        body: { type: string, maxLength: 20000, pattern: '^[^\u0000]*$' }
        source_ref: { type: string, minLength: 1, maxLength: 1024 }
  issue_snapshots:
    type: array
    required: true
    description: One to 100 bounded GitHub issue snapshots from declared providers or supplied sources.
    schema:
      minItems: 1
      maxItems: 100
      items:
        type: object
        required: [repository, number, title, state, body]
        additionalProperties: false
        properties:
          repository: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
          number: { type: string, pattern: '^[1-9][0-9]*$' }
          title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
          state: { type: string, enum: [open, closed] }
          body: { type: string, maxLength: 20000, pattern: '^[^\u0000]*$' }
          source_ref: { type: string, minLength: 1, maxLength: 1024 }

runners:
  provider-respond:
    default: true
    type: graph
    inputs:
      repository: { definition: repository }
      issue_number: { definition: issue_number }
      objective:
        type: string
        required: false
        description: Desired outcome for the draft response.
      maintainer_context:
        type: string
        required: false
        description: Repository norms, tone, and release posture.
    examples:
      - repository: runxhq/runx
        issue_number: '241'
        objective: Draft the next helpful maintainer response.
    graph:
      name: issue-triage-provider-respond
      result_from: [finalize]
      steps:
        - id: read-issue
          tool: provider.read
          scopes:
            - repo.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: issue.read
            target: $input.repository
            expected_provider: github
            expected_result:
              repository: $input.repository
              number: $input.issue_number
            result_fields: [repository, number, title, state, body]
            input:
              repository: $input.repository
              issue_number: $input.issue_number

        - id: digest-snapshot
          tool: data.digest
          context:
            value: read-issue.provider_operation.data.result

        - id: admit
          context:
            issue_snapshot: read-issue.provider_operation.data.result
            provider_operation: read-issue.provider_operation.data
            snapshot_digest: digest-snapshot.digest_result.data.digest
          run:
            type: javascript
            module: issue-triage.mjs
            export: admitIssue
            outputs:
              issue_evidence: object
          artifacts:
            named_emits:
              issue_evidence: issue_evidence

        - id: draft
          run:
            type: agent-task
            agent: builder
            task: issue-triage-respond
            outputs:
              issue_profile: object
              response_strategy: object
              response_draft: object
              follow_up_actions: array
          inputs:
            objective: $input.objective
            maintainer_context: $input.maintainer_context
          context:
            issue_evidence: admit.issue_evidence.data

        - id: finalize
          context:
            issue_evidence: admit.issue_evidence.data
            issue_profile: draft.issue_profile
            response_strategy: draft.response_strategy
            response_draft: draft.response_draft
            follow_up_actions: draft.follow_up_actions
          run:
            type: javascript
            module: issue-triage.mjs
            export: finalizeResponse
            outputs:
              issue_triage_packet: object
          artifacts:
            named_emits:
              issue_triage_packet: issue_triage_packet
            packets:
              issue_triage_packet: runx.issue.triage.v1

  discover:
    type: graph
    inputs:
      issue_snapshots: { definition: issue_snapshots }
      query:
        type: string
        required: true
        description: Selection objective for this bounded issue set.
        schema:
          minLength: 1
          maxLength: 2000
      maintainer_context:
        type: string
        required: false
        description: Repository norms and response constraints.
    examples:
      - query: Find unanswered issues where a maintainer response would unblock progress.
        issue_snapshots:
          - { repository: runxhq/runx, number: '241', title: Sourcey output path is unclear, state: open, body: The docs name two different output directories. }
    graph:
      name: issue-triage-discover
      result_from: [finalize]
      steps:
        - id: digest-snapshots
          tool: data.digest
          inputs:
            value: $input.issue_snapshots

        - id: index
          inputs:
            issue_snapshots: $input.issue_snapshots
            query: $input.query
          context:
            snapshot_digest: digest-snapshots.digest_result.data.digest
          run:
            type: javascript
            module: issue-triage.mjs
            export: indexIssues
            outputs:
              issue_index: object
          artifacts:
            named_emits:
              issue_index: issue_index

        - id: select
          run:
            type: agent-task
            agent: researcher
            task: issue-triage-discover
            outputs:
              issue_candidates: array
              selection_rationale: object
          inputs:
            maintainer_context: $input.maintainer_context
          context:
            issue_index: index.issue_index.data

        - id: finalize
          context:
            issue_index: index.issue_index.data
            issue_candidates: select.issue_candidates
            selection_rationale: select.selection_rationale
          run:
            type: javascript
            module: issue-triage.mjs
            export: finalizeDiscovery
            outputs:
              issue_triage_queue: object
          artifacts:
            named_emits:
              issue_triage_queue: issue_triage_queue
            packets:
              issue_triage_queue: runx.issue.triage_queue.v1

  respond:
    type: graph
    inputs:
      issue_snapshot: { definition: issue_snapshot }
      objective:
        type: string
        required: false
        description: Desired outcome for the draft response.
      maintainer_context:
        type: string
        required: false
        description: Repository norms, tone, and release posture.
    examples:
      - issue_snapshot: { repository: runxhq/runx, number: '241', title: Sourcey output path is unclear, state: open, body: The docs name two different output directories. }
        objective: Draft the next helpful maintainer response.
    graph:
      name: issue-triage-respond
      result_from: [finalize]
      steps:
        - id: digest-snapshot
          tool: data.digest
          inputs:
            value: $input.issue_snapshot

        - id: admit
          inputs:
            issue_snapshot: $input.issue_snapshot
          context:
            snapshot_digest: digest-snapshot.digest_result.data.digest
          run:
            type: javascript
            module: issue-triage.mjs
            export: admitIssue
            outputs:
              issue_evidence: object
          artifacts:
            named_emits:
              issue_evidence: issue_evidence

        - id: draft
          run:
            type: agent-task
            agent: builder
            task: issue-triage-respond
            outputs:
              issue_profile: object
              response_strategy: object
              response_draft: object
              follow_up_actions: array
          inputs:
            objective: $input.objective
            maintainer_context: $input.maintainer_context
          context:
            issue_evidence: admit.issue_evidence.data

        - id: finalize
          context:
            issue_evidence: admit.issue_evidence.data
            issue_profile: draft.issue_profile
            response_strategy: draft.response_strategy
            response_draft: draft.response_draft
            follow_up_actions: draft.follow_up_actions
          run:
            type: javascript
            module: issue-triage.mjs
            export: finalizeResponse
            outputs:
              issue_triage_packet: object
          artifacts:
            named_emits:
              issue_triage_packet: issue_triage_packet
            packets:
              issue_triage_packet: runx.issue.triage.v1

  mcp-read:
    type: graph
    inputs:
      repository: { definition: repository }
      issue_number: { definition: issue_number }
    examples:
      - repository: runxhq/runx
        issue_number: '241'
    graph:
      name: issue-triage-mcp-read
      result_from: [read_issue]
      steps:
        - id: read_issue
          skill: ../../examples/github-mcp-hero/read-issue
          scopes: [repo.read]
          policy:
            provider_permission:
              grant_id: github-mcp-issue-triage-read
              verb: read
          inputs:
            repository: $input.repository
            issue_number: $input.issue_number
