skill: pay-reserve
version: "0.2.1"
catalog:
  kind: skill
  audience: operator
  visibility: internal
  role: graph-stage
  part_of: [runx/spend]
harness:
  cases:
    - name: pay-reserve-native-subset
      runner: reserve
      inputs:
        payment_quote_packet:
          payment_quote: { quote_id: quote_demo_001, amount_minor: 125, currency: USD, rails: [mock], counterparty: "merchant:demo", operation: search.paid, realm: test }
          requested_payment_authority:
            term_id: payment-request-demo
            principal_ref: { type: principal, uri: "principal:operator:test" }
            resource_ref: { type: surface, uri: "merchant:demo" }
            resource_family: effect
            verbs: [prepare, commit]
            bounds:
              effect_limits:
                - family: payment
                  unit: USD
                  max_per_call_units: 125
                  max_per_run_units: 125
                  channels: [mock]
                  realm: test
                  peer: "merchant:demo"
                  operation: search.paid
                  authorization_form: single_use_capability
                  idempotency_required: true
                  recovery_required: true
                  receipt_before_success: true
                  single_use_capability: true
            conditions: []
            approvals: []
            capabilities: [effect_single_use_capability]
            expires_at: 2026-05-22T00:00:00Z
            issued_by_ref: { type: host, uri: "authority:payment:test" }
          challenge_evidence: { source_refs: ["signal:ch_mock_001"], redactions: [] }
          risk_notes: []
          open_questions: []
        parent_payment_authority:
          term_id: authority-term:payment:test
          principal_ref: { type: principal, uri: "principal:operator:test" }
          resource_ref: { type: surface, uri: "merchant:demo" }
          resource_family: effect
          verbs: [prepare, commit]
          bounds:
            effect_limits:
              - family: payment
                unit: USD
                max_per_call_units: 1000
                max_per_run_units: 5000
                channels: [mock]
                realm: test
                peer: "merchant:demo"
                operation: search.paid
                authorization_form: single_use_capability
                idempotency_required: true
                recovery_required: true
                receipt_before_success: true
                single_use_capability: true
          conditions: []
          approvals: []
          capabilities: [effect_single_use_capability]
          expires_at: 2026-05-22T00:00:00Z
          issued_by_ref: { type: host, uri: "authority:payment:test" }
        idempotency_seed: demo-search-001
        target_harness_ref: { type: harness, uri: "runx:harness:spend" }
        target_act_id: act_fulfill
      expect:
        status: sealed
        receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
        steps: [reserve]
    - name: pay-reserve-refuses-quote-over-parent-ceiling
      runner: reserve
      inputs:
        payment_quote_packet:
          payment_quote: { quote_id: quote_bad, amount_minor: 2000, currency: USD, rails: [mock], counterparty: "merchant:demo", operation: search.paid }
          requested_payment_authority:
            term_id: payment-request-bad
            principal_ref: { type: principal, uri: "principal:operator:test" }
            resource_ref: { type: surface, uri: "merchant:demo" }
            resource_family: effect
            verbs: [prepare, commit]
            bounds:
              effect_limits:
                - { family: payment, unit: USD, max_per_call_units: 2000, max_per_run_units: 2000, channels: [mock], peer: "merchant:demo", operation: search.paid, authorization_form: single_use_capability, idempotency_required: true, recovery_required: true, receipt_before_success: true, single_use_capability: true }
            conditions: []
            approvals: []
            capabilities: [effect_single_use_capability]
            issued_by_ref: { type: host, uri: "authority:payment:test" }
        parent_payment_authority:
          term_id: authority-term:payment:test
          principal_ref: { type: principal, uri: "principal:operator:test" }
          resource_ref: { type: surface, uri: "merchant:demo" }
          resource_family: effect
          verbs: [prepare, commit]
          bounds:
            effect_limits:
              - { family: payment, unit: USD, max_per_call_units: 1000, max_per_run_units: 5000, channels: [mock], peer: "merchant:demo", operation: search.paid, authorization_form: single_use_capability, idempotency_required: true, recovery_required: true, receipt_before_success: true, single_use_capability: true }
          conditions: []
          approvals: []
          capabilities: [effect_single_use_capability]
          issued_by_ref: { type: host, uri: "authority:payment:test" }
        idempotency_seed: bad
        target_harness_ref: { type: harness, uri: "runx:harness:spend" }
        target_act_id: act_fulfill
      expect: { status: failure }
runners:
  reserve:
    default: true
    type: graph
    inputs:
      payment_quote_packet: { type: object, required: true, description: Native payment.quote packet data. }
      parent_payment_authority: { type: json, packet: runx.authority_term.v1, required: true, description: Full typed parent AuthorityTerm used to recompute attenuation. }
      idempotency_seed: { type: string, required: true, description: Stable caller-owned reservation seed. }
      target_harness_ref: { type: object, required: true, description: Exact downstream harness Reference. }
      target_act_id: { type: string, required: true, description: Exact downstream payment act id. }
    graph:
      name: pay-reserve
      result_from: [reserve]
      steps:
        - id: reserve
          tool: payment.reserve
          mutation: true
          scopes: [payment:reserve]
          inputs:
            payment_quote_packet: $input.payment_quote_packet
            parent_payment_authority: $input.parent_payment_authority
            idempotency_seed: $input.idempotency_seed
            target_harness_ref: $input.target_harness_ref
            target_act_id: $input.target_act_id
