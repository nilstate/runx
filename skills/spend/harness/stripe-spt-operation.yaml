name: spend-stripe-spt-operation-proof
steps:
  - id: quote
    tool: payment.quote
    inputs:
      payment_signal: &a2
        challenge_id: ch_stripe_spt_operation_001
        rail: stripe-spt
        amount_minor: 125
        currency: USD
        counterparty: merchant:demo
        operation: search.paid
        realm: test
      parent_payment_authority: &a1
        term_id: authority-term:payment:operation-parent-001
        principal_ref:
          type: principal
          uri: principal:operator:test
        resource_ref:
          type: surface
          uri: merchant:demo
        resource_family: effect
        verbs:
          - prepare
          - commit
        bounds:
          effect_limits:
            - family: payment
              unit: USD
              max_per_call_units: 125
              max_per_run_units: 125
              channels:
                - stripe-spt
              realm: test
              peer: merchant:demo
              operation: search.paid
              authorization_form: single_use_capability
              idempotency_required: true
              recovery_required: true
              receipt_before_success: true
              single_use_capability: true
        conditions: []
        approvals: []
        capabilities:
          - effect_single_use_capability
        issued_by_ref:
          type: host
          uri: authority:payment:test
      idempotency_seed: operation-001
    artifacts:
      wrap_as: payment_quote_packet
      packet: runx.payment.quote.v1
  - id: reserve
    tool: payment.reserve
    mutation: true
    scopes:
      - payment:reserve
    inputs:
      parent_payment_authority: *a1
      idempotency_seed: operation-001
      target_harness_ref:
        type: harness
        uri: runx:harness:spend-stripe-spt-operation-proof
      target_act_id: act_fulfill
    context:
      payment_quote_packet: quote.payment_quote_packet.data
    artifacts:
      wrap_as: payment_reservation_packet
      packet: runx.payment.reservation.v1
  - id: fulfill
    skill: ../graph/pay-fulfill-rail
    runner: stripe-spt
    mutation: true
    inputs:
      payment_challenge: *a2
      rail_profile_ref: rail-profile:stripe-spt:test
      payment_admission:
        payment_admission_id: sha256:payment-admission-operation-001
        money_movement_id: sha256:money-movement-operation-001
        kernel_token_digest: sha256:payment-admission-operation-001
        token:
          rail: stripe-spt
          amount_minor: 125
          currency: USD
          counterparty: merchant:demo
    context:
      reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
      spend_capability_ref: reserve.payment_reservation_packet.data.spend_capability_ref
      idempotency: reserve.payment_reservation_packet.data.idempotency
      quote_packet: quote.payment_quote_packet.data
    artifacts:
      wrap_as: effect_evidence_packet
      packet: runx.effect.evidence.v1
