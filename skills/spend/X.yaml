skill: spend
version: "0.3.2"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
input_definitions:
  payment_signal:
    type: json
    packet: runx.payment.signal.v1
    required: true
    description: Exact typed payment-required signal or challenge.
  parent_payment_authority:
    type: json
    packet: runx.authority_term.v1
    required: true
    description: Full typed parent payment AuthorityTerm; a reference alone is refused.
  realm:
    type: string
    required: false
    description: Authority realm; when supplied it must match both signal and parent authority.
    schema: { minLength: 1, maxLength: 64 }
  rail_preferences:
    type: array
    required: false
    description: Ordered rail allowlist used to narrow the parent authority.
    schema:
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 64 }
  rail_profile_ref:
    type: string
    required: true
    description: Configured opaque rail profile reference.
    schema: { minLength: 1, maxLength: 512, pattern: '^\S+$' }
  payment_admission:
    type: object
    required: false
    description: Provider-specific hosted payment admission and settlement identity passed only to the selected rail.
    schema:
      additionalProperties: true
  idempotency_seed:
    type: string
    required: true
    description: Stable caller-owned material shared across quote, reservation, and provider execution.
    schema: { minLength: 1, maxLength: 256 }
runners:
  plan:
    default: false
    type: graph
    inputs:
      payment_signal:
        definition: payment_signal
      parent_payment_authority:
        definition: parent_payment_authority
      realm:
        definition: realm
      rail_preferences:
        definition: rail_preferences
      idempotency_seed:
        definition: idempotency_seed
    examples:
      - payment_signal:
          signal_type: effect_required
          challenge_id: ch_payment_001
          amount_minor: 125
          currency: USD
          counterparty: merchant:demo
          operation: search.paid
          realm: test
        parent_payment_authority:
          term_id: authority-term:payment:demo-001
          principal_ref: { type: host, uri: principal:operator:test }
          resource_ref: { type: surface, uri: merchant:demo }
          resource_family: effect
          verbs: [prepare, commit]
          bounds:
            effect_limits:
              - family: payment
                unit: USD
                max_per_call_units: 125
                max_per_run_units: 125
                channels: [mock, mpp, stripe-spt, x402]
                realm: test
                peer: merchant:demo
                operation: search.paid
                idempotency_required: true
                recovery_required: true
                receipt_before_success: true
                single_use_capability: true
                authorization_form: single_use_capability
          conditions: []
          approvals: []
          capabilities: [effect_single_use_capability]
          issued_by_ref: { type: host, uri: authority:payment:test }
        realm: test
        rail_preferences: [mock]
        idempotency_seed: demo-payment-001
    graph:
      name: spend-plan
      result_from: [quote]
      steps:
        - id: quote
          skill: graph/pay-quote
          runner: quote
          scopes:
            - payment:quote
          inputs:
            payment_signal: $input.payment_signal
            realm: $input.realm
            rail_preferences: $input.rail_preferences
            idempotency_seed: $input.idempotency_seed
            parent_payment_authority: $input.parent_payment_authority
          artifacts:
            wrap_as: payment_quote_packet
            packet: runx.payment.quote.v1
  mock:
    default: true
    type: graph
    inputs:
      payment_signal:
        definition: payment_signal
      parent_payment_authority:
        definition: parent_payment_authority
      rail_profile_ref:
        definition: rail_profile_ref
      payment_admission:
        definition: payment_admission
      realm:
        definition: realm
      idempotency_seed:
        definition: idempotency_seed
    examples:
      - payment_signal:
          signal_type: effect_required
          challenge_id: ch_payment_001
          amount_minor: 125
          currency: USD
          counterparty: merchant:demo
          operation: search.paid
          realm: test
        parent_payment_authority:
          term_id: authority-term:payment:demo-001
          principal_ref: { type: host, uri: principal:operator:test }
          resource_ref: { type: surface, uri: merchant:demo }
          resource_family: effect
          verbs: [prepare, commit]
          bounds:
            effect_limits:
              - family: payment
                unit: USD
                max_per_call_units: 125
                max_per_run_units: 125
                channels: [mock, mpp, stripe-spt, x402]
                realm: test
                peer: merchant:demo
                operation: search.paid
                idempotency_required: true
                recovery_required: true
                receipt_before_success: true
                single_use_capability: true
                authorization_form: single_use_capability
          conditions: []
          approvals: []
          capabilities: [effect_single_use_capability]
          issued_by_ref: { type: host, uri: authority:payment:test }
        rail_profile_ref: rail-profile:mock:test
        realm: test
        idempotency_seed: demo-payment-001
    graph:
      name: spend
      result_from: [fulfill]
      steps:
        - id: quote
          skill: graph/pay-quote
          runner: quote
          scopes:
            - payment:quote
          inputs:
            payment_signal: $input.payment_signal
            realm: $input.realm
            idempotency_seed: $input.idempotency_seed
            parent_payment_authority: $input.parent_payment_authority
          artifacts:
            wrap_as: payment_quote_packet
            packet: runx.payment.quote.v1
        - id: reserve
          skill: graph/pay-reserve
          runner: reserve
          scopes:
            - payment:reserve
          mutation: true
          idempotency_key: pay-reserve
          inputs:
            parent_payment_authority: $input.parent_payment_authority
            idempotency_seed: $input.idempotency_seed
            target_harness_ref:
              type: harness
              uri: runx:harness:spend
            target_act_id: act_fulfill
          context:
            payment_quote_packet: quote.payment_quote_packet.data
          artifacts:
            wrap_as: payment_reservation_packet
            packet: runx.payment.reservation.v1
        - id: approve-spend
          run:
            type: approval
          inputs:
            gate_id: spend.mock.approval
            reason: Approve the reserved mock spend before the rail runner receives spend authority.
          context:
            payment_decision: reserve.payment_reservation_packet.data.payment_decision
            reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
          artifacts:
            wrap_as: payment_approval
            packet: runx.approval.decision.v1
        - id: fulfill
          skill: graph/pay-fulfill-rail
          runner: mock
          scopes:
            - payment:spend
          mutation: true
          idempotency_key: spend-mock-fulfill
          inputs:
            payment_challenge: $input.payment_signal
            rail_profile_ref: $input.rail_profile_ref
            payment_admission: $input.payment_admission
          context:
            reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
            spend_capability_ref: reserve.payment_reservation_packet.data.spend_capability_ref
            idempotency: reserve.payment_reservation_packet.data.idempotency
            quote_packet: quote.payment_quote_packet.data
      policy:
        guards:
          - step: fulfill
            field: approve-spend.payment_approval.data.approved
            equals: true
