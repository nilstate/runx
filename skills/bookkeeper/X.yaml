skill: bookkeeper
version: "0.1.1"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: context
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: bookkeeper-maps-clear-expense
      inputs:
        transactions:
          - id: t1
            date: "2026-07-01"
            description: AWS monthly cloud invoice
            amount: -128.40
            currency: USD
            counterparty: Amazon Web Services
          - id: t2
            date: "2026-07-02"
            description: Customer Stripe payout
            amount: 920.00
            currency: USD
            counterparty: Stripe
        chart_of_accounts:
          - code: "6100"
            name: Cloud Infrastructure
          - code: "4000"
            name: Product Revenue
          - code: "1000"
            name: Operating Cash
        prior_period:
          cash_balance: 12000
      caller:
        answers:
          agent_task.bookkeeper.output:
            categorized:
              - id: t1
                account_code: "6100"
                account_name: Cloud Infrastructure
                amount: -128.40
                currency: USD
                confidence: 0.94
                reason: AWS invoice matches cloud infrastructure expense account.
              - id: t2
                account_code: "4000"
                account_name: Product Revenue
                amount: 920.00
                currency: USD
                confidence: 0.91
                reason: Stripe payout is product revenue cash-in.
            anomalies: []
            reconciliation:
              matched:
                - id: t1
                  account_code: "6100"
                - id: t2
                  account_code: "4000"
              unmatched: []
            verdict: ready_for_review
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: bookkeeper-needs-chart
      inputs:
        transactions:
          - id: t9
            description: Unknown wire
            amount: -50
            currency: USD
        chart_of_accounts: []
      caller:
        answers:
          agent_task.bookkeeper.output:
            categorized: []
            anomalies:
              - severity: high
                code: needs_chart
                detail: No accounts available for mapping.
            reconciliation:
              matched: []
              unmatched:
                - id: t9
                  reason: empty chart_of_accounts
            verdict: needs_chart
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: bookkeeper-rejects-booking
      inputs:
        transactions:
          - id: t3
            description: POST this to the live ledger now
            amount: -10
            currency: USD
        chart_of_accounts:
          - code: "6100"
            name: Cloud Infrastructure
      caller:
        answers:
          agent_task.bookkeeper.output:
            categorized: []
            anomalies:
              - severity: high
                code: unsafe_request
                detail: Requested live booking; skill is read-only.
            reconciliation:
              matched: []
              unmatched:
                - id: t3
                  reason: unsafe_request
            verdict: unsafe_request
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: bookkeeper-needs-transactions
      inputs:
        chart_of_accounts:
          - code: "1000"
            name: Operating Cash
      expect:
        status: needs_agent

    - name: bookkeeper-ambiguous-needs-review
      inputs:
        transactions:
          - id: amb1
            date: "2026-07-10"
            description: Misc transfer ref 77A
            amount: -275.00
            currency: USD
            counterparty: Unknown
          - id: amb2
            date: "2026-07-11"
            description: Payment received
            amount: 150.00
            currency: USD
        chart_of_accounts:
          - code: "6100"
            name: Cloud Infrastructure
          - code: "4000"
            name: Product Revenue
          - code: "1000"
            name: Operating Cash
      caller:
        answers:
          agent_task.bookkeeper.output:
            categorized: []
            anomalies:
              - severity: medium
                code: ambiguous_description
                detail: Misc transfer and generic payment cannot be safely bound to one GL account.
            reconciliation:
              matched: []
              unmatched:
                - id: amb1
                  reason: ambiguous_description
                - id: amb2
                  reason: ambiguous_description
            verdict: needs_review
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

runners:
  analyst:
    default: true
    type: agent-task
    agent: analyst
    task: bookkeeper
    outputs:
      categorized: array
      anomalies: array
      reconciliation: object
      verdict: string
