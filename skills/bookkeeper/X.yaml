skill: bookkeeper
version: "0.1.0"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: context

harness:
  cases:
    - name: clean-monthly-batch-sealed
      inputs:
        transactions:
          - id: "tx-001"
            date: "2026-07-01"
            amount: -120.00
            currency: "USD"
            payee: "AWS"
            memo: "monthly hosting"
            suggested_account: "6010"
          - id: "tx-002"
            date: "2026-07-02"
            amount: -49.00
            currency: "USD"
            payee: "GitHub"
            memo: "team plan"
            suggested_account: "6020"
          - id: "tx-003"
            date: "2026-07-03"
            amount: -2500.00
            currency: "USD"
            payee: "Stripe"
            memo: "contractor invoice #1042"
          - id: "tx-004"
            date: "2026-07-04"
            amount: 5000.00
            currency: "USD"
            payee: "Customer Co"
            memo: "july retainer"
            suggested_account: "4010"
        chart_of_accounts:
          - code: "1010"
            name: "Checking"
            type: "asset"
            sub: "cash_equivalent"
            keywords: ["deposit", "retainer", "wire"]
          - code: "4010"
            name: "Service Revenue"
            type: "revenue"
            keywords: ["retainer", "invoice paid", "subscription"]
          - code: "6010"
            name: "Hosting"
            type: "expense"
            keywords: ["hosting", "aws", "gcp", "azure", "compute"]
          - code: "6020"
            name: "SaaS Subscriptions"
            type: "expense"
            keywords: ["github", "gitlab", "saas", "subscription", "plan"]
          - code: "6030"
            name: "Contractor Fees"
            type: "expense"
            keywords: ["contractor", "freelance", "1099"]
        prior_period:
          vendor_map:
            "Stripe": "6030"
            "GitHub": "6020"
            "AWS": "6010"
            "Customer Co": "4010"
          vendor_median_amount:
            "Stripe": 2400.00
            "GitHub": 49.00
            "AWS": 120.00
            "Customer Co": 5000.00
          period:
            since: "2026-06-01"
            until: "2026-06-30"
          booked_fingerprints:
            - "github|2026-06-02|49.00"
            - "aws|2026-06-01|120.00"
          opening_balances:
            "1010": 12000.00
        period:
          since: "2026-07-01"
          until: "2026-07-31"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
        contains:
          decision: ["ready", "needs_human"]
          reconciliation.matched: 4
          reconciliation.unmatched: 0
          observations.categorized_count: 4
          observations.anomaly_count: 0

    - name: ambiguous-batch-needs-review
      inputs:
        transactions:
          # Two charts match equally on keyword "plan": 6020 (saas plan) vs 6030 (retirement plan). Tie -> needs_review.
          - id: "tx-101"
            date: "2026-07-05"
            amount: -200.00
            currency: "USD"
            payee: "Vendor Co"
            memo: "team plan upgrade"
          # Single chart matches cleanly (6010 hosting), but unknown payee triggers unknown_payee anomaly.
          - id: "tx-102"
            date: "2026-07-06"
            amount: -150.00
            currency: "USD"
            payee: "BetaWeb LLC"
            memo: "monthly hosting"
        chart_of_accounts:
          - code: "1010"
            name: "Checking"
            type: "asset"
            sub: "cash_equivalent"
            keywords: ["deposit", "retainer"]
          - code: "6010"
            name: "Hosting"
            type: "expense"
            keywords: ["hosting", "compute"]
          - code: "6020"
            name: "SaaS Subscriptions"
            type: "expense"
            keywords: ["plan", "saas"]
          - code: "6030"
            name: "Contractor Fees"
            type: "expense"
            keywords: ["plan", "contractor"]
        period:
          since: "2026-07-05"
          until: "2026-07-06"
      expect:
        status: sealed
        contains:
          decision: "needs_review"
          observations.categorized_count: 1
          observations.unmatched_count: 1
          observations.needs_review_count: 1
          reconciliation.unmatched: 1
          reconciliation.matched: 1

    - name: missing-review-binding-needs-agent
      runner: review-handoff
      inputs: {}
      expect:
        status: needs_agent

runners:
  review-handoff:
    type: agent-task
    agent: operator
    task: bookkeeper-review-handoff
    outputs:
      review_resolution: object
    inputs:
      review_case_ref:
        type: string
        required: true
        description: "Reference to the ambiguous transaction batch requiring operator review."

  evaluate:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    input_mode: stdin
    outputs:
      decision: string
      categorized: array
      anomalies: array
      reconciliation: object
      refusals: array
      observations: object
      receipt_local: object
    artifacts:
      wrap_as: bookkeeping_packet
      packet: runx.bookkeeping.v1
    inputs:
      transactions:
        type: array
        required: true
        description: "Typed transaction lines: id, date, amount, currency, payee, memo?, suggested_account?"
      chart_of_accounts:
        type: array
        required: true
        description: "Chart of accounts with code, name, type, keywords?"
      prior_period:
        type: object
        required: false
        description: "Vendor memory, prior booked fingerprints, opening balances."
      period:
        type: object
        required: false
        description: "{ since, until } ISO dates bounding the current period."
