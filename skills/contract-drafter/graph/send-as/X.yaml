skill: send-as
version: "0.1.4-contract-drafter-mock"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: true
  approval: required

runners:
  mock_provider_plan:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    inputs:
      objective:
        type: string
        required: true
      principal:
        type: string
        required: true
      provider_context:
        type: json
        required: true
      audience:
        type: json
        required: true
      content_ref:
        type: json
        required: true
      consent_basis:
        type: string
        required: true
      operator_context:
        type: string
        required: true
    outputs:
      send_plan: object
    artifacts:
      named_emits:
        send_plan: send_plan
      packets:
        send_plan: runx.send_as.plan.v1
