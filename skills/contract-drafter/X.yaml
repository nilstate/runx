skill: contract-drafter
version: "0.1.2"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: contract-drafter-complete-draft-seals
      operator_journeys:
        - mode: standalone
          confusors: [ghostwrite, send-as]
          request: Draft this services agreement from the approved template with every required term bound.
          expected_outcome: Return a sealed draft where every clause reconciles with the rendered template and delivery stays behind a human gate.
        - mode: composed
          request: Continue from this sealed contract draft into the governed delivery step.
          expected_outcome: Reuse the sealed draft and its send proposal without re-drafting any clause.
          prior_evidence:
            - The template, parties, terms, and sealed draft supplied by the prior step.
          must_not_repeat:
            - Do not re-render or re-negotiate clauses already sealed.
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [services, fee_usd]
          clauses:
            - id: parties
              heading: Parties
              baseline: "This Services Agreement is between {{provider.legal_name}} and {{customer.legal_name}}."
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} for {{terms.services}}."
        parties:
          provider: { legal_name: Acme Pty Ltd }
          customer: { legal_name: Globex LLC }
        terms:
          services: monthly platform maintenance
          fee_usd: 4000
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: channel
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      caller:
        answers:
          agent_task.contract-drafter-assemble.output:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: parties
                  heading: Parties
                  text: This Services Agreement is between Acme Pty Ltd and Globex LLC.
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 4000 for monthly platform maintenance.
              deviations: []
          agent_task.send-as.output:
            send_plan:
              decision: ready
              action_family: send-as
              principal:
                type: account
                ref: account:contract-review-demo
              provider:
                name: reviewer-queue
                account_ref: provider-account:contract-review-demo
                runtime_path: review_queue.plan
              send_class: internal
              channel: other
              audience:
                type: channel
                ref: RYDE-PLAY/frantic-86-contract-drafter
                requires_reconfirmation: false
              content:
                draft_ref: runx:contract-draft:ae5df79bb1bbd566
                digest: sha256:ae5df79bb1bbd5669b28ae4870481a9ca07057dad339bf6679f75814ce022331
                subject_or_title: Review the services agreement draft
              gates:
                preflight_required: true
                human_approval_required: true
                approval_ref: send-as.provider-delivery.required
              blockers: []
              provider_actions:
                - review_queue.plan
              evidence_refs:
                - runx:contract-draft:ae5df79bb1bbd566
                - sha256:ae5df79bb1bbd5669b28ae4870481a9ca07057dad339bf6679f75814ce022331
              success_checkpoint:
                milestone: provider_delivery_required
                description: Provider delivery and readback remain outside contract-drafter.
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize, plan-send-as, finalize-plan]
        step_outputs:
          finalize-plan:
            subset:
              contract_draft:
                data:
                  schema: runx.contract_draft.v1
                  decision: drafted
                  review_status: requires_review
                  delivery_status: not_sent
                  deviations: []
                  send_proposal:
                    consumer:
                      skill: runx/send-as
                      runner: plan
                    live_external_send_performed: false
                  send_plan:
                    decision: ready
                    action_family: send-as
                  delivery_performed: false
                  validation:
                    status: pass
                    findings: []
                    canonical_send_as_dependency_executed: true
        receipt: { schema: runx.receipt.v1 }

    - name: contract-drafter-declared-deviation-seals
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} within 30 days after invoice."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: channel
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      caller:
        answers:
          agent_task.contract-drafter-assemble.output:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 4000 within 45 days after invoice.
              deviations:
                - clause_id: fees
                  reason: Customer requested 45-day payment terms and the operator approved the extension.
          agent_task.send-as.output:
            send_plan:
              decision: ready
              action_family: send-as
              principal:
                type: account
                ref: account:contract-review-demo
              provider:
                name: reviewer-queue
                account_ref: provider-account:contract-review-demo
                runtime_path: review_queue.plan
              send_class: internal
              channel: other
              audience:
                type: channel
                ref: RYDE-PLAY/frantic-86-contract-drafter
                requires_reconfirmation: false
              content:
                draft_ref: runx:contract-draft:bed4bccd0be68276
                digest: sha256:bed4bccd0be68276d4188f87744fc847644753ada3f4b3172e03d997154cb2e0
                subject_or_title: Review the services agreement draft
              gates:
                preflight_required: true
                human_approval_required: true
                approval_ref: send-as.provider-delivery.required
              blockers: []
              provider_actions:
                - review_queue.plan
              evidence_refs:
                - runx:contract-draft:bed4bccd0be68276
                - sha256:bed4bccd0be68276d4188f87744fc847644753ada3f4b3172e03d997154cb2e0
              success_checkpoint:
                milestone: provider_delivery_required
                description: Provider delivery and readback remain outside contract-drafter.
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize, plan-send-as, finalize-plan]
        step_outputs:
          finalize-plan:
            subset:
              contract_draft:
                data:
                  decision: drafted
                  review_status: requires_review
                  delivery_status: not_sent
                  send_plan:
                    decision: ready
                    action_family: send-as
                  validation:
                    status: pass
                    canonical_send_as_dependency_executed: true
        receipt: { schema: runx.receipt.v1 }

    - name: contract-drafter-undeclared-deviation-refuses
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} within 30 days after invoice."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: channel
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      caller:
        answers:
          agent_task.contract-drafter-assemble.output:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 9000 within 90 days after invoice.
              deviations: []
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize, finish-refusal]
        step_outputs:
          finish-refusal:
            subset:
              contract_draft:
                data:
                  decision: refused
                  document: null
                  send_proposal: null
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: contract-drafter-missing-term-stops
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd, services]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} for {{terms.services}}."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: channel
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      expect:
        status: sealed
        steps: [admit, stop]
        step_outputs:
          stop:
            subset:
              contract_draft:
                data:
                  decision: refused
                  document: null
                  send_proposal: null
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  draft:
    default: true
    type: graph
    inputs:
      template:
        type: object
        required: true
        description: Versioned contract template with stable clause baselines and required term keys.
      parties:
        type: object
        required: true
        description: Explicit party records referenced by template placeholders; no party may be inferred.
      terms:
        type: object
        required: true
        description: Explicit deal terms; every template required term must be supplied.
    graph:
      name: contract-drafter-draft
      result_from: [stop, finish-refusal, finalize-plan]
      steps:
        - id: admit
          label: admit only complete template, party, and term evidence
          inputs:
            template: $input.template
            parties: $input.parties
            terms: $input.terms
          run:
            type: javascript
            module: contract-drafter.mjs
            export: admitRequest
            outputs:
              draft_context: object

        - id: stop
          when:
            field: admit.draft_context.path
            equals: stop
          context:
            draft_context: admit.draft_context
          run:
            type: javascript
            module: contract-drafter.mjs
            export: finalizeDraft
            outputs:
              contract_draft: object
          artifacts:
            named_emits:
              contract_draft: contract_draft
            packets:
              contract_draft: runx.contract_draft.v1

        - id: digest-template
          when:
            field: admit.draft_context.path
            equals: draft
          tool: data.digest
          inputs:
            value: $input.template

        - id: digest-parties
          when:
            field: admit.draft_context.path
            equals: draft
          tool: data.digest
          inputs:
            value: $input.parties

        - id: digest-terms
          when:
            field: admit.draft_context.path
            equals: draft
          tool: data.digest
          inputs:
            value: $input.terms

        - id: assemble
          label: draft clauses from the template under declared-deviation rules
          when:
            field: admit.draft_context.path
            equals: draft
          run:
            type: agent-task
            agent: reviewer
            task: contract-drafter-assemble
            outputs:
              draft_doc: object
          inputs:
            template: $input.template
            parties: $input.parties
            terms: $input.terms
          allowed_tools: []
          artifacts:
            named_emits:
              draft_doc: draft_doc

        - id: finalize
          label: reconcile the draft against the rendered template deterministically
          when:
            field: admit.draft_context.path
            equals: draft
          inputs:
            template: $input.template
            parties: $input.parties
            terms: $input.terms
          context:
            draft_context: admit.draft_context
            draft_doc: assemble.draft_doc.data
            template_digest: digest-template.digest_result.data.digest
            parties_digest: digest-parties.digest_result.data.digest
            terms_digest: digest-terms.digest_result.data.digest
          run:
            type: javascript
            module: contract-drafter.mjs
            export: finalizeDraft
            outputs:
              contract_draft: object
          artifacts:
            named_emits:
              contract_draft: contract_draft
            packets:
              contract_draft: runx.contract_draft.v1
        - id: finish-refusal
          label: publish refused evaluations without send-as planning
          when:
            field: finalize.contract_draft.data.decision
            equals: refused
          context:
            contract_draft: finalize.contract_draft.data
          run:
            type: javascript
            module: contract-drafter.mjs
            export: finishRefusal
            outputs:
              contract_draft: object
          artifacts:
            named_emits:
              contract_draft: contract_draft
            packets:
              contract_draft: runx.contract_draft.v1

        - id: plan-send-as
          label: consume the draft proposal with canonical send-as planning
          when:
            field: finalize.contract_draft.data.decision
            equals: drafted
          skill: runx/send-as@sha-1f90b9364a3a
          runner: plan
          context:
            objective: finalize.contract_draft.data.send_proposal.consumer.inputs.objective
            principal: finalize.contract_draft.data.send_proposal.consumer.inputs.principal
            provider_context: finalize.contract_draft.data.send_proposal.consumer.inputs.provider_context
            audience: finalize.contract_draft.data.send_proposal.consumer.inputs.audience
            content_ref: finalize.contract_draft.data.send_proposal.consumer.inputs.content_ref
            consent_basis: finalize.contract_draft.data.send_proposal.consumer.inputs.consent_basis
            operator_context: finalize.contract_draft.data.send_proposal.consumer.inputs.operator_context

        - id: finalize-plan
          label: verify the canonical send-as plan is draft-bound and plan-only
          when:
            field: finalize.contract_draft.data.decision
            equals: drafted
          context:
            contract_draft: finalize.contract_draft.data
            send_plan: plan-send-as.send_plan.data
          run:
            type: javascript
            module: contract-drafter.mjs
            export: finalizeSendPlan
            outputs:
              contract_draft: object
              send_plan: object
          artifacts:
            named_emits:
              contract_draft: contract_draft
              send_plan: send_plan
            packets:
              contract_draft: runx.contract_draft.v1
              send_plan: runx.send_as.plan.v1
