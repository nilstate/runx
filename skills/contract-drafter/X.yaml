skill: contract-drafter
version: "0.1.2"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: complete-template-fetches-source-and-executes-mock-send
      inputs:
        template:
          source_ref: repo:skills/contract-drafter/fixtures/templates/public-services-review-v1.json
        parties:
          provider:
            legal_name: Northstar Example Services LLC
            role: provider
          customer:
            legal_name: Harbor Example Studio Inc.
            role: customer
        terms:
          effective_date: "2026-07-15"
          services: Monthly release engineering review and incident-readiness support
          fees: USD 8,000 per month
          payment_terms: Net 45
          liability_cap: USD 80,000 aggregate
          governing_law: Delaware
          confidentiality_period: 2 years
          send:
            objective: Execute send-as planning and deterministic mock provider delivery for the review draft in the same sealed graph.
            principal: account:contract-review-demo
            provider_context:
              name: mock-review-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: mock.review_queue.deliver
            audience:
              type: repository_review
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter may execute only the deterministic mock review-queue transport; no live external send is authorized.
            subject_or_title: Review the services agreement draft
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: missing-required-term-refuses-without-proposal
      runner: refusal_check
      inputs:
        template:
          source_ref: repo:skills/contract-drafter/fixtures/templates/public-services-review-v1.json
        parties:
          provider:
            legal_name: Northstar Example Services LLC
            role: provider
          customer:
            legal_name: Harbor Example Studio Inc.
            role: customer
        terms:
          effective_date: "2026-07-15"
          services: Monthly release engineering review and incident-readiness support
          fees: USD 8,000 per month
          liability_cap: USD 80,000 aggregate
          governing_law: Delaware
          confidentiality_period: 2 years
          send:
            objective: Execute send-as planning and deterministic mock provider delivery for the review draft in the same sealed graph.
            principal: account:contract-review-demo
            provider_context:
              name: mock-review-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: mock.review_queue.deliver
            audience:
              type: repository_review
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter may execute only the deterministic mock review-queue transport; no live external send is authorized.
            subject_or_title: Review the services agreement draft
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1

runners:
  draft:
    default: true
    type: graph
    act:
      form: review
      purpose: Fetch a contract template from its source ref, assemble a review draft, compose send-as, and execute a deterministic mock provider delivery/readback in the same graph.
      legitimacy: The operator supplied a template source ref, parties, terms, and downstream review context; send-as binds authority and the mock provider records non-live delivery evidence.
      reason_step: bind-send
      reason_from: act_reason
      effect_step: bind-send
      effect_from: draft_ref
      effect_type: artifact
    inputs:
      template:
        type: object
        required: true
        description: "Template source descriptor. Only template.source_ref is trusted; the template document is fetched from that ref at runtime."
      parties:
        type: object
        required: true
        description: "Explicit parties keyed by the roles declared by the fetched template."
      terms:
        type: object
        required: true
        description: "Explicit deal terms plus the send-as and mock provider inputs under terms.send."
    graph:
      name: contract-drafter
      steps:
        - id: assemble
          label: fetch template source and assemble review draft
          run:
            type: cli-tool
            command: node
            args:
              - run.mjs
            outputs:
              act_decision: string
              act_reason: string
              draft_ref: string
              draft_doc: object
              deviations: array
              send_proposal: object
              send_as_result: object
              validation: object
          inputs:
            template: "$input.template"
            parties: "$input.parties"
            terms: "$input.terms"
          artifacts:
            wrap_as: contract_draft_packet
            packet: runx.contract_draft.v1

        - id: plan-send
          label: compose the shipped send-as skill
          when:
            field: assemble.contract_draft_packet.data.status
            equals: draft_ready
          skill: ./graph/send-as
          runner: mock_provider_plan
          inputs:
            objective: "$input.terms.send.objective"
            principal: "$input.terms.send.principal"
            provider_context: "$input.terms.send.provider_context"
            audience: "$input.terms.send.audience"
            consent_basis: "$input.terms.send.consent_basis"
            operator_context: "$input.terms.send.operator_context"
          context:
            content_ref: assemble.contract_draft_packet.data.send_proposal.consumer.inputs.content_ref
            send_proposal: assemble.contract_draft_packet.data.send_proposal

        - id: mock-provider-send
          label: execute deterministic mock provider delivery and readback
          when:
            field: assemble.contract_draft_packet.data.status
            equals: draft_ready
          run:
            type: cli-tool
            command: node
            args:
              - mock-send.mjs
            outputs:
              send_delivery: object
          context:
            draft_packet: assemble.contract_draft_packet.data
            send_plan: plan-send.send_plan.data
          artifacts:
            named_emits:
              send_delivery: send_delivery
            packets:
              send_delivery: runx.contract_send_delivery.v1

        - id: bind-send
          label: bind send-as and mock delivery to the draft packet
          when:
            field: assemble.contract_draft_packet.data.status
            equals: draft_ready
          run:
            type: cli-tool
            command: node
            args:
              - finalize.mjs
            outputs:
              act_decision: string
              act_reason: string
              draft_ref: string
              draft_doc: object
              deviations: array
              send_proposal: object
              send_as_result: object
              validation: object
          context:
            draft_packet: assemble.contract_draft_packet.data
            send_plan: plan-send.send_plan.data
            send_delivery: mock-provider-send.send_delivery.data
          artifacts:
            wrap_as: contract_draft_packet
            packet: runx.contract_draft.v1

  refusal_check:
    type: cli-tool
    command: node
    args:
      - run.mjs
      - --fail-on-refusal
    inputs:
      template:
        type: object
        required: true
        description: "Template source descriptor to validate without permitting a partial draft. Only source_ref is used."
      parties:
        type: object
        required: true
        description: "Explicit parties to validate."
      terms:
        type: object
        required: true
        description: "Explicit terms to validate."
    outputs:
      act_decision: string
      act_reason: string
      draft_ref: string
      draft_doc: object
      deviations: array
      send_proposal: object
      send_as_result: object
      validation: object
    artifacts:
      wrap_as: contract_draft_refusal
      packet: runx.contract_draft.v1
