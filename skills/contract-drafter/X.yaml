skill: contract-drafter
version: "0.1.3"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: complete-template-fetches-source-and-composes-canonical-send-as-plan
      inputs:
        template:
          source_ref: repo:skills/contract-drafter/fixtures/templates/public-services-review-v1.json
        parties:
          provider:
            legal_name: Northstar Example Services LLC
            role: provider
          customer:
            legal_name: Harbor Example Studio Inc.
            role: customer
        terms:
          effective_date: "2026-07-15"
          services: Monthly release engineering review and incident-readiness support
          fees: USD 8,000 per month
          payment_terms: Net 45
          liability_cap: USD 80,000 aggregate
          governing_law: Delaware
          confidentiality_period: 2 years
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: repository_review
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      caller:
        answers:
          agent_task.send-as.output:
            send_plan:
              decision: ready
              action_family: send-as
              principal:
                type: account
                ref: account:contract-review-demo
              provider:
                name: reviewer-queue
                account_ref: provider-account:contract-review-demo
                runtime_path: review_queue.plan
              send_class: contract_review
              channel: other
              audience:
                type: repository_review
                ref: RYDE-PLAY/frantic-86-contract-drafter
                requires_reconfirmation: false
              content:
                draft_ref: runx:contract-draft:95c347f0a4bfe15a
                digest: sha256:db4d22e137ff620f24631dabd9c1b14e099d79259603f041ffa3b654869badb7
                subject_or_title: Review the services agreement draft
              gates:
                preflight_required: true
                human_approval_required: true
                approval_ref: approval:provider-delivery-outside-contract-drafter
              blockers: []
              provider_actions:
                - review_queue.prepare
              evidence_refs:
                - runx:contract-draft:95c347f0a4bfe15a
                - sha256:db4d22e137ff620f24631dabd9c1b14e099d79259603f041ffa3b654869badb7
              success_checkpoint:
                milestone: provider_delivery_required
                description: Contract-drafter has produced a proposal and canonical send-as plan only; provider delivery remains outside this skill.
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: missing-required-term-refuses-without-proposal
      runner: refusal_check
      inputs:
        template:
          source_ref: repo:skills/contract-drafter/fixtures/templates/public-services-review-v1.json
        parties:
          provider:
            legal_name: Northstar Example Services LLC
            role: provider
          customer:
            legal_name: Harbor Example Studio Inc.
            role: customer
        terms:
          effective_date: "2026-07-15"
          services: Monthly release engineering review and incident-readiness support
          fees: USD 8,000 per month
          liability_cap: USD 80,000 aggregate
          governing_law: Delaware
          confidentiality_period: 2 years
          send:
            objective: Plan reviewer delivery for the nonbinding contract review draft; do not send from contract-drafter.
            principal: account:contract-review-demo
            provider_context:
              name: reviewer-queue
              account_ref: provider-account:contract-review-demo
              runtime_path: review_queue.plan
            audience:
              type: repository_review
              ref: RYDE-PLAY/frantic-86-contract-drafter
            consent_basis: Public maintainer review of a nonbinding synthetic contract fixture.
            operator_context: Contract-drafter only drafts and prepares a send-as plan; provider delivery must run outside this skill.
            subject_or_title: Review the services agreement draft
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1

runners:
  draft:
    default: true
    type: graph
    act:
      form: review
      purpose: Fetch a contract template from its source ref, assemble a review draft, expose baseline departures, and compose the canonical send-as planning dependency without sending.
      legitimacy: The operator supplied a template source ref, parties, terms, and downstream review context; send-as binds authority for a later provider adapter while contract-drafter remains no-send.
      reason_step: assemble
      reason_from: act_reason
      effect_step: assemble
      effect_from: draft_ref
      effect_type: artifact
    inputs:
      template:
        type: object
        required: true
        description: "Template source descriptor. Only template.source_ref is trusted; the template document is fetched from that ref at runtime."
      parties:
        type: object
        required: true
        description: "Explicit parties keyed by the roles declared by the fetched template."
      terms:
        type: object
        required: true
        description: "Explicit deal terms plus canonical send-as planning inputs under terms.send."
    graph:
      name: contract-drafter
      steps:
        - id: assemble
          label: fetch template source and assemble review draft
          run:
            type: cli-tool
            command: node
            args:
              - run.mjs
            outputs:
              act_decision: string
              act_reason: string
              draft_ref: string
              draft_doc: object
              deviations: array
              send_proposal: object
              send_as_result: object
              validation: object
          inputs:
            template: "$input.template"
            parties: "$input.parties"
            terms: "$input.terms"
          artifacts:
            wrap_as: contract_draft_packet
            packet: runx.contract_draft.v1

        - id: plan-send
          label: compose the canonical send-as planning skill
          when:
            field: assemble.contract_draft_packet.data.status
            equals: draft_ready
          skill: ../send-as
          runner: plan
          inputs:
            objective: "$input.terms.send.objective"
            principal: "$input.terms.send.principal"
            provider_context: "$input.terms.send.provider_context"
            audience: "$input.terms.send.audience"
            consent_basis: "$input.terms.send.consent_basis"
            operator_context: "$input.terms.send.operator_context"
          context:
            content_ref: assemble.contract_draft_packet.data.send_proposal.consumer.inputs.content_ref
            send_proposal: assemble.contract_draft_packet.data.send_proposal

  refusal_check:
    type: cli-tool
    command: node
    args:
      - run.mjs
      - --fail-on-refusal
    inputs:
      template:
        type: object
        required: true
        description: "Template source descriptor to validate without permitting a partial draft. Only source_ref is used."
      parties:
        type: object
        required: true
        description: "Explicit parties to validate."
      terms:
        type: object
        required: true
        description: "Explicit terms to validate."
    outputs:
      act_decision: string
      act_reason: string
      draft_ref: string
      draft_doc: object
      deviations: array
      send_proposal: object
      send_as_result: object
      validation: object
    artifacts:
      wrap_as: contract_draft_refusal
      packet: runx.contract_draft.v1
