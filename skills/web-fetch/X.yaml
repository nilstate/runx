skill: web-fetch
version: "0.4.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none

runners:
  web-fetch:
    default: true
    type: graph
    inputs:
      url:
        type: string
        required: true
        description: "Single public HTTP(S) URL to fetch."
        schema:
          format: uri
          pattern: '^https?://'
      allowlist:
        type: array
        required: false
        default: ["*"]
        description: "Optional host restriction. Omit for any publicly routable host; use exact hosts or leading wildcards such as *.example.com to narrow the fetch and redirects."
        schema:
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
      extract:
        type: string
        required: false
        default: text
        description: "Extraction mode: text, metadata, or links. Defaults to text."
      max_bytes:
        type: number
        required: false
        default: 1000000
        description: "Positive cap on response bytes read; a clipped read is flagged truncated."
        schema:
          minimum: 1
          maximum: 8388608
    examples:
      - url: https://example.com/
        extract: text
    graph:
      name: web-fetch
      result_from: [fetch]
      steps:
        - id: fetch
          label: fetch one allowlisted web source
          tool: web.fetch
          scopes:
            - net:allowlist
          inputs:
            url: "$input.url"
            allowlist: "$input.allowlist"
            extract: "$input.extract"
            max_bytes: "$input.max_bytes"
