skill: web-fetch
version: "0.3.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none

runners:
  web-fetch:
    default: true
    type: graph
    inputs:
      url:
        type: string
        required: false
        default: ""
        description: "Single HTTP(S) URL to fetch; its host and every redirect host must match the allowlist."
      allowlist:
        type: json
        required: false
        default: []
        description: "Permitted exact hosts or leading-wildcard host patterns such as *.example.com."
      extract:
        type: string
        required: false
        default: text
        description: "Extraction mode: text, metadata, or links. Defaults to text."
      max_bytes:
        type: number
        required: false
        default: 1000000
        description: "Positive cap on response bytes read; a clipped read is flagged truncated."
    graph:
      name: web-fetch
      result_from: [fetch]
      steps:
        - id: fetch
          label: fetch one allowlisted web source
          tool: web.fetch
          scopes:
            - net:allowlist
          inputs:
            url: "$input.url"
            allowlist: "$input.allowlist"
            extract: "$input.extract"
            max_bytes: "$input.max_bytes"
