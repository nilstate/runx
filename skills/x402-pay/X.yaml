skill: x402-pay
version: "0.6.0"
catalog: { kind: graph, audience: operator, visibility: public, role: branded, canonical_skill: runx/spend, provider: x402, runtime_path: hosted, execution: execute, completion: provider_readback, requires_adapter: true, approval: required }
runners:
  pay:
    default: true
    type: graph
    inputs:
      payment_signal: { type: json, required: true, description: Exact x402 payment challenge. }
      parent_payment_authority: { type: json, required: true, description: Full parent spend authority term. }
      idempotency_seed: { type: string, required: true, description: Stable purchase idempotency material. }
    graph:
      name: x402-pay-hosted
      result_from: [readback]
      steps:
        - id: pay
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_seed
          scopes: [payment.x402]
          policy: { provider_permission: { verb: write } }
          inputs:
            operation: payment.x402
            target: $input.payment_signal.counterparty
            expected_provider: x402
            idempotency_key: $input.idempotency_seed
            result_fields: [payment_ref, challenge_id, amount_minor, currency, status]
            input: { payment_signal: $input.payment_signal, parent_payment_authority: $input.parent_payment_authority }
        - id: readback
          tool: provider.read
          scopes: [payment.x402.read]
          policy: { provider_permission: { verb: read } }
          inputs: { operation: payment.x402.read, target: $input.payment_signal.counterparty, expected_provider: x402, result_fields: [payment_ref, challenge_id, amount_minor, currency, status] }
          context: { input: pay.provider_operation.data.result, expected_result: pay.provider_operation.data.result }
