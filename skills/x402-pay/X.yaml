skill: x402-pay
version: "0.8.0"
catalog: { kind: graph, audience: operator, visibility: public, role: branded, canonical_skill: runx/spend, provider: x402, runtime_path: hosted, execution: execute, completion: provider_readback, requires_adapter: true, approval: required }
input_definitions:
  marketplace_offer:
    type: object
    required: false
    description: Admission-owned immutable mediated-listing terms; absent for direct x402 purchases.
    schema:
      additionalProperties: false
      required: [listing_ref, endpoint_url, vendor_amount_minor, platform_fee_minor, currency, settlement_family, expected_receipt_class, vendor_ref]
      properties:
        listing_ref: { type: string, pattern: '^runx:listing:\S+$', maxLength: 512 }
        endpoint_url: { type: string, pattern: '^https://\S+$', maxLength: 2048 }
        vendor_amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        platform_fee_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        settlement_family: { type: string, enum: [x402] }
        expected_receipt_class: { type: string, const: executed }
        vendor_ref:
          type: object
          additionalProperties: false
          required: [type, uri]
          properties:
            type: { type: string, const: principal }
            uri: { type: string, pattern: '^runx:principal:\S+$', maxLength: 512 }
  payment_signal:
    type: object
    required: true
    description: Exact x402 V2 resource request and expected settlement terms.
    schema:
      additionalProperties: false
      required: [resource]
      properties:
        resource:
          type: object
          additionalProperties: false
          required: [url, method, body]
          properties:
            url: { type: string, format: uri, maxLength: 2048 }
            method: { type: string, const: POST }
            body: {}
            headers:
              type: object
              additionalProperties: { type: string, maxLength: 4096 }
            timeout_ms: { type: integer, minimum: 1, maximum: 120000 }
            max_response_bytes: { type: integer, minimum: 1, maximum: 26214400 }
        amount_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        pay_to: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        parent_binding: { type: string, enum: [current_paid_invocation] }
  payment_authority:
    type: object
    required: true
    description: Exact USD maximum and vendor endpoint authorized by the parent.
    schema:
      additionalProperties: false
      required: [term_id, currency, max_amount_minor, counterparty]
      properties:
        term_id: { type: string, minLength: 1, maxLength: 256 }
        currency: { type: string, const: USD }
        max_amount_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        counterparty: { type: string, format: uri, maxLength: 2048 }
runners:
  pay:
    default: true
    type: graph
    inputs:
      payment_signal: { definition: payment_signal }
      parent_payment_authority: { definition: payment_authority }
      marketplace_offer: { definition: marketplace_offer }
      idempotency_seed: { type: string, required: true, description: Stable purchase idempotency material, schema: { minLength: 16, maxLength: 500 } }
    examples:
      - payment_signal:
          resource:
            url: https://vendor.example/v1/invocations
            method: POST
            body: { offer_id: document-ocr, input: { artifact_ref: "runx:artifact:document-1" } }
            max_response_bytes: 26214400
          amount_minor: 25
          pay_to: "0x0000000000000000000000000000000000000002"
          parent_binding: current_paid_invocation
        parent_payment_authority:
          term_id: marketplace-purchase-1
          currency: USD
          max_amount_minor: 25
          counterparty: https://vendor.example/v1/invocations
        idempotency_seed: marketplace-purchase-0001
    graph:
      name: x402-pay-hosted
      result_from: [readback]
      steps:
        - id: pay
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_seed
          scopes: [payment.x402]
          policy: { provider_permission: { verb: write } }
          inputs:
            operation: payment.x402
            target: $input.payment_signal.resource.url
            expected_provider: x402
            idempotency_key: $input.idempotency_seed
            result_fields: [payment_ref, challenge_id, amount_minor, currency, status, transaction, network, payer, pay_to, invocation_id, payment_required_digest, payment_response_digest]
            input: { payment_signal: $input.payment_signal, parent_payment_authority: $input.parent_payment_authority, marketplace_offer: $input.marketplace_offer }
        - id: readback
          tool: provider.read
          scopes: [payment.x402.read]
          policy: { provider_permission: { verb: read } }
          inputs: { operation: payment.x402.read, target: $input.payment_signal.resource.url, expected_provider: x402, result_fields: [payment_ref, challenge_id, amount_minor, currency, status, transaction, network, payer, pay_to, invocation_id, payment_required_digest, payment_response_digest, resource_status, resource_result, finality, block_number, inner_receipt_ref], optional_result_fields: [runx_composite] }
          context: { input: pay.provider_operation.data.result, expected_result: pay.provider_operation.data.result }
