skill: agency-health
version: "0.1.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context

emits:
  - name: health_bundle
    packet: runx.agency.health.v1

runners:
  health:
    default: true
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Registry-pinned logical ref for the agency's data source.
      case_id:
        type: string
        required: true
        description: The agency case aggregate id.
      agency_ref:
        type: string
        required: true
        description: Operator/agency handle for the C7 ledger query.
      store_id:
        type: string
        required: false
        description: Data-store id holding the seeded case fixtures (embedded by default).
      mutate:
        type: boolean
        required: false
        description: Write/mutate framing — when true, the skill refuses (read-only contract).
      period:
        type: json
        required: false
        description: ISO window or turn range to grade.
      norms:
        type: json
        required: false
        description: Override the declared default norms.
      health_baseline:
        type: json
        required: false
        description: Read-only baseline overrides - threshold_days_stuck (stall turn-window), cap_pressure_pct (act/spend cap ceiling), refusal_spike_rate (refusal spike threshold). Mapped through the grading norms.
    graph:
      name: agency-health
      steps:
        - id: grade
          run:
            type: cli-tool
            command: node
            args:
              - -e
              - "eval(Buffer.from('','base64').toString())"
          inputs:
            data_source_ref: "$input.data_source_ref"
            case_id: "$input.case_id"
            agency_ref: "$input.agency_ref"
            store_id: "$input.store_id"
            period: "$input.period"
            norms: "$input.norms"
            health_baseline: "$input.health_baseline"
            mutate: "$input.mutate"
          artifacts:
            named_emits:
              health_bundle: agent_task.agency-health.output.health_bundle
            packets:
              health_bundle: runx.agency.health.v1
  refuse:
    default: false
    type: agent

harness:
  cases:
    - name: concerning-agency-sealed
      runner: health
      env:
        RUNX_DATA_SOURCES: '{"data_sources":{"local://runx-agency/health-dev":{"adapter":"data.local","store_id":"health-dev","resources":{"agency_cases":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
      inputs:
        data_source_ref: local://runx-agency/health-dev
        case_id: case-stalled-002
        agency_ref: health-dev
        store_id: health-dev
        period: { from: "2026-07-01T00:00:00Z", to: "2026-07-08T00:00:00Z" }
        health_baseline: { threshold_days_stuck: 5, cap_pressure_pct: 90, refusal_spike_rate: 0.2 }
      expect:
        status: sealed
    - name: agency-health-healthy
      runner: health
      env:
        RUNX_DATA_SOURCES: '{"data_sources":{"local://runx-agency/health-dev":{"adapter":"data.local","store_id":"health-dev","resources":{"agency_cases":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
      inputs:
        data_source_ref: local://runx-agency/health-dev
        case_id: case-healthy-001
        agency_ref: health-dev
        store_id: health-dev
        period: { from: "2026-07-01T00:00:00Z", to: "2026-07-08T00:00:00Z" }
        health_baseline: { threshold_days_stuck: 5, cap_pressure_pct: 90, refusal_spike_rate: 0.2 }
      expect:
        status: sealed
    - name: no-case-events-stop
      runner: health
      env:
        RUNX_DATA_SOURCES: '{"data_sources":{"local://runx-agency/health-dev":{"adapter":"data.local","store_id":"health-dev","resources":{"agency_cases":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
      inputs:
        data_source_ref: local://runx-agency/health-dev
        case_id: case-does-not-exist-999
        agency_ref: health-dev
        store_id: health-dev
        period: { from: "2026-07-01T00:00:00Z", to: "2026-07-08T00:00:00Z" }
        health_baseline: { threshold_days_stuck: 5, cap_pressure_pct: 90, refusal_spike_rate: 0.2 }
      expect:
        status: sealed
    - name: agency-health-readonly-stop
      runner: refuse
      inputs:
        mutate: true
      expect:
        status: needs_agent
