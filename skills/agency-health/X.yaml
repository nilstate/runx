skill: agency-health
version: "0.1.0"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: canonical

harness:
  cases:
    - name: concerning-agency-sealed
      runner: default
      inputs:
        data_source_ref: fixture://agency
        store_id: agency-health-fixtures
        agency_ref: agency://growth-retention
        period: 7d
        case_id: case-retention-2026-07
        health_baseline:
          threshold_days_stuck: 2
          cap_pressure_pct: 80
          refusal_spike_rate: 0.2
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed

    - name: no-case-events-stop
      runner: default
      inputs:
        data_source_ref: fixture://agency
        store_id: agency-health-fixtures
        agency_ref: agency://empty
        period: 7d
        case_id: case-empty-2026-07
        health_baseline:
          threshold_days_stuck: 2
          cap_pressure_pct: 80
          refusal_spike_rate: 0.2
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Logical data-store source for read_projection over the agency case.
      store_id:
        type: string
        required: false
        description: Optional hosted or fixture store id.
      agency_ref:
        type: string
        required: true
        description: Domain-keyed agency reference.
      period:
        type: string
        required: false
        description: Grading window such as 7d.
      case_id:
        type: string
        required: false
        description: Optional agency case id.
      health_baseline:
        type: json
        required: false
        description: Optional thresholds for threshold_days_stuck, cap_pressure_pct, and refusal_spike_rate.
    outputs:
      decision: string
      health_verdict: object
      intervention_findings: array
      read_plan: object
      evidence_summary: object
