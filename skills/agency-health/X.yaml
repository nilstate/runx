skill: agency-health
version: "0.1.0"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: context
  part_of:
    - runx/agency
    - runx/data-store
    - runx/ledger

emits:
  - name: agency_health_packet
    packet: runx.agency.health.v1

harness:
  cases:
    # Sealed case: a running agency whose case projection folds to stuck turns and
    # cap pressure. Every graded finding folds a metric read from the domain-keyed
    # data-store read_projection (C2) against a named norm taken from the supplied
    # health_baseline, and every intervention names a target lane and cites the
    # case_id plus the turn or ledger id-stub that grounds it. Read-only: the packet
    # carries no ceiling and no effect bound, so nothing downstream can be consumed
    # from it without a separate governed run.
    - name: concerning-agency-sealed
      inputs:
        data_source_ref: registry:runx/data-store@0.1.2
        store_id: agency-ops-store
        agency_ref: agency:acme-support
        period: 30d
        health_baseline:
          threshold_days_stuck: 3
          cap_pressure_pct: 80
          refusal_spike_rate: 0.15
      caller:
        answers:
          agent_task.agency-health.output:
            agency_health_packet:
              schema: runx.agency.health.v1
              decision: ready
              agency_ref: agency:acme-support
              period: 30d
              reads:
                domain_keyed_state_read:
                  ref: registry:runx/data-store@0.1.2
                  operation: read_projection
                  store_id: agency-ops-store
                  key: agency:acme-support
                  folded_in_version_order: true
                  cases_folded:
                    - case_id: case:acme-support:1042
                      turns: [1, 2, 3, 4]
                      latest_version: 4
                    - case_id: case:acme-support:1055
                      turns: [1, 2]
                      latest_version: 2
                    - case_id: case:acme-support:1061
                      turns: [1, 2, 3]
                      latest_version: 3
                cross_run_aggregate_read:
                  ref: registry:runx/ledger@0.2.0
                  runner: read
                  reference_form: id_stub_only
                  reason: >-
                    The ledger's runners project to id-stubs only, so it can never serve as the
                    domain-keyed state read; it is an audit-only cross-run aggregate. The
                    domain-keyed read is the data-store read_projection above.
                  id_stubs:
                    - runx:receipt:sha256:9f21c7a4
                    - runx:receipt:sha256:2ab30de1
                    - runx:receipt:sha256:77c9be05
              health_verdict:
                status: degraded
                findings:
                  - metric: seal_rate
                    value: "0.71"
                    norm: >-
                      Refusal spike norm health_baseline.refusal_spike_rate 0.15: an implied
                      refusal rate at or below 0.15 is healthy, so a seal rate at or above 0.85
                      is the norm.
                    assessment: warning
                    grounding:
                      folded_from: domain_keyed_state_read
                      case_ids:
                        - case:acme-support:1042
                        - case:acme-support:1055
                        - case:acme-support:1061
                      ledger_id_stubs:
                        - runx:receipt:sha256:9f21c7a4
                    detail: >-
                      24 of 34 folded turns sealed; the implied refusal rate 0.29 is above the
                      0.15 refusal_spike_rate norm.
                  - metric: stuck_case_count
                    value: "2"
                    norm: >-
                      health_baseline.threshold_days_stuck 3: a case whose latest folded turn has
                      not advanced for more than 3 days is stuck. The norm is zero stuck cases.
                    assessment: warning
                    grounding:
                      folded_from: domain_keyed_state_read
                      case_ids:
                        - case:acme-support:1042
                        - case:acme-support:1061
                      turns:
                        - case_id: case:acme-support:1042
                          turn: 4
                        - case_id: case:acme-support:1061
                          turn: 3
                    detail: >-
                      case:acme-support:1042 has not advanced past turn 4 in 9 days and
                      case:acme-support:1061 has not advanced past turn 3 in 5 days; both exceed
                      the 3-day threshold.
                  - metric: cap_usage_pct
                    value: "93"
                    norm: >-
                      health_baseline.cap_pressure_pct 80: sustained cap usage above 80 percent of
                      the agency charter's granted cap is cap pressure.
                    assessment: critical
                    grounding:
                      folded_from: domain_keyed_state_read
                      case_ids:
                        - case:acme-support:1055
                      ledger_id_stubs:
                        - runx:receipt:sha256:2ab30de1
                    detail: >-
                      Folded spend against the agency charter cap is at 93 percent, above the
                      80 percent cap_pressure_pct norm. The remedy widens a cap, so it escalates
                      to the human ops lane rather than routing as a routine tighten.
                  - metric: escalation_backlog
                    value: "3"
                    norm: >-
                      An escalation is expected to be picked up within the same period it is
                      raised, so the norm is an empty backlog at period close.
                    assessment: warning
                    grounding:
                      folded_from: domain_keyed_state_read
                      case_ids:
                        - case:acme-support:1042
                        - case:acme-support:1061
                      ledger_id_stubs:
                        - runx:receipt:sha256:77c9be05
                    detail: >-
                      3 escalations raised in the folded projection are still unclaimed at period
                      close; the oldest is 9 days old.
              intervention_findings:
                - finding: >-
                    Two cases are stuck past the 3-day threshold with no advancing turn, and the
                    implied refusal rate 0.29 is nearly double the 0.15 norm.
                  target_lane: improve-skill
                  reason: >-
                    Stuck turns concentrated behind repeated refusals are a skill-behavior defect,
                    which is the improve-skill lane's subject.
                  grounding:
                    case_id: case:acme-support:1042
                    turn: 4
                    ledger_id_stub: runx:receipt:sha256:9f21c7a4
                  ceiling: null
                  effect_bound: null
                  consumed_by: >-
                    Nothing here. A downstream driver or operator must issue a separate
                    improve-skill run to act on this finding.
                - finding: >-
                    Cap usage is at 93 percent of the agency charter cap, above the 80 percent
                    norm, and the plausible remedy widens the cap.
                  target_lane: human_ops
                  reason: >-
                    A cap-widening remedy widens authority and this finding is graded critical, so
                    it escalates to the human ops lane instead of routing as a routine tighten.
                  grounding:
                    case_id: case:acme-support:1055
                    turn: 2
                    ledger_id_stub: runx:receipt:sha256:2ab30de1
                  ceiling: null
                  effect_bound: null
                  consumed_by: >-
                    Nothing here. The human ops lane decides; this skill only reports.
                - finding: >-
                    3 escalations are unclaimed at period close, the oldest 9 days old, so the
                    routing policy is not draining the backlog.
                  target_lane: policy-author
                  reason: >-
                    An escalation backlog is a routing-policy defect, which is the policy-author
                    lane's subject. No cap or authority is widened by re-routing, so it does not
                    escalate to human ops.
                  grounding:
                    case_id: case:acme-support:1061
                    turn: 3
                    ledger_id_stub: runx:receipt:sha256:77c9be05
                  ceiling: null
                  effect_bound: null
                  consumed_by: >-
                    Nothing here. A separate policy-author run must be issued to change routing.
              refusals: []
              observations:
                decision: ready
                health_verdict_status: degraded
                graded_findings:
                  - seal_rate
                  - stuck_case_count
                  - cap_usage_pct
                  - escalation_backlog
                intervention_target_lanes:
                  - improve-skill
                  - human_ops
                  - policy-author
                domain_keyed_state_read: registry:runx/data-store@0.1.2 read_projection
                cross_run_aggregate_read: registry:runx/ledger@0.2.0 read (id-stubs only)
                read_only: true
                emitted_ceilings: 0
                emitted_effect_bounds: 0
                refused_or_stop_reason: null
                harness_cases:
                  - concerning-agency-sealed
                  - no-case-events-stop
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

    # Stop case that STILL SEALS: the agency_ref resolves, but the domain-keyed
    # read_projection returns no readable case events over the period. The skill
    # refuses to grade a signal it cannot ground in the folded projection, so it
    # grades NO findings and emits NO intervention. The deterministic conflict is
    # reported as decision needs_more_evidence and the receipt seals on that
    # refusal -- the run is complete and honest, not blocked.
    - name: no-case-events-stop
      inputs:
        data_source_ref: registry:runx/data-store@0.1.2
        store_id: agency-ops-store
        agency_ref: agency:empty-desk
        period: 30d
      caller:
        answers:
          agent_task.agency-health.output:
            agency_health_packet:
              schema: runx.agency.health.v1
              decision: needs_more_evidence
              agency_ref: agency:empty-desk
              period: 30d
              reads:
                domain_keyed_state_read:
                  ref: registry:runx/data-store@0.1.2
                  operation: read_projection
                  store_id: agency-ops-store
                  key: agency:empty-desk
                  folded_in_version_order: true
                  cases_folded: []
                cross_run_aggregate_read:
                  ref: registry:runx/ledger@0.2.0
                  runner: read
                  reference_form: id_stub_only
                  reason: >-
                    The ledger projects to id-stubs only and can never be the domain-keyed state
                    read. With no case events in the domain-keyed projection there is nothing for
                    an audit-only aggregate to corroborate, so no ledger id-stub is cited.
                  id_stubs: []
              health_verdict:
                status: unknown
                findings: []
              intervention_findings: []
              refusals:
                - refused: grade_health_findings
                  reason: >-
                    The domain-keyed read_projection for agency:empty-desk returned no readable
                    case events over the 30d period. Grading seal_rate, stuck_case_count,
                    cap_usage_pct, or escalation_backlog would mean inventing a turn state the
                    sealed event order does not show, so no finding is graded and no intervention
                    is emitted.
                - refused: emit_intervention_findings
                  reason: >-
                    An intervention must cite the case_id and the turn or ledger id-stub that
                    grounds it. With an empty folded projection there is no grounding to cite.
              needs_input:
                - >-
                  A store_id and agency_ref whose read_projection returns case events for the
                  period, or a wider period that covers the agency's actual activity.
              observations:
                decision: needs_more_evidence
                health_verdict_status: unknown
                graded_findings: []
                intervention_target_lanes: []
                domain_keyed_state_read: registry:runx/data-store@0.1.2 read_projection
                cross_run_aggregate_read: registry:runx/ledger@0.2.0 read (id-stubs only)
                read_only: true
                emitted_ceilings: 0
                emitted_effect_bounds: 0
                refused_or_stop_reason: >-
                  No readable case events in the domain-keyed projection for the period; refused
                  to grade any finding or emit any intervention rather than invent a turn state.
                harness_cases:
                  - concerning-agency-sealed
                  - no-case-events-stop
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

    # Escalation case (REQUIRED BY THE REGISTRY PUBLISH GATE). The registry refuses to
    # publish a skill whose harness declares no stop/error case:
    #   remote registry publish failed [skill_harness_incomplete]: Publish harness must
    #   include a stop/error case such as needs_agent, policy_denied, failure, or escalated.
    # The two cases above both seal by contract, so this third case is what makes the package
    # publishable at all. It is not filler: it exercises the one seam the contract defines and
    # the sealed cases cannot reach -- the human ops escalation. This agency sits at 97 percent
    # of its charter cap, so the only remedy WIDENS a cap. A cap-widening remedy may never route
    # as a routine tighten, so the run does not self-seal a verdict: caller.answers is
    # intentionally omitted and the assessment blocks to needs_agent, handing the decision to the
    # human ops lane. No finding is graded into a routine route and no intervention is emitted,
    # so there is nothing for a downstream policy-author or improve-skill run to consume.
    - name: cap-widening-escalates-human-ops
      inputs:
        data_source_ref: registry:runx/data-store@0.1.2
        store_id: agency-ops-store
        agency_ref: agency:cap-pressed
        period: 30d
        health_baseline:
          threshold_days_stuck: 3
          cap_pressure_pct: 80
          refusal_spike_rate: 0.15
      expect:
        status: needs_agent

runners:
  assess:
    default: true
    type: agent-task
    agent: researcher
    task: agency-health
    outputs:
      agency_health_packet: object
    artifacts:
      wrap_as: agency_health_packet
      packet: runx.agency.health.v1
    inputs:
      data_source_ref:
        type: string
        required: true
        description: >-
          Registry-pinned ref of the data-store that holds the agency's case events, e.g.
          registry:runx/data-store@0.1.2. Its read_projection operation is the ONLY
          domain-keyed state read this skill may fold.
      store_id:
        type: string
        required: true
        description: The store the agency's case projection lives in.
      agency_ref:
        type: string
        required: true
        description: >-
          The agency whose health is assessed. This is the projection key for the
          domain-keyed read_projection.
      period:
        type: string
        required: false
        description: The assessment window, e.g. 30d. Absent, the full readable history folds.
      case_id:
        type: string
        required: false
        description: >-
          Narrow the fold to a single case. Absent, every case under agency_ref folds.
      health_baseline:
        type: json
        required: false
        description: >-
          health_baseline{threshold_days_stuck,cap_pressure_pct,refusal_spike_rate}. The ONLY
          source of norms besides the agency charter snapshot carried in the projection. A
          threshold that is in neither may not be invented.
    instructions: >
      Assess one agency's operational health, read-only, and report it. Grade only what the
      folded case projection or an audit-only ledger aggregate actually shows.

      Perform exactly two reads and keep them distinct. The DOMAIN-KEYED STATE READ is the
      data-store read_projection operation at data_source_ref, keyed on agency_ref (narrowed
      by case_id when supplied), folded in VERSION ORDER. This is the only read that yields
      case and turn state. The CROSS-RUN AGGREGATE READ is the ledger read runner at
      registry:runx/ledger@0.2.0, referenced by receipt ID-STUB ONLY: the ledger's runners
      project to id-stubs only, so it is structurally incapable of a domain-keyed state read
      and is audit-only. Never substitute the ledger aggregate for the domain-keyed read.

      Grade all four findings when the projection is readable: seal_rate, stuck_case_count,
      cap_usage_pct, and escalation_backlog. Each finding ties a folded metric to a NAMED
      norm -- from health_baseline or from the agency charter snapshot in the projection --
      and carries an assessment, never a bare number. Set health_verdict.status from the
      graded set.

      Emit an intervention_finding for each condition that warrants action. Each one names a
      TARGET LANE and cites the grounding case_id plus the turn or ledger id-stub it folds
      from. Route a skill-behavior defect to improve-skill and a routing-policy defect to
      policy-author. Any CAP-WIDENING or AUTHORITY-WIDENING remedy, and any finding graded
      critical, escalates to the human ops lane instead of routing as a routine tighten.

      This skill is read-only. It appends nothing, sends nothing, executes nothing, and
      consumes no effect. It moves no money and grants no access, so every
      intervention_finding carries NO ceiling and NO effect bound and is consumed only when a
      downstream driver or operator issues a separate policy-author or improve-skill run.
      Issue no rail run and claim no rail consumes this output.

      Refuse rather than guess. Refuse to grade a signal that is not grounded in the folded
      case projection or a ledger id-stub aggregate. Refuse to invent a cap or threshold that
      is in neither the agency charter snapshot nor health_baseline. Never invent a turn state
      the sealed event order does not show. When the projection returns no readable case
      events, set decision needs_more_evidence, grade NO findings, emit NO intervention, and
      say exactly what is missing: reporting the deterministic conflict IS the complete run.
    # No execution tools: the assessment reads the two typed, registry-pinned reads and the
    # supplied baseline. It has no append, send, or effect authority, so it cannot mutate the
    # agency it is grading.
    allowed_tools: []
    scopes:
      - agency:health:read
      - data-store:projection:read
      - ledger:aggregate:read
