skill: agency-health
version: "0.1.1"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context

harness:
  cases:
    - name: live-agency-case-health
      env:
        RUNX_DATA_SOURCES: '{"data_sources":{"tenant://agency/health-dogfood":{"adapter":"data.sqlite","database_path":".runx/data/agency-health-dogfood.sqlite","resources":{"agency_cases":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
      inputs:
        data_source_ref: tenant://agency/health-dogfood
        agency_ref: agency-health-dogfood
        case_id: case-health-live-001
        period:
          since: "2026-07-01T00:00:00Z"
          until: "2026-07-31T23:59:59Z"
        health_baseline:
          cap_pressure_pct: 80
          refusal_spike_rate: 0.10
        ledger_filter:
          skill_ref: agency
          status:
            - sealed
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

runners:
  evaluate:
    default: true
    type: graph
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Registry-pinned hosted data-source reference for the live agency case.
      store_id:
        type: string
        required: false
        description: Optional store binding resolved by the data-source registry.
      agency_ref:
        type: string
        required: true
        description: Agency whose case health is being evaluated.
      case_id:
        type: string
        required: true
        description: Live agency case aggregate id.
      period:
        type: json
        required: false
        description: ISO since/until bounds applied while folding the case stream.
      health_baseline:
        type: json
        required: false
        description: Declared cap pressure and refusal spike thresholds.
      ledger_filter:
        type: json
        required: false
        description: Ledger read filter; the health packet receives receipt id-stubs only.
    graph:
      name: agency-health-live-composition
      steps:
        - id: case_projection
          skill: registry:runx/data-store@sha-58e31b665e57
          runner: read_projection
          inputs:
            data_source_ref: "$input.data_source_ref"
            store_id: "$input.store_id"
            resource: agency_cases
            aggregate_id: "$input.case_id"
        - id: ledger_read
          skill: registry:runx/ledger@sha-b8559fc898e7
          runner: read
          inputs:
            question: "Which governed agency receipts ground health signals for this live case period?"
            filter: "$input.ledger_filter"
        - id: evaluate
          skill: ./
          runner: fold
          inputs:
            period: "$input.period"
            health_baseline: "$input.health_baseline"
          context:
            projection_packet: case_projection.data_operation_result.data
            ledger_packet: ledger_read.ledger_answer_packet.data

  fold:
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      decision: string
      health_verdict: object
      intervention_findings: array
      refusals: array
      receipt_local: object
    artifacts:
      wrap_as: agency_health_packet
      packet: runx.agency.health.v1
    inputs:
      projection_packet:
        type: json
        required: true
      ledger_packet:
        type: json
        required: true
      period:
        type: json
        required: false
      health_baseline:
        type: json
        required: false
