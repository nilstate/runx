skill: issue-to-pr
version: "0.4.1"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: none

harness:
  files:
    - fixtures/bin/gh
    - fixtures/bin/git
    - fixtures/bin/scafld
  cases: []

input_definitions:
  repository:
    type: string
    required: true
    description: Explicit owner/name or '.' to resolve the current checkout remote before transport selection.
    schema:
      pattern: '^(?:\.|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$'
  issue_number:
    type: string
    required: true
    description: Positive GitHub issue number.
    schema: { pattern: '^[1-9][0-9]*$' }
  objective:
    type: string
    required: false
    description: Bounded desired outcome; the issue remains the source evidence.
  issue_evidence:
    type: json
    packet: runx.issue_to_pr.issue_evidence.v1
    required: true
    description: Prior typed issue evidence; supplying it skips provider discovery and read.
  host_result:
    type: json
    packet: runx.issue_to_pr.host_result.v1
    required: true
    description: Tested host change, exact commit, and the workspace-scoped signed receipt produced by one scafld finalize call.

runners:
  issue-to-pr:
    default: true
    type: graph
    inputs:
      repository: { definition: repository }
      issue_number: { definition: issue_number }
      objective: { definition: objective }
    graph:
      name: issue-to-pr
      result_from: [host]
      steps:
        - id: read-issue
          tool: provider.read
          scopes: [repo.read]
          policy:
            provider_permission:
              verb: read
          inputs:
            expected_provider: github
            operation: issue.read
            target: $input.repository
            result_fields: [repository, number, title, state, body, url, labels, assignees]
            input:
              issue_number: $input.issue_number

        - id: bind-issue-evidence
          inputs:
            requested_repository: $input.repository
            requested_issue_number: $input.issue_number
          context:
            provider_operation: read-issue.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: normalizeIssueEvidence
            outputs:
              issue_evidence: object
          artifacts:
            named_emits: { issue_evidence: issue_evidence }
            packets: { issue_evidence: runx.issue_to_pr.issue_evidence.v1 }

        - id: host
          skill: .
          runner: host
          inputs:
            objective: $input.objective
          context:
            issue_evidence: bind-issue-evidence.issue_evidence.data

  from-evidence:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      objective: { definition: objective }
    graph:
      name: issue-to-pr-from-evidence
      result_from: [host]
      steps:
        - id: host
          skill: .
          runner: host
          inputs:
            objective: $input.objective
            issue_evidence: $input.issue_evidence

  host:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      objective: { definition: objective }
    graph:
      name: issue-to-pr-host
      result_from: [finalize-published, finalize-local, finalize-blocked]
      steps:
        - id: host-work
          inputs:
            objective: $input.objective
            issue_evidence: $input.issue_evidence
          run:
            type: agent-task
            agent: builder
            task: issue-to-pr-host-work
            outputs:
              host_result: object
          artifacts:
            named_emits: { host_result: host_result }
            packets: { host_result: runx.issue_to_pr.host_result.v1 }

        - id: admit-host-result
          inputs:
            issue_evidence: $input.issue_evidence
          context:
            host_result: host-work.host_result.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: admitHostResult
            outputs:
              host_admission: object

        - id: verify-publication
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          tool: external_receipt.verify
          scopes: [receipt.read]
          context:
            receipt_path: host-work.host_result.data.finalization.receipt_path
            target: host-work.host_result.data.commit
            contract_digest: host-work.host_result.data.finalization.contract_digest
            repo_root: host-work.host_result.data.repo_root

        - id: publish-pr
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          tool: provider.mutate
          idempotency_key: host-work.host_result.data.publication.idempotency_key
          scopes: [repo.write, pr.write]
          policy:
            provider_permission:
              verb: write
          inputs:
            expected_provider: github
            operation: pullrequest.publish
            target: $input.repository
            idempotency_key: $input.canonical_idempotency_key
            result_fields: [repository, number, title, state, body, url, head, base, draft, published_commit, branch_ref]
            input:
              commit: $input.commit
              title: $input.title
              body: $input.body
              head: $input.head
              base: $input.base
              draft: $input.draft
            expected_result:
              repository: $input.repository
              published_commit: $input.commit
              title: $input.title
              body: $input.body
              head: $input.head
              base: $input.base
              draft: $input.draft
          context:
            repository: host-work.host_result.data.repository
            canonical_idempotency_key: host-work.host_result.data.publication.idempotency_key
            commit: host-work.host_result.data.commit
            title: host-work.host_result.data.publication.title
            body: host-work.host_result.data.publication.body
            head: host-work.host_result.data.publication.head
            base: host-work.host_result.data.publication.base
            draft: host-work.host_result.data.publication.draft

        - id: finalize-published
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          context:
            host_result: host-work.host_result.data
            receipt_verification: verify-publication.external_receipt_verification.data
            publication_result: publish-pr.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: verify-local
          when:
            field: admit-host-result.host_admission.path
            equals: finalized_local
          tool: external_receipt.verify
          scopes: [receipt.read]
          context:
            receipt_path: host-work.host_result.data.finalization.receipt_path
            target: host-work.host_result.data.commit
            contract_digest: host-work.host_result.data.finalization.contract_digest
            repo_root: host-work.host_result.data.repo_root

        - id: finalize-local
          when:
            field: admit-host-result.host_admission.path
            equals: finalized_local
          inputs:
            host_admission:
              path: finalized_local
              errors: []
          context:
            host_result: host-work.host_result.data
            receipt_verification: verify-local.external_receipt_verification.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: finalize-blocked
          when:
            field: admit-host-result.host_admission.path
            equals: blocked
          context:
            host_result: host-work.host_result.data
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

  resume:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-resume
      result_from: [finalize-published, finalize-local, finalize-blocked]
      steps:
        - id: admit-host-result
          inputs:
            host_result: $input.host_result
            issue_evidence: $input.issue_evidence
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: admitHostResult
            outputs:
              host_admission: object

        - id: verify-publication
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          tool: external_receipt.verify
          scopes: [receipt.read]
          inputs:
            receipt_path: $input.host_result.finalization.receipt_path
            target: $input.host_result.commit
            contract_digest: $input.host_result.finalization.contract_digest
            repo_root: $input.host_result.repo_root

        - id: publish-pr
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          tool: provider.mutate
          idempotency_key: $input.host_result.publication.idempotency_key
          scopes: [repo.write, pr.write]
          policy:
            provider_permission:
              verb: write
          inputs:
            expected_provider: github
            operation: pullrequest.publish
            target: $input.host_result.repository
            idempotency_key: $input.host_result.publication.idempotency_key
            result_fields: [repository, number, title, state, body, url, head, base, draft, published_commit, branch_ref]
            input:
              commit: $input.host_result.commit
              title: $input.host_result.publication.title
              body: $input.host_result.publication.body
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base
              draft: $input.host_result.publication.draft
            expected_result:
              repository: $input.host_result.repository
              published_commit: $input.host_result.commit
              title: $input.host_result.publication.title
              body: $input.host_result.publication.body
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base
              draft: $input.host_result.publication.draft

        - id: finalize-published
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          inputs:
            host_result: $input.host_result
          context:
            receipt_verification: verify-publication.external_receipt_verification.data
            publication_result: publish-pr.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: verify-local
          when:
            field: admit-host-result.host_admission.path
            equals: finalized_local
          tool: external_receipt.verify
          scopes: [receipt.read]
          inputs:
            receipt_path: $input.host_result.finalization.receipt_path
            target: $input.host_result.commit
            contract_digest: $input.host_result.finalization.contract_digest
            repo_root: $input.host_result.repo_root

        - id: finalize-local
          when:
            field: admit-host-result.host_admission.path
            equals: finalized_local
          inputs:
            host_result: $input.host_result
            host_admission:
              path: finalized_local
              errors: []
          context:
            receipt_verification: verify-local.external_receipt_verification.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: finalize-blocked
          when:
            field: admit-host-result.host_admission.path
            equals: blocked
          inputs:
            host_result: $input.host_result
          context:
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

  verify:
    type: graph
    inputs:
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-verify
      result_from: [verify-finalization]
      steps:
        - id: verify-finalization
          tool: external_receipt.verify
          scopes: [receipt.read]
          inputs:
            receipt_path: $input.host_result.finalization.receipt_path
            target: $input.host_result.commit
            contract_digest: $input.host_result.finalization.contract_digest
            repo_root: $input.host_result.repo_root

  finalize-local:
    type: graph
    inputs:
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-finalize-local
      result_from: [finalize]
      steps:
        - id: verify
          skill: .
          runner: verify
          inputs:
            host_result: $input.host_result

        - id: finalize
          inputs:
            host_result: $input.host_result
            host_admission:
              path: finalized_local
              errors: []
          context:
            receipt_verification: verify.external_receipt_verification.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

  publish:
    type: graph
    inputs:
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-publish
      result_from: [finalize]
      steps:
        - id: verify
          skill: .
          runner: verify
          inputs:
            host_result: $input.host_result

        - id: publish-pr
          tool: provider.mutate
          idempotency_key: $input.host_result.publication.idempotency_key
          scopes: [repo.write, pr.write]
          policy:
            provider_permission:
              verb: write
          inputs:
            expected_provider: github
            operation: pullrequest.publish
            target: $input.host_result.repository
            idempotency_key: $input.host_result.publication.idempotency_key
            result_fields: [repository, number, title, state, body, url, head, base, draft, published_commit, branch_ref]
            input:
              commit: $input.host_result.commit
              title: $input.host_result.publication.title
              body: $input.host_result.publication.body
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base
              draft: $input.host_result.publication.draft
            expected_result:
              repository: $input.host_result.repository
              published_commit: $input.host_result.commit
              title: $input.host_result.publication.title
              body: $input.host_result.publication.body
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base
              draft: $input.host_result.publication.draft

        - id: finalize
          inputs:
            host_result: $input.host_result
          context:
            receipt_verification: verify.external_receipt_verification.data
            publication_result: publish-pr.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }
