runners:
  issue-to-pr:
    default: true
    type: graph
    inputs:
      task_id:
        type: string
        required: false
        default: "issue-to-pr-fixture"
        description: "scafld task id for the governed issue-to-PR lane."
      thread_title:
        type: string
        required: false
        default: "Fixture thread-driven change"
        description: "Canonical thread title passed to the lane."
      thread_body:
        type: string
        required: false
        description: "Subject body or request text describing the change request."
      thread_locator:
        type: string
        required: false
        description: "Canonical locator for the bounded thread."
      thread:
        type: json
        required: false
        description: "Portable thread for the current thread."
      outbox_entry:
        type: json
        packet: runx.outbox.entry.v1
        required: false
        description: "Current outbox entry when the lane is refreshing an adapter-owned target."
      harness:
        type: json
        packet: runx.receipt.v1
        required: false
        description: "Optional runx.receipt.v1 packet for the governed run boundary."
      signal:
        type: json
        packet: runx.signal.v1
        required: false
        description: "Optional runx.signal.v1 packet with source references, authenticity, fingerprint, and evidence references."
      decision:
        type: json
        packet: runx.decision.v1
        required: false
        description: "Optional runx.decision.v1 packet with the accountable lane selection rationale."
      target_repo:
        type: string
        required: false
        description: "Intended repository slug for repo-local dispatchers."
      operational_policy:
        type: json
        packet: runx.operational_policy.v1
        required: false
        description: "Optional runx.operational_policy.v1 packet for source, target, runner, and source-thread admission."
      source_id:
        type: string
        required: false
        description: "Operational policy source id for request-time admission."
      runner_id:
        type: string
        required: false
        description: "Operational policy runner id for request-time admission."
      branch:
        type: string
        required: false
        description: "Explicit head branch for live provider publication; callers must ensure the workspace is on this branch before mutation."
      repo_snapshot:
        type: json
        required: false
        description: "Compact structured snapshot of the target repo gathered from a real workspace."
      repo_snapshot_path:
        type: string
        required: false
        description: "Optional path to a fuller repo snapshot artifact that can be read when the inline snapshot is insufficient."
      repo_context:
        type: string
        required: false
        description: "Operator-authored textual repo context, such as architecture notes or likely validation hooks."
      size:
        type: string
        required: false
        default: "small"
        description: "Size passed to scafld plan."
      risk:
        type: string
        required: false
        default: "low"
        description: "Risk passed to scafld plan."
      base:
        type: string
        required: false
        default: "main"
        description: "Base ref used by the PR packaging boundary."
      fixture:
        type: string
        required: false
        description: "Workspace root containing the target .scafld directory."
      workspace_path:
        type: string
        required: false
        description: "Workspace root forwarded to provider-push tools that need local git state for branch and PR publication."
      scafld_bin:
        type: string
        required: false
        description: "Explicit scafld executable path."
      provider:
        type: string
        required: false
        description: "Optional scafld review provider, such as command, claude, or codex."
      provider_command:
        type: string
        required: false
        description: "Optional scafld review provider command override."
      provider_binary:
        type: string
        required: false
        description: "Optional scafld review provider binary override."
      model:
        type: string
        required: false
        description: "Optional model forwarded to scafld review."
    examples:
      - task_id: issue-to-pr-example
        thread_title: Fix the bounded runtime regression
        thread_body: Reproduce the regression, preserve the public contract, and add focused coverage.
        thread_locator: github://runxhq/runx/issues/42
        target_repo: runxhq/runx
        size: small
        risk: low
        base: main
    graph:
      name: issue-to-pr
      result_from: [push-feed-entry]
      notes:
        status: governed
        rationale: >
          This graph keeps cognition and mutation separate while treating
          scafld 2.4 as the workflow kernel. Agent phases complete the
          CLI-created markdown draft and author the bounded fix bundle.
          Deterministic fs.write phases perform mutations. Native scafld plan,
          validate, approve, build, review,
          complete, status, and handoff surfaces stay visible instead of being
          re-created by translation projection steps. The public story is the
          source-thread lifecycle: signal, decision, spec, build, review,
          draft PR, human merge gate, and final provider outcome when observed.
      steps:
        - id: scafld-plan
          label: open task lane
          skill: graph/scafld
          scopes:
            - scafld:spec:write
          mutation: true
          inputs:
            command: plan
        - id: read-planned-spec
          label: read scafld-owned draft
          tool: fs.read
          scopes:
            - fs.read
          context:
            path: scafld-plan.result.data.path
        - id: author-spec
          label: complete scafld spec
          run:
            type: agent-task
            agent: builder
            task: issue-to-pr-author-spec
            outputs:
              spec_contents: string
              context_files: array
          allowed_tools:
            - fs.read
            - git.status
          context:
            spec_path: scafld-plan.result.data.path
            scafld_plan: scafld-plan.result.data
            planned_spec_contents: read-planned-spec.file_read.data.contents
        - id: write-spec
          label: write markdown spec
          tool: fs.write
          scopes:
            - fs.write
          mutation: true
          context:
            path: scafld-plan.result.data.path
            contents: author-spec.spec_contents
        - id: read-draft-spec
          label: read draft spec
          tool: fs.read
          scopes:
            - fs.read
          context:
            path: scafld-plan.result.data.path
        - id: scafld-validate
          label: validate spec
          skill: graph/scafld
          scopes:
            - scafld:spec:validate
          inputs:
            command: validate
        - id: scafld-approve
          label: approve spec
          skill: graph/scafld
          scopes:
            - scafld:spec:approve
          mutation: true
          inputs:
            command: approve
        - id: read-approved-spec
          label: read approved spec
          tool: fs.read
          scopes:
            - fs.read
          context:
            path: scafld-approve.result.data.path
        - id: read-declared-files
          label: read bounded authoring context
          tool: fs.read_bundle
          scopes:
            - fs.read
          inputs:
            on_missing: report
          context:
            paths: author-spec.context_files
        - id: author-fix
          label: author bounded fix
          run:
            type: agent-task
            agent: builder
            task: issue-to-pr-apply-fix
            outputs:
              fix_bundle: object
          allowed_tools:
            - fs.read
            - git.status
          context:
            spec_path: scafld-approve.result.data.path
            spec_file: read-approved-spec.file_read.data
            spec_contents: read-approved-spec.file_read.data.contents
            declared_file_context: read-declared-files.file_read_bundle.data
          artifacts:
            named_emits:
              fix_bundle: fix_bundle
            packets:
              fix_bundle: runx.issue.fix_bundle.v1
        - id: write-fix
          label: write fix
          tool: fs.apply_bundle
          scopes:
            - fs.write
          mutation: true
          context:
            writes: author-fix.fix_bundle.data.files
        - id: scafld-build
          label: build to review
          skill: graph/scafld
          scopes:
            - scafld:build
          mutation: true
          inputs:
            command: build_to_review
        - id: scafld-status
          label: inspect review state
          skill: graph/scafld
          scopes:
            - scafld:status:read
          inputs:
            command: status
        - id: read-current-branch
          label: read current branch
          tool: git.current_branch
          scopes:
            - git.read
        - id: scafld-review
          label: run scafld review
          skill: graph/scafld
          scopes:
            - scafld:review:write
          mutation: true
          inputs:
            command: review
        - id: scafld-complete
          label: complete task
          skill: graph/scafld
          scopes:
            - scafld:archive:write
          mutation: true
          inputs:
            command: complete
        - id: scafld-final-status
          label: inspect completed state
          skill: graph/scafld
          scopes:
            - scafld:status:read
          inputs:
            command: status
        - id: scafld-handoff
          label: render handoff
          skill: graph/scafld
          scopes:
            - scafld:handoff:read
          inputs:
            command: handoff
        - id: capture-harness-context
          label: capture harness context
          tool: control.capture_harness_context
          scopes:
            - runx:control:read
          inputs:
            harness: $input.harness
            signal: $input.signal
            decision: $input.decision
        - id: package-pull-request
          label: package reviewer PR story
          tool: outbox.build_pull_request
          scopes:
            - runx:repo:package
          context:
            harness_context: capture-harness-context.harness_context.data
            handoff_markdown: scafld-handoff.result.data.markdown
            build_result: scafld-build.result.data
            review_result: scafld-review.result.data
            completion_result: scafld-complete.result.data
            status_snapshot: scafld-final-status.result.data
            current_branch: read-current-branch.git_branch.data
            fix_bundle: author-fix.fix_bundle.data
          inputs:
            thread_body: $input.thread_body
            repo_context: $input.repo_context
            repo_snapshot: $input.repo_snapshot
            operational_policy: $input.operational_policy
            source_id: $input.source_id
            target_repo: $input.target_repo
            runner_id: $input.runner_id
            source_thread_locator: $input.thread_locator
            policy_action: issue-to-pr
        - id: push-pull-request
          label: push the PR outbox entry through thread
          skill: ./push-outbox
          scopes:
            - thread:push
          context:
            outbox_entry: package-pull-request.outbox_entry.data
            draft_pull_request: package-pull-request.draft_pull_request.data
          inputs:
            thread: $input.thread
            fixture: $input.fixture
            workspace_path: $input.workspace_path
            next_status: draft
        - id: package-feed-entry
          label: package feed entry
          tool: outbox.build_feed_entry
          scopes:
            - runx:repo:package
          context:
            thread: push-pull-request.thread
            harness_context: capture-harness-context.harness_context.data
            build_result: scafld-build.result.data
            review_result: scafld-review.result.data
            completion_result: scafld-complete.result.data
            status_snapshot: scafld-final-status.result.data
            draft_pull_request: package-pull-request.draft_pull_request.data
            pull_request_outbox_entry: push-pull-request.outbox_entry
            push_result: push-pull-request.push
        - id: push-feed-entry
          label: update source thread feed
          skill: ./push-outbox
          scopes:
            - thread:push
          context:
            thread: push-pull-request.thread
            outbox_entry: package-feed-entry.outbox_entry.data
            draft_pull_request: package-pull-request.draft_pull_request.data
          inputs:
            fixture: $input.fixture
            workspace_path: $input.workspace_path
            next_status: published
      policy:
        guards:
          - step: write-fix
            field: author-fix.fix_bundle.data.files
            not_equals: []
