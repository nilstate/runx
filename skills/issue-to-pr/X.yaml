              - fixture

              Files impacted:
              - `README.md`

              Invariants:
              - bounded_scope

              Related docs:
              - none

              ## Objectives

              - Replace the fixture README text with approved guidance.

              ## Scope

              - `README.md`

              ## Dependencies

              - None.

