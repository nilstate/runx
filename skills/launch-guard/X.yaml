skill: launch-guard
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: passing-release-candidate-yields-go-proposal
      runner: decide
      inputs:
        release_candidate:
          version: "1.4.0"
          diff_ref: "compare/v1.3.9...v1.4.0"
          test_results:
            - name: unit
              status: pass
              source: "ci/unit#881"
            - name: integration
              status: pass
              source: "ci/integration#881"
            - name: security
              status: pass
              source: "ci/security#881"
          rollback_plan:
            tested: true
            steps:
              - "Revert to image registry.example/app:1.3.9"
              - "Restore feature flag launch_guard_rollout=false"
          observability_plan:
            dashboards:
              - "https://metrics.example.com/d/app-release"
            alerts:
              - "release-error-rate"
          changelog:
            entries:
              - "Adds launch readiness gating for release owners."
          risks: []
        launch_policy:
          required_checks:
            - unit
            - integration
            - security
          max_open_risk: 0
          rollback_required: true
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: failing-required-check-yields-no-go
      runner: decide
      inputs:
        release_candidate:
          version: "1.4.1"
          diff_ref: "compare/v1.4.0...v1.4.1"
          test_results:
            - name: unit
              status: pass
              source: "ci/unit#882"
            - name: integration
              status: fail
              source: "ci/integration#882"
          rollback_plan:
            tested: true
            steps:
              - "Revert to image registry.example/app:1.4.0"
          observability_plan:
            dashboards:
              - "https://metrics.example.com/d/app-release"
            alerts:
              - "release-error-rate"
          changelog:
            entries:
              - "Attempts a release while integration is failing."
          risks:
            - id: "auth-flow-regression"
              status: open
        launch_policy:
          required_checks:
            - unit
            - integration
          max_open_risk: 0
          rollback_required: true
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: missing-release-candidate-fails-closed
      runner: decide
      inputs:
        launch_policy:
          required_checks:
            - unit
          max_open_risk: 0
          rollback_required: true
      expect:
        status: failure

runners:
  decide:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    outputs:
      decision: string
      readiness_report: json
      release_proposal: json
    artifacts:
      wrap_as: launch_guard_decision
      packet: runx.launch_guard.v1
    inputs:
      release_candidate:
        type: json
        required: true
        description: Release candidate with version, diff_ref, test_results, rollback_plan, observability_plan, and changelog.
      launch_policy:
        type: json
        required: true
        description: Launch gate policy with required_checks, max_open_risk, and rollback_required.
