skill: vault-unseal
version: "0.3.1"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  runtime_path: vault
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

input_definitions:
  secret_ref:
    type: string
    required: true
    description: Opaque vault, secret, or handle reference; never a secret value.
    schema: { pattern: '^(?:vault|secret|handle)://[A-Za-z0-9._/-]+$' }
  purpose:
    type: string
    required: true
    description: Bounded reason the handle is needed.
    schema: { minLength: 1, maxLength: 500 }
  ttl:
    type: string
    required: true
    description: Time-to-live from one minute through one hour.
    schema: { pattern: '^[0-9]+[mh]$' }
  scope:
    type: object
    required: true
    description: Exact resource and action the opaque handle may unlock, with an optional bounded path.
    schema:
      required: [resource, action]
      properties:
        resource: { type: string, minLength: 1, maxLength: 512 }
        action: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 2048 }

runners:
  vault-unseal:
    default: true
    type: javascript
    module: vault-unseal.mjs
    outputs:
      unseal_plan: object
    artifacts:
      named_emits:
        unseal_plan: unseal_plan
      packets:
        unseal_plan: runx.unseal.v1
    inputs:
      secret_ref:
        definition: secret_ref
      purpose:
        definition: purpose
      ttl:
        definition: ttl
      scope:
        definition: scope
      principal:
        type: string
        required: true
        description: Principal attributed to the future access.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the downstream approver.
    examples:
      - secret_ref: vault://drive/service-account
        purpose: Sign one Drive export request for the monthly reports job.
        ttl: 10m
        scope: { resource: drive.files, action: export, path: /reports/* }
        principal: svc/report-exporter
        policy_notes: The handle is limited to one monthly export.

  execute:
    type: graph
    inputs:
      provider:
        type: string
        required: true
        description: Expected configured vault provider name.
      secret_ref:
        definition: secret_ref
      purpose:
        definition: purpose
      ttl:
        definition: ttl
      scope:
        definition: scope
      principal:
        type: string
        required: true
        description: Principal receiving the future opaque handle.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the approver and provider.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact unseal request.
    examples:
      - provider: vault
        secret_ref: vault://drive/service-account
        purpose: Sign one Drive export request for the monthly reports job.
        ttl: 10m
        scope: { resource: drive.files, action: export, path: /reports/* }
        principal: svc/report-exporter
        policy_notes: The handle is limited to one monthly export.
        idempotency_key: 8f347ca0-d2f6-49d9-bdbc-b7d0175d87bc
    graph:
      name: vault-unseal-execute
      result_from: [readback]
      steps:
        - id: plan
          inputs:
            secret_ref: $input.secret_ref
            purpose: $input.purpose
            ttl: $input.ttl
            scope: $input.scope
            principal: $input.principal
            policy_notes: $input.policy_notes
          run:
            type: javascript
            module: vault-unseal.mjs
            outputs:
              unseal_plan: object
          artifacts:
            named_emits:
              unseal_plan: unseal_plan
            packets:
              unseal_plan: runx.unseal.v1

        - id: issue-handle
          when:
            field: plan.unseal_plan.data.decision
            equals: ready_for_approval
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes:
            - secret.unseal
          policy:
            provider_permission:
              verb: write
          inputs:
            operation: secret.unseal
            target: $input.secret_ref
            expected_provider: $input.provider
            idempotency_key: $input.idempotency_key
            result_fields: [handle_ref, expires_at, status]
            input:
              secret_ref: $input.secret_ref
              purpose: $input.purpose
              ttl: $input.ttl
              scope: $input.scope
              principal: $input.principal

        - id: readback
          when:
            field: plan.unseal_plan.data.decision
            equals: ready_for_approval
          tool: provider.read
          scopes:
            - handle.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: handle.read
            target: $input.secret_ref
            expected_provider: $input.provider
            result_fields: [handle_ref, expires_at, status]
          context:
            expected_result: issue-handle.provider_operation.data.result
            input: issue-handle.provider_operation.data.result
