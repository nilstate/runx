name: governed-outbound-default-delivers-and-verifies
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [send-as, redact-pii]
    request: Fetch, scrub, authorize, and deliver this content to the exact outbound target.
    expected_outcome: Reuse the scrubbed digest, deliver once after approval, and return provider readback.
  - mode: composed
    request: Continue outbound delivery from this bounded source and exact target.
    expected_outcome: Reuse fetch and redaction evidence without refetching, rescrubbing, or duplicating delivery.
    prior_evidence:
      - The allowlisted source, deterministic redaction result, and exact connector target supplied in the fixture.
    must_not_repeat:
      - Do not fetch the source again after its digest is admitted.
      - Do not send again after provider readback exists.
inputs:
  url: https://fixture.runx.invalid/source
  allowlist: [fixture.runx.invalid]
  channel: "#incidents"
  principal: account:ops-bot
  connector: { provider: slack, target: channel:incidents }
caller:
  http_responses:
    "https://fixture.runx.invalid/source":
      status: 200
      headers: { content-type: text/plain }
      body: hello world
  answers:
    agent_task.redact-pii-detect.output:
      redaction_draft:
        decision: ready
        detected: []
        residual_risk: { level: low, reason_code: none }
    agent_task.send-as.output:
      send_plan:
        decision: ready
        action_family: send-as
        principal: { type: account, ref: account:ops-bot }
        provider: { name: slack, account_ref: incidents, runtime_path: provider.send }
        send_class: status
        channel: chat
        audience: { type: channel, ref: "#incidents", requires_reconfirmation: false }
        content: { draft_ref: governed-outbound:redacted-content, digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9, subject_or_title: Incident update }
        gates: { preflight_required: true, human_approval_required: true, approval_ref: send-as.live-send.approval }
        blockers: []
        provider_actions: [message.send]
        evidence_refs: [sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9]
        success_checkpoint: { milestone: send_ready_for_approval, description: The exact scrubbed message is ready for provider delivery. }
  provider_responses:
    principal_id: outbound-fixture
    grants:
      - grant_id: outbound-fixture
        provider: slack
        scopes: [message.send, message.read]
    operations:
      - grant_id: outbound-fixture
        operation: message.send
        target: channel:incidents
        access: mutate
        result: { message_id: msg_incident_001, principal_ref: account:ops-bot, audience_ref: "#incidents", content_digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9, status: sent, sent_at: "2026-08-11T00:00:00Z", idempotency_key: $request.idempotency_key }
      - grant_id: outbound-fixture
        operation: message.read
        target: channel:incidents
        access: read
        result: { message_id: msg_incident_001, principal_ref: account:ops-bot, audience_ref: "#incidents", content_digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9, status: sent, sent_at: "2026-08-11T00:00:00Z", idempotency_key: $previous.idempotency_key }
  approvals:
    "provider-effect:sha256:9806544d0c10b0011dbb04ce21acda01217f84c41983312e90996047eaac1d8c": true
expect:
  status: sealed
  steps: [fetch-source, scrub-content, send]
  receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
metadata: { public_skill: governed-outbound, source_case: direct-default-success, source: skills-fixture }
