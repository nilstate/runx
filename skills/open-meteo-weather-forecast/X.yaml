skill: open-meteo-weather-forecast
version: "0.1.3"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/weather-forecast
  provider: open-meteo
  runtime_path: http
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none

runners:
  main:
    default: true
    type: graph
    inputs:
      name:
        type: string
        required: true
        description: City or place name to resolve.
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
      forecast_days:
        type: string
        required: false
        default: "3"
        description: Number of forecast days to request.
    graph:
      name: open-meteo-weather-forecast
      result_from: [locate, forecast]
      steps:
        - id: locate
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: locate
                method: GET
                url: https://geocoding-api.open-meteo.com/v1/search
                query:
                  name: $input.name
                  count: "5"
                  language: en
                  format: json
                headers:
                  accept: application/json
            allowed_hosts: [geocoding-api.open-meteo.com]
            stop_on_error: true
        - id: forecast
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: forecast
                method: GET
                url: https://api.open-meteo.com/v1/forecast
                query:
                  latitude: $input.latitude
                  longitude: $input.longitude
                  current: temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m
                  daily: weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max
                  timezone: auto
                  forecast_days: $input.forecast_days
                headers:
                  accept: application/json
            allowed_hosts: [api.open-meteo.com]
            stop_on_error: true
  air_quality:
    type: graph
    inputs:
      name:
        type: string
        required: true
        description: City or place name to resolve.
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
    graph:
      name: open-meteo-air-quality
      result_from: [locate, air_quality]
      steps:
        - id: locate
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: locate
                method: GET
                url: https://geocoding-api.open-meteo.com/v1/search
                query:
                  name: $input.name
                  count: "5"
                  language: en
                  format: json
                headers:
                  accept: application/json
            allowed_hosts: [geocoding-api.open-meteo.com]
            stop_on_error: true
        - id: air_quality
          tool: http.read
          scopes: [net:http]
          inputs:
            requests:
              - id: air_quality
                method: GET
                url: https://air-quality-api.open-meteo.com/v1/air-quality
                query:
                  latitude: $input.latitude
                  longitude: $input.longitude
                  current: pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,european_aqi,us_aqi
                  timezone: auto
                headers:
                  accept: application/json
            allowed_hosts: [air-quality-api.open-meteo.com]
            stop_on_error: true
