catalog:
  kind: skill
  audience: operator
  visibility: public
  role: utility

runners:
  - type: agent-task
    agent: utility
    task: markdown-toc
    description: Generate a table of contents from markdown input
    inputs:
      content:
        type: string
        description: Markdown content to parse
        required: true
    artifacts:
      wrap_as: result
      packet:
        format: json

harness:
  - case: basic-toc
    description: Generates TOC from sample markdown
    input:
      content: "# A\n\n## B\n\n### C"
    expect:
      status: sealed
  - case: empty-input
    description: Empty content returns empty array
    input:
      content: ""
    expect:
      status: sealed
  - case: no-headings
    description: Plain text with no headings returns empty array
    input:
      content: "Just some text\n\nNo headings here"
    expect:
      status: sealed
