skill: markdown-toc
version: 0.1.0

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

policy:
  scopes: []
  network: false
  allow_unsafe: false

harness:
  cases:
    - name: markdown-toc-extracts-simple-headings
      inputs:
        content: |
          # Title
          ## Section 1
          Some content here.
          ### Subsection 1.1
          More content.
          ## Section 2
          Final content.
      caller:
        answers:
          agent_task.markdown-toc.output:
            toc:
              - level: 1
                text: Title
                anchor: title
                children:
                  - level: 2
                    text: Section 1
                    anchor: section-1
                    children:
                      - level: 3
                        text: Subsection 1.1
                        anchor: subsection-11
                  - level: 2
                    text: Section 2
                    anchor: section-2
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: markdown-toc-empty-input
      inputs:
        content: "Just a paragraph with no headings.\n\nAnother paragraph."
      caller:
        answers:
          agent_task.markdown-toc.output:
            toc: []
            note: empty
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: markdown-toc-requires-content
      inputs: {}
      expect:
        status: needs_agent

outputs:
  toc:
    type: array
    description: "Structured table of contents entries"
  note:
    type: string
    description: "Contextual note, such as 'empty' when no headings found"

emits:
  - runx.receipt.v1

runners:
  markdown-toc:
    default: true
    type: agent-task
    agent: utility
    task: markdown-toc
    outputs:
      toc: array
      note: string
    artifacts:
      wrap_as: toc_packet
      packet: runx.toc.v1
    inputs:
      content:
        type: string
        required: true
        description: "Markdown text to analyze for table of contents generation."
