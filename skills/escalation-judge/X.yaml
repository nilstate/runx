skill: escalation-judge
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: sealed_priority_escalation
      runner: default
      inputs:
        triage_packet:
          classification: billing_outage
          severity: sev1
          confidence: 0.93
        thread_body: "Enterprise renewal blocked; CFO says they will cancel unless the billing outage is prioritized today."
        policy_rules:
          severity_order:
            - sev4
            - sev3
            - sev2
            - sev1
          severity_thresholds:
            priority_support:
              name: sev2_or_higher_priority_support
              minimum_severity: sev2
          churn_risk_signals:
            - name: renewal_blocked
              phrases:
                - renewal blocked
                - will cancel
              lane: priority_support
          escalation_lanes:
            priority_support:
              target_rail: slack://support-priority
              driver: slack-notify
        aggregate_id: thread:priority-001
        expected_version: 0
        idempotency_key: thread:priority-001:escalation:v1
      expect:
        status: sealed
    - name: stop_no_threshold_no_change
      runner: default
      inputs:
        triage_packet:
          classification: how_to
          severity: sev4
          confidence: 0.88
        thread_body: "Customer asks where to find the CSV export setting. No outage, legal risk, churn threat, or executive visibility."
        policy_rules:
          severity_order:
            - sev4
            - sev3
            - sev2
            - sev1
          severity_thresholds:
            priority_support:
              name: sev2_or_higher_priority_support
              minimum_severity: sev2
          churn_risk_signals:
            - name: renewal_blocked
              phrases:
                - renewal blocked
                - will cancel
              lane: priority_support
          escalation_lanes:
            priority_support:
              target_rail: slack://support-priority
              driver: slack-notify
        aggregate_id: thread:howto-001
        expected_version: 0
        idempotency_key: thread:howto-001:escalation:v1
      expect:
        status: sealed

policy:
  allow:
    - provider: data-source
      method: READ
      scope: runx:data:read
    - provider: data-source
      method: APPEND
      scope: runx:data:append
  deny:
    - slack_post
    - outbound_send
    - undeclared_escalation_lane
    - invented_severity
    - invented_churn_signal

emits:
  - name: escalation_judgment
    packet: runx.escalation_judgment.v1

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    timeout_seconds: 30
    inputs:
      triage_packet:
        type: json
        required: true
      thread_body:
        type: string
        required: true
      policy_rules:
        type: json
        required: true
      aggregate_id:
        type: string
        required: true
      expected_version:
        type: number
        required: true
      idempotency_key:
        type: string
        required: true
