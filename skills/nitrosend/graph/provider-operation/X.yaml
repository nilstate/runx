skill: nitrosend-provider-operation
version: "0.1.0"
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: graph-stage
  part_of:
    - runx/nitrosend
harness:
  cases:
    - name: blocks-unknown-operation-before-transport
      runner: read
      inputs:
        operation: unknown
        arguments: {}
      expect:
        status: sealed
        steps: [prepare, blocked]
        step_outputs:
          blocked:
            subset:
              provider_evidence:
                data:
                  decision: needs_input
                  provider: nitrosend
                  operation: unknown
                  evidence: null
        receipt: { schema: runx.receipt.v1 }
runners:
  read:
    default: true
    type: graph
    inputs:
      operation:
        type: string
        required: true
        description: Bounded Nitrosend read operation.
      arguments:
        type: json
        required: false
        description: Arguments for the selected operation.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    graph:
      name: nitrosend-provider-read
      result_from: [normalize, blocked]
      steps:
        - id: prepare
          inputs:
            mode: read
            operation: $input.operation
            arguments: $input.arguments
            brand_sid: $input.brand_sid
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: prepareOperation
            outputs:
              operation_plan: object
        - id: request
          when:
            field: prepare.operation_plan.decision
            equals: ready
          tool: http.query
          scopes: [nitrosend:read, net:http]
          inputs:
            stop_on_error: true
          context:
            requests: prepare.operation_plan.requests
            allowed_hosts: prepare.operation_plan.allowed_hosts
            auth: prepare.operation_plan.auth
        - id: normalize
          when:
            field: prepare.operation_plan.decision
            equals: ready
          context:
            operation_plan: prepare.operation_plan
            http_execution: request.http_execution.data
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: normalizeOperation
            outputs:
              provider_evidence:
                type: object
                schema:
                  required: [decision, provider, mode, operation, tool, provider_ref, result, evidence, blockers]
                  additionalProperties: false
                  properties:
                    decision: { type: string, enum: [ok, needs_input, provider_error, refused] }
                    provider: { const: nitrosend }
                    mode: { type: string, enum: [read, act] }
                    operation: { type: [string, "null"] }
                    tool: { type: [string, "null"] }
                    provider_ref: { type: [string, "null"] }
                    result:
                      type: [object, "null"]
                      additionalProperties: true
                    evidence:
                      type: [object, "null"]
                      required: [request_id, http_status, body_digest, credential_material]
                      additionalProperties: false
                      properties:
                        request_id: { type: string }
                        http_status: { type: number }
                        body_digest: { type: string }
                        credential_material: { const: redacted }
                    blockers:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 4000 }
          artifacts:
            named_emits:
              provider_evidence: provider_evidence
            packets:
              provider_evidence: nitrosend.provider_evidence.v1
        - id: blocked
          when:
            field: prepare.operation_plan.decision
            not_equals: ready
          context:
            operation_plan: prepare.operation_plan
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: blockedOperation
            outputs:
              provider_evidence: object
          artifacts:
            named_emits:
              provider_evidence: provider_evidence
            packets:
              provider_evidence: nitrosend.provider_evidence.v1
  act:
    type: graph
    inputs:
      operation:
        type: string
        required: true
        description: Bounded Nitrosend mutation operation.
      arguments:
        type: json
        required: true
        description: Arguments for the selected operation.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    graph:
      name: nitrosend-provider-act
      result_from: [normalize, blocked]
      steps:
        - id: prepare
          inputs:
            mode: act
            operation: $input.operation
            arguments: $input.arguments
            brand_sid: $input.brand_sid
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: prepareOperation
            outputs:
              operation_plan: object
        - id: request
          when:
            field: prepare.operation_plan.decision
            equals: ready
          tool: http.execute
          scopes: [nitrosend:write, net:http]
          mutation: true
          idempotency_key: nitrosend-provider-operation
          inputs:
            stop_on_error: true
          context:
            requests: prepare.operation_plan.requests
            allowed_hosts: prepare.operation_plan.allowed_hosts
            auth: prepare.operation_plan.auth
        - id: normalize
          when:
            field: prepare.operation_plan.decision
            equals: ready
          context:
            operation_plan: prepare.operation_plan
            http_execution: request.http_execution.data
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: normalizeOperation
            outputs:
              provider_evidence: object
          artifacts:
            named_emits:
              provider_evidence: provider_evidence
            packets:
              provider_evidence: nitrosend.provider_evidence.v1
        - id: blocked
          when:
            field: prepare.operation_plan.decision
            not_equals: ready
          context:
            operation_plan: prepare.operation_plan
          run:
            type: javascript
            module: nitrosend-operation.mjs
            export: blockedOperation
            outputs:
              provider_evidence: object
          artifacts:
            named_emits:
              provider_evidence: provider_evidence
            packets:
              provider_evidence: nitrosend.provider_evidence.v1
