skill: openapi-adapter
version: "0.1.0"
runners:
  default:
    default: true
    type: external-adapter
    external_adapter:
      manifest_path: manifest.json
    environment:
      optional: [RUNX_OPENAPI_BASE_URL]
    scopes: [net:http]
    inputs:
      operation_id:
        type: string
        required: true
        description: The OpenAPI operationId to invoke.
      petId:
        type: string
        required: false
        description: Path parameter for the getPet operation.
      fields:
        type: string
        required: false
        description: Optional query parameter.
