skill: github-mcp-pr-review-note
version: "0.1.0"
runners:
  default:
    default: true
    type: mcp
    server:
      command: node
      args:
        - ../../../fixtures/runtime/adapters/mcp/github-stdio-server.mjs
    tool: github_pr_review_note
    arguments:
      repository: "{{repository}}"
      number: "{{pr_number}}"
      body: "{{body}}"
    outputs:
      repository: string
      number: string
      review_note_id: string
      body_sha256: string
    mutating: true
    scopes: [github:write, net:http]
    timeout_seconds: 15
    inputs:
      repository:
        type: string
        required: true
        description: Repository slug.
      pr_number:
        type: string
        required: true
        description: Pull request number.
      body:
        type: string
        required: true
        description: Review note body.
