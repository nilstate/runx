skill: github-mcp-merge-pr
version: "0.1.0"
runners:
  default:
    default: true
    type: mcp
    server:
      command: node
      args:
        - ../../../fixtures/runtime/adapters/mcp/github-stdio-server.mjs
    tool: github_pr_merge
    arguments:
      repository: "{{repository}}"
      number: "{{pr_number}}"
    outputs:
      repository: string
      number: string
      merge_commit_sha: string
    scopes: [github:write, net:http]
    timeout_seconds: 15
    inputs:
      repository:
        type: string
        required: true
        description: Repository slug.
      pr_number:
        type: string
        required: true
        description: Pull request number.
