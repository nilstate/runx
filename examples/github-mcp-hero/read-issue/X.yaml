skill: github-mcp-read-issue
version: "0.1.0"
runners:
  default:
    default: true
    type: mcp
    server:
      command: node
      args:
        - ../../../fixtures/runtime/adapters/mcp/github-stdio-server.mjs
    tool: github_issue_read
    arguments:
      repository: "{{repository}}"
      number: "{{issue_number}}"
    outputs:
      repository: string
      number: string
      title: string
      state: string
      body: string
    scopes: [github:read, net:http]
    timeout_seconds: 15
    inputs:
      repository:
        type: string
        required: true
        description: Repository slug.
      issue_number:
        type: string
        required: true
        description: Issue number.
