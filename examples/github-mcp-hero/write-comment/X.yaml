skill: github-mcp-write-comment
version: "0.1.0"
runners:
  default:
    default: true
    type: mcp
    server:
      command: node
      args:
        - ../../../fixtures/runtime/adapters/mcp/github-stdio-server.mjs
    tool: github_issue_comment
    arguments:
      repository: "{{repository}}"
      number: "{{issue_number}}"
      body: "{{body}}"
    mutating: true
    scopes: [github:write, net:http]
    timeout_seconds: 15
    inputs:
      repository:
        type: string
        required: true
        description: Repository slug.
      issue_number:
        type: string
        required: true
        description: Issue number.
      body:
        type: string
        required: true
        description: Comment body.
