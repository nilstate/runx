[package]
name = "runx-contracts-derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Derive macros for runx contract JSON schema declarations."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runx", "schema", "derive", "agents", "contracts"]
categories = ["development-tools"]
include = ["Cargo.toml", "src/**/*.rs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[lints]
workspace = true
