skill: workspace-read
version: "0.1.0"
harness:
  cases:
    - name: reads-owned-skill-manual
      inputs:
        path: skills/workspace-read/SKILL.md
      expect:
        status: sealed
runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - -e
      - "const fs = require('node:fs'); const path = require('node:path'); const file = process.env.RUNX_INPUT_PATH; process.stdout.write(JSON.stringify({ cwd: process.cwd(), path: file, contents: fs.readFileSync(path.join(process.cwd(), file), 'utf8') }));"
    cwd: "{{env.RUNX_CWD}}"
    scopes: [fs:read]
    timeout_seconds: 10
    inputs:
      path:
        type: string
        required: true
        description: File path to read.
