name: executable-workspace-file
lane: deterministic
target:
  kind: tool
  ref: acme.executable
inputs:
  script_path: $RUNX_FIXTURE_ROOT/run.sh
workspace:
  executable_files:
    run.sh: |
      #!/bin/sh
      printf '{"mode":"executable"}\n'
expect:
  status: success
  output:
    subset:
      mode: executable
