skill: scafld-native-smoke
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    command: python3
    args:
      - ./run.py
    timeout_seconds: 60
    inputs:
      task_id:
        type: string
        required: false
        description: Optional scafld task id for the smoke workspace.
      title:
        type: string
        required: false
        description: Optional task title.
      scafld_bin:
        type: string
        required: false
        description: Explicit scafld executable path; defaults to SCAFLD_BIN.
