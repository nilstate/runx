skill: paid-echo
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    inputs:
      message:
        type: string
        required: true
      payment_capability_ref:
        type: string
        required: true
      payment_proof_ref:
        type: string
        required: true
    command: sh
    args: [./run.sh]
    timeout_seconds: 10
