skill: json-output
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    command: sh
    args:
      - ./run.sh
    timeout_seconds: 10
    inputs:
      message:
        type: string
        required: false
      recommendation:
        type: string
        required: false
      confidence:
        type: number
        required: false
      risk_score:
        type: number
        required: false
      budget:
        type: string
        required: false
    artifacts:
      wrap_as: result
