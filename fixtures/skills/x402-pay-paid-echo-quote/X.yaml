skill: pay-quote
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    inputs:
      payment_signal:
        type: object
        required: true
    command: sh
    args: [./run.sh]
    timeout_seconds: 10
    artifacts:
      named_emits:
        payment_quote_packet: runx.payment.payment_quote_packet.v1
