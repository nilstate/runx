skill: mutating-skill-level-retry
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    command: sh
    args:
      - ./run.sh
    timeout_seconds: 10
    retry:
      max_attempts: 2
    risk:
      mutating: true
    inputs:
      message:
        type: string
        required: true
