skill: pay-fulfill-rail
version: "0.1.0"
runners:
  default:
    default: true
    type: cli-tool
    inputs:
      reserved_payment_authority:
        type: object
        required: false
      spend_capability_ref:
        type: object
        required: false
      idempotency:
        type: object
        required: false
    command: sh
    args: [./run.sh]
    timeout_seconds: 10
    artifacts:
      named_emits:
        effect_evidence_packet: runx.payment.effect_evidence_packet.v1
