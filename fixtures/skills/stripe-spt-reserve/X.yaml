    default: true
    type: cli-tool
    inputs:
      payment_quote_packet:
        type: object
        required: true
    command: sh
    args: [./run.sh]
    timeout_seconds: 10
    artifacts:
      named_emits:
        payment_reservation_packet: runx.payment.payment_reservation_packet.v1
