name: outbox-build-pull-request-basic
lane: deterministic
target:
  kind: tool
  ref: outbox.build_pull_request
inputs:
  task_id: task-fixture
  thread_title: Improve docs
  thread_locator: issue://fixture/123
  target_repo: acme/widgets
  handoff_markdown: |
    # Handoff: Improve docs

    Status: completed
    Next: none
  build_result:
    status: review
    passed: 1
    failed: 0
  review_result:
    verdict: pass
  completion_result:
    status: completed
    title: Improve docs
    review:
      verdict: pass
  current_branch:
    branch: docs/fixture
  base: main
expect:
  status: success
  output:
    subset:
      draft_pull_request:
        data:
          task_id: task-fixture
          push_ready: true
      outbox_entry:
        data:
          entry_id: pull_request:task-fixture
          kind: pull_request
          status: proposed
          metadata:
            source_thread:
              required: true
              publish_mode: reply
              missing_behavior: fail_closed
              thread_locator: issue://fixture/123
