name: mandate-planner publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runx
        run: npm install -g @runxhq/cli
      - name: Run harness
        env:
          RUNX_RECEIPT_SIGN_KID: runx-demo-key
          RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
          RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
          RUNX_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNX_RECEIPT_DIR" skills/mandate-planner/evidence/ci
          runx --version | tee skills/mandate-planner/evidence/ci/runx-version.txt
          runx harness ./skills/mandate-planner --json | tee skills/mandate-planner/evidence/ci/harness.json
      - name: Publish
        env:
          RUNX_PUBLIC_API_TOKEN: ${{ secrets.RUNX_PUBLIC_API_TOKEN }}
        run: |
          set -euo pipefail
          ref="patrick6x6/mandate-planner@0.1.0"
          echo "$ref" > skills/mandate-planner/evidence/ci/registry-ref.txt
          if runx registry read "$ref" --registry https://api.runx.ai --json > skills/mandate-planner/evidence/ci/existing-registry-read.json; then
            node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('skills/mandate-planner/evidence/ci/publish.json', JSON.stringify({
            status: 'success',
            ref: 'patrick6x6/mandate-planner@0.1.0',
            status_note: 'already_published'
          }, null, 2));
          NODE
          else
            runx registry publish ./skills/mandate-planner/SKILL.md \
              --registry https://api.runx.ai \
              --version 0.1.0 \
              --json | tee skills/mandate-planner/evidence/ci/publish.json
            test -s skills/mandate-planner/evidence/ci/publish.json
          fi
      - name: Read registry
        run: |
          set -euo pipefail
          ref="$(cat skills/mandate-planner/evidence/ci/registry-ref.txt)"
          runx registry read "$ref" \
            --registry https://api.runx.ai \
            --json | tee skills/mandate-planner/evidence/ci/registry-read.json
      - name: Dogfood published skill
        env:
          RUNX_RECEIPT_SIGN_KID: runx-demo-key
          RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
          RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
          RUNX_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNX_RECEIPT_DIR"
          ref="$(cat skills/mandate-planner/evidence/ci/registry-ref.txt)"
          cat > skills/mandate-planner/evidence/ci/dogfood-input.json <<'JSON'
          {
            "objective": "Qualify five enterprise design partners without exceeding granted authority.",
            "proposed_charter": {
              "name": "design_partner_qualifier",
              "candidate_roster": [
                { "name": "research-lead", "role": "researcher", "skill": "market-research", "scope": "identify and qualify design partner candidates" },
                { "name": "outreach-coordinator", "role": "messenger", "skill": "outreach-drafting", "scope": "send approved outreach and collect responses" }
              ],
              "requested_limits": { "spend": 250, "max_turns": 8 },
              "done_check": "when qualified_design_partner_count equals 5 and spend_usd is at most 250"
            },
            "authority_grant": {
              "granted_roles": ["researcher", "messenger"],
              "granted_spend": 500,
              "max_turns": 10,
              "requires_human_approval_for": ["contract_signature", "payment_commitment"]
            }
          }
          JSON
          node <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(fs.readFileSync('skills/mandate-planner/evidence/ci/dogfood-input.json', 'utf8'));
          fs.writeFileSync('skills/mandate-planner/evidence/ci/dogfood-objective.txt', input.objective);
          fs.writeFileSync('skills/mandate-planner/evidence/ci/dogfood-proposed-charter.json', JSON.stringify(input.proposed_charter));
          fs.writeFileSync('skills/mandate-planner/evidence/ci/dogfood-authority-grant.json', JSON.stringify(input.authority_grant));
          NODE
          runx skill "$ref" \
            --registry https://api.runx.ai \
            --input objective="$(cat skills/mandate-planner/evidence/ci/dogfood-objective.txt)" \
            --input-json proposed_charter="$(cat skills/mandate-planner/evidence/ci/dogfood-proposed-charter.json)" \
            --input-json authority_grant="$(cat skills/mandate-planner/evidence/ci/dogfood-authority-grant.json)" \
            --json | tee skills/mandate-planner/evidence/ci/dogfood.json
          node <<'NODE'
          const fs = require('fs');
          const dogfood = JSON.parse(fs.readFileSync('skills/mandate-planner/evidence/ci/dogfood.json', 'utf8'));
          if (dogfood.status !== 'sealed') {
            throw new Error(`dogfood did not seal: ${dogfood.status}`);
          }
          if (dogfood.execution?.exit_code !== 0) {
            throw new Error(`dogfood process failed with exit ${dogfood.execution?.exit_code}: ${dogfood.execution?.stderr || ''}`);
          }
          if (dogfood.receipt?.seal?.disposition === 'failed') {
            throw new Error(`dogfood receipt sealed a failed disposition: ${dogfood.receipt?.seal?.summary || ''}`);
          }
          NODE
          find "$RUNX_RECEIPT_DIR" -type f | sort > skills/mandate-planner/evidence/ci/receipt-files.txt
          tar -C "$RUNX_RECEIPT_DIR" -czf skills/mandate-planner/evidence/ci/receipts.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mandate-planner-ci-evidence
          path: |
            skills/mandate-planner/evidence/ci
