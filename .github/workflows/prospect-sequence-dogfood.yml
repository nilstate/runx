name: prospect-sequence dogfood

on:
  push:
    branches:
      - prospect-sequence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dogfood:
    if: ${{ !contains(github.event.head_commit.message, '[skip dogfood]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospect-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download runx 0.6.13
        run: |
          curl -L -f -o /tmp/runx.tar.gz https://github.com/runxhq/runx/releases/download/cli-v0.6.13/runx-0.6.13-x86_64-unknown-linux-musl.tar.gz
          mkdir -p /tmp/runx
          tar -xzf /tmp/runx.tar.gz -C /tmp/runx
          find /tmp/runx -type f -name runx -exec chmod +x {} \;
          find /tmp/runx -type f -name runx -print -quit > /tmp/runx-path
          "$(cat /tmp/runx-path)" --version | tee skills/prospect-sequence/evidence/runx-version.txt
      - name: Run registry install and dogfood skill
        env:
          RUNX_RECEIPT_SIGN_KID: runx-runtime-prod-fixture-key
          RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
          RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
        run: |
          mkdir -p skills/prospect-sequence/evidence/dogfood-receipts skills/prospect-sequence/evidence/install
          RUNX="$(cat /tmp/runx-path)"
          "$RUNX" add vidshidden/prospect-sequence@sha-f1f58b597581 --registry https://api.runx.ai --to skills/prospect-sequence/evidence/install --json | tee skills/prospect-sequence/evidence/runx-add-output.json
          PROSPECT=$(jq -c '.prospect' skills/prospect-sequence/fixtures/public-sources.json)
          ICP=$(jq -c '.icp' skills/prospect-sequence/fixtures/public-sources.json)
          ALLOW=$(jq -c '.source_allowlist' skills/prospect-sequence/fixtures/public-sources.json)
          "$RUNX" skill vidshidden/prospect-sequence@sha-f1f58b597581 \
            --registry https://api.runx.ai \
            --input-json "prospect=$PROSPECT" \
            --input-json "icp=$ICP" \
            --input-json "source_allowlist=$ALLOW" \
            --json \
            -R skills/prospect-sequence/evidence/dogfood-receipts \
            | tee skills/prospect-sequence/evidence/dogfood-output.json
      - name: Verify dogfood receipts
        run: |
          RUNX="$(cat /tmp/runx-path)"
          "$RUNX" verify --receipt-dir skills/prospect-sequence/evidence/dogfood-receipts --allow-local-development-signatures --json | tee skills/prospect-sequence/evidence/dogfood-verify.json
          find skills/prospect-sequence/evidence/dogfood-receipts -type f -name '*.json' -maxdepth 3 | sort > skills/prospect-sequence/evidence/dogfood-receipt-files.txt
      - name: Commit evidence
        run: |
          rm -rf skills/prospect-sequence/evidence/install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/prospect-sequence/evidence
          git commit -m "Add prospect-sequence dogfood evidence [skip dogfood]" || exit 0
          git push origin HEAD:prospect-sequence
