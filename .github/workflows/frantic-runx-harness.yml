name: Frantic runx harness evidence

on:
  push:
    branches:
      - codex/frantic-skills-pack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      RUNX_RECEIPT_SIGN_KID: frantic-github-actions-public-test-key
      RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
      RUNX_RECEIPT_VERIFY_KID: frantic-github-actions-public-test-key
      RUNX_RECEIPT_VERIFY_ED25519_PUBLIC_KEY_BASE64: IVL40Zt5HSRFMkLhXy6rbLfP+ntqXtMAl5YOBpiB2xI=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/frantic-skills-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Prepare evidence directory
        run: |
          for skill in meeting-prep standup-digest receipt-evidence-bundle inbox-triage least-privilege-plan; do
            mkdir -p "docs/frantic/runx-harness/${skill}/receipts" ".runx/frantic-receipts/${skill}"
          done

      - name: Record runx version
        run: pnpm dlx @runxhq/cli@0.6.6 --version | tee docs/frantic/runx-harness/runx-version.txt

      - name: Run skill harnesses
        run: |
          for skill in meeting-prep standup-digest receipt-evidence-bundle inbox-triage least-privilege-plan; do
            pnpm dlx @runxhq/cli@0.6.6 harness "./skills/${skill}" \
              --receipt-dir ".runx/frantic-receipts/${skill}" \
              --json | tee "docs/frantic/runx-harness/${skill}/harness.json"
          done

      - name: Write receipt indexes
        run: |
          for skill in meeting-prep standup-digest receipt-evidence-bundle inbox-triage least-privilege-plan; do
            pnpm dlx @runxhq/cli@0.6.6 history --receipt-dir ".runx/frantic-receipts/${skill}" --json \
              > "docs/frantic/runx-harness/${skill}/receipt-history.json"
            for receipt in .runx/frantic-receipts/${skill}/*.json; do
              safe_name="$(basename "$receipt" | tr ':' '_')"
              cp "$receipt" "docs/frantic/runx-harness/${skill}/receipts/${safe_name}"
            done
          done

      - name: Verify sealed receipts
        run: |
          for skill in meeting-prep standup-digest receipt-evidence-bundle inbox-triage least-privilege-plan; do
            pnpm dlx @runxhq/cli@0.6.6 verify --receipt-dir ".runx/frantic-receipts/${skill}" --json \
              > "docs/frantic/runx-harness/${skill}/runx-verify.json"
          done

      - name: Write review report
        run: |
          {
            echo "# Frantic runx harness evidence"
            echo
            echo "- Official CLI: $(cat docs/frantic/runx-harness/runx-version.txt)"
            echo "- meeting-prep: docs/frantic/runx-harness/meeting-prep/harness.json"
            echo "- standup-digest: docs/frantic/runx-harness/standup-digest/harness.json"
            echo "- receipt-evidence-bundle: docs/frantic/runx-harness/receipt-evidence-bundle/harness.json"
            echo "- inbox-triage: docs/frantic/runx-harness/inbox-triage/harness.json"
            echo "- least-privilege-plan: docs/frantic/runx-harness/least-privilege-plan/harness.json"
            echo "- Receipt indexes, receipt JSON files, and runx verify reports are committed beside each harness output."
            echo "- Signing key is a public deterministic CI key for reproducible harness evidence; no private tokens or payout data are used."
          } > docs/frantic/runx-harness/report.md

      - name: Commit generated evidence
        run: |
          git config user.name "Jarvis-Codex"
          git config user.email "oneaipremium101@gmail.com"
          git add docs/frantic/runx-harness
          git diff --cached --quiet && exit 0
          git commit -m "docs(frantic): add runx harness evidence"
          git push origin HEAD:codex/frantic-skills-pack
