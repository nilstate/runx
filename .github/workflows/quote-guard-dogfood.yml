name: quote-guard dogfood

on:
  workflow_dispatch:
  push:
    branches:
      - quote-guard
    paths:
      - "skills/quote-guard/**"
      - ".github/workflows/quote-guard-dogfood.yml"

permissions:
  contents: write

jobs:
  dogfood:
    if: ${{ !contains(github.event.head_commit.message, '[skip dogfood]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runx 0.6.14
        run: |
          set -euo pipefail
          curl -L -s https://github.com/runxhq/runx/releases/download/cli-v0.6.14/runx-0.6.14-x86_64-unknown-linux-musl.tar.gz -o /tmp/runx.tar.gz
          mkdir -p /tmp/runx
          tar -xzf /tmp/runx.tar.gz -C /tmp/runx
          install -m 0755 "$(find /tmp/runx -type f -name runx | head -n 1)" /tmp/runx/runx
          /tmp/runx/runx --version
          echo "/tmp/runx" >> "$GITHUB_PATH"

      - name: Clean install published package
        run: |
          set -euo pipefail
          mkdir -p skills/quote-guard/evidence
          runx add vidshidden/quote-guard@sha-74fbe6322db5 \
            --registry https://api.runx.ai \
            --to skills/quote-guard/evidence/clean-install \
            --json | tee skills/quote-guard/evidence/clean-install.json

      - name: Dogfood published package
        env:
          RUNX_RECEIPT_SIGN_KID: runx-runtime-prod-fixture-key
          RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
          RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
        run: |
          set -euo pipefail
          mkdir -p skills/quote-guard/evidence/dogfood-receipts
          DEAL_ASK="$(jq -c '.deal_ask' skills/quote-guard/fixtures/in-policy-deal.json)"
          ACCOUNT_POLICY="$(jq -c '.account_policy' skills/quote-guard/fixtures/in-policy-deal.json)"
          QUOTE_HISTORY="$(jq -c '.quote_history' skills/quote-guard/fixtures/in-policy-deal.json)"
          runx skill vidshidden/quote-guard@sha-74fbe6322db5 \
            --registry https://api.runx.ai \
            --input-json deal_ask "$DEAL_ASK" \
            --input-json account_policy "$ACCOUNT_POLICY" \
            --input-json quote_history "$QUOTE_HISTORY" \
            --json \
            -R skills/quote-guard/evidence/dogfood-receipts \
            | tee skills/quote-guard/evidence/dogfood-output.json

      - name: Verify dogfood receipt
        env:
          RUNX_RECEIPT_VERIFY_KID: runx-runtime-prod-fixture-key
          RUNX_RECEIPT_VERIFY_ED25519_PUBLIC_KEY_BASE64: IVL40Zt5HSRFMkLhXy6rbLfP+ntqXtMAl5YOBpiB2xI=
        run: |
          set -euo pipefail
          runx verify \
            --receipt-dir skills/quote-guard/evidence/dogfood-receipts \
            --json | tee skills/quote-guard/evidence/dogfood-verify.json

      - name: Build evidence packet
        env:
          QUOTE_GUARD_PR_URL: https://github.com/runxhq/runx/pull/226
        run: |
          set -euo pipefail
          node skills/quote-guard/evidence/build-evidence.mjs

      - name: Commit dogfood evidence
        run: |
          set -euo pipefail
          receipt_file="$(find skills/quote-guard/evidence/dogfood-receipts -type f -name '*.json' | head -n 1)"
          if [ -n "$receipt_file" ]; then
            cp "$receipt_file" skills/quote-guard/evidence/dogfood-receipt.json
          fi
          git config user.name "VidsHidden"
          git config user.email "zhengxinyu515@gmail.com"
          git add skills/quote-guard/evidence/clean-install.json \
            skills/quote-guard/evidence/dogfood-output.json \
            skills/quote-guard/evidence/dogfood-verify.json \
            skills/quote-guard/evidence/dogfood-receipt.json \
            skills/quote-guard/evidence/evidence.json \
            skills/quote-guard/evidence/verification.json \
            skills/quote-guard/evidence/report.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add quote-guard dogfood evidence [skip dogfood]"
          git push
